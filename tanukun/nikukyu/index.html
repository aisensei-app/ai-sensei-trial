<title>あしのうら ぷにぷに</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<!-- 「ぷにっ」の文字だけ、ころんと太い丸文字（使う字だけ読みこむ） -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&display=swap&text=%E3%81%B7%E3%81%AB%E3%81%A3%E3%82%85%E3%80%9C">
<!--
  タヌくん：あしのうら ぷにぷに（お試し版。2026-11-04）
  ・絵：img/sit_soles.webp（ユーザーが描いた、切り株に座って足の裏を見せるタヌくん。腰みのの葉っぱがお股をしっかり隠している版）
        img/pads_mask.png（肉球の所だけ白い絵。tools/make_nikukyu_mask.py）
  ・肉球を押すと：押した所がくぼむ（左上から光が当たっている影＝くぼみの左上の内側が暗く、右下の内側が明るい・まわりの土手が明るい）
                  ＋中身が逃げるように、ふちが外へ押し出される。長押しで深く、なでるとくぼみが指についてくる
  ・エフェクト：押すと「ぷにっ」「ぷにゅ」「ぷにゅ〜」の文字／照れ笑いのときは、ときどきハート・大笑いのときは、ハートがいっぱい
  ・体の揺れ：照れ笑いのときは押すたびにおなかが少し「たぷん」／大笑いのときは笑うリズムで胸とおなかが「ゆさゆさ」
  ・表情3種類：ふつう／さわっている間は照れ笑い（img/sit_soles_smile.webp）／連打でくすぐったいときは大笑い（img/sit_soles_laugh.webp）
  ・はなすと、控えめに「ぷるん」と戻る。かたさは3種類（やわらか・ふつう・ハリあり）
  ・本編にはまだつないでいない（build_app.py にも入れていない）
-->
<style>
/* 一枚の画面：タヌくんの絵を幅いっぱいに。上にふきだし、下にボタン */
:root{
  --sand:#EFD7AE; --ink:#4A2C1A; --cream:#FFF6E6; --accent:#D9536A;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  --puni:"Mochiy Pop One","Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--sand);color:var(--ink);font-family:var(--display);overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.top{position:fixed;top:0;left:0;right:0;z-index:2;pointer-events:none;display:flex;gap:10px;align-items:flex-start;
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bubble{min-width:0;background:var(--cream);border:2.5px solid var(--ink);border-radius:16px;
  padding:8px 12px;font-weight:700;font-size:15px;line-height:1.4;box-shadow:0 3px 0 var(--ink)}
.bubble.bump{animation:bump .45s ease-out}
@keyframes bump{30%{transform:scale(1.06) rotate(-2deg)}60%{transform:scale(.98)}}
.count{margin-left:auto;flex:none;background:var(--cream);border:2.5px solid var(--ink);border-radius:999px;padding:4px 12px;
  font-weight:900;font-size:14px;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 var(--ink)}
.tag{position:fixed;z-index:2;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 58px);
  font-size:11px;font-weight:900;letter-spacing:.08em;background:var(--accent);color:var(--cream);border-radius:6px;padding:2px 8px;pointer-events:none}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:2;display:flex;flex-direction:column;align-items:center;gap:10px;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hint{font-size:13px;font-weight:700;text-align:center;background:rgba(255,246,230,.85);border-radius:999px;padding:3px 12px}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button{font:inherit;font-weight:900;font-size:14px;color:var(--ink);background:var(--cream);border:2.5px solid var(--ink);border-radius:999px;
  padding:7px 16px;box-shadow:0 3px 0 var(--ink);cursor:pointer}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#loading{position:fixed;inset:0;display:grid;place-items:center;font-weight:900}
/* 押したときの「ぷにっ」（本編のおなかの「ぽん！」と同じ見た目） */
#fx{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.pop-word{position:absolute;transform:translate(-50%,-50%);font-family:var(--puni);font-size:clamp(28px,8.4vw,38px);font-weight:400;
  color:#fff;-webkit-text-stroke:7px #C8641E;paint-order:stroke fill;text-shadow:0 3px 0 #9E4A12,0 0 10px rgba(255,170,120,.6);
  white-space:nowrap;opacity:0;will-change:transform,opacity}
</style>

<canvas id="stage" aria-label="切り株に座って、足の裏を見せるタヌくん。肉球を押すと、ぷにっとくぼむ"></canvas>
<div id="loading">よみこみ中…</div>
<div id="fx" aria-hidden="true"></div>
<div class="top">
  <div class="bubble" id="bubble">ぼくの肉球、さわってみる？</div>
  <div class="count" id="count">🐾 0</div>
</div>
<div class="tag">お試し版</div>
<div class="bottom">
  <div class="hint">肉球を押してね。長押し・なでるのも OK</div>
  <div class="btns">
    <button id="feel" type="button">かたさ：ふつう</button>
    <button id="snd" type="button" aria-pressed="true">音 ON</button>
  </div>
</div>

<script>
(() => {
'use strict';
const SRC_IMG = 'img/sit_soles.webp', SRC_MASK = 'img/pads_mask.png';
// 表情は3種類（同じ構図で顔だけちがう絵。2026-11-04 ユーザーが描いた）：ふつう（SRC_IMG）／照れ笑い＝さわっている間／大笑い＝連打でくすぐったいとき
const SRC_SMILE = 'img/sit_soles_smile.webp', SRC_LAUGH = 'img/sit_soles_laugh.webp';
const IW = 1199, IH = 1312;
const cv = document.getElementById('stage'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, S = 1, OX = 0, OY = 0;

/* 肉球のだいたいの場所（元の絵の座標。tools/make_nikukyu_mask.py の PADS と同じ） */
const PADS = [[322, 995, 35, 41], [370, 935, 37, 42], [439, 907, 33, 42], [512, 945, 34, 42], [443, 1047, 97, 73],
              [760, 953, 36, 42], [837, 917, 37, 42], [910, 947, 37, 40], [940, 1012, 33, 40], [810, 1050, 95, 73]];
const pads = PADS.map(([cx, cy, rx, ry], i) => ({
  i, cx, cy, rx, ry, big: rx > 60,
  dent: 0, dentV: 0,          // 沈み（0〜1.3 くらい）
  qx: cx, qy: cy,             // 押している所（元の絵の座標）
  press: null,                // { id, t0 }
  patch: null, pctx: null, data: null, x0: 0, y0: 0, w: 0, h: 0
}));

/* かたさ（くらべて選べる）。k＝ばねの強さ、cPress/cFree＝押している間・はなしたあとの止まりやすさ
   depth＝沈む深さ、bulge＝ふちが押し出される大きさ、snap＝はなしたときの反動（控えめに） */
const FEEL = [
  { name: 'やわらか', k: 230, cPress: 14, cFree: 10, depth: 1.25, bulge: 1.3, snap: 0.35 },
  { name: 'ふつう',   k: 330, cPress: 18, cFree: 12, depth: 1.0,  bulge: 1.0, snap: 0.3 },
  { name: 'ハリあり', k: 560, cPress: 24, cFree: 15, depth: 0.7,  bulge: 0.7, snap: 0.3 }
];
let feel = 1;

/* ---------- 絵の読みこみ ---------- */
let img = null, src = null, mask = null, bg = null, smileImg = null, laughImg = null;
let smile = 0, smileUntil = 0;   // 照れ笑いの濃さ（0〜1）と、照れ笑いでいる時刻
let laugh = 0, laughUntil = 0;   // 大笑いの濃さと、大笑いでいる時刻（連打のあと 1.6 秒）
let smileSrc = null, laughSrc = null;   // 表情の絵の色（体の揺れを描くときに、いまの表情と同じ色にする）
/* 体の揺れ（2026-11-04）：照れ笑い＝押すたびにおなかが少し「たぷん」／大笑い＝笑うリズムで、胸とおなかが「ゆさゆさ」
   位置は元の絵の座標。y はばねの上下の動き（ピクセル） */
const BODY = {
  // 照れ笑いのときの、おなかの範囲（2026-11-04 広げた：300×150 → 330×175。大笑いの bellyWide より少しせまい）
  belly: { cx: 610, cy: 595, rx: 330, ry: 175, y: 0, v: 0, x: 0, vx: 0 },   // x・vx：横の揺れ（大笑いに入った瞬間の「ぷるん！」）
  // 大笑いのときの、おなかの広い範囲（2026-11-04：ぽんぽこリズムくらい。おなか全体＋腰みのの上まで）
  bellyWide: { cx: 610, cy: 600, rx: 360, ry: 200 },
  // 胸は、揺れる所を少し下に（2026-11-04 cy 400 → 425。胸のふくらみの下のほうが、よく揺れる）
  chestL: { cx: 470, cy: 425, rx: 135, ry: 72, y: 0, v: 0 },
  chestR: { cx: 760, cy: 425, rx: 135, ry: 72, y: 0, v: 0 }
};
const BX0 = 245, BY0 = 325, BW = 730, BH = 480;   // 揺らす範囲（おなか・胸をかこむ四角）
let bodyPatch = null, bodyCtx = null, bodyData = null, bodyW = null;
let laughBeat = 0;
// 大笑いに入った瞬間の「ぷるん！」：おなかを横に大きく振って、上下にもはずませる（胸もいっしょに）
function laughPurun() {
  const B = BODY.belly, dir = Math.random() < 0.5 ? -1 : 1;
  B.vx += dir * 520; B.v += 330;
  BODY.chestL.v += 200; BODY.chestR.v += 185;
}
function load(u) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = u; }); }
function pixels(im) {
  const c = document.createElement('canvas'); c.width = IW; c.height = IH;
  const x = c.getContext('2d'); x.drawImage(im, 0, 0, IW, IH);
  return x.getImageData(0, 0, IW, IH).data;
}

/* ---------- 画面の大きさ ---------- */
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  // 足の裏（x 250〜1000）が幅に入る大きさ。縦長の画面では、絵の上下に余白（ぼかした絵）
  S = Math.min(W / 800, H / 1250);
  OX = W / 2 - 610 * S;
  OY = Math.max(0, (H - IH * S) / 2 + 10);
  if (img) makeBg();
}
function makeBg() {
  bg = document.createElement('canvas'); bg.width = Math.max(1, Math.round(W / 4)); bg.height = Math.max(1, Math.round(H / 4));
  const b = bg.getContext('2d'), s = Math.max(bg.width / IW, bg.height / IH);
  b.drawImage(img, (bg.width - IW * s) / 2, (bg.height - IH * s) / 2, IW * s, IH * s);   // 小さく描いて引きのばす＝ぼかし
}
const toImg = (x, y) => [(x - OX) / S, (y - OY) / S];

/* ---------- 音・ふるえ ---------- */
let ac = null, soundOn = true;
function audio() {
  if (!soundOn) return null;
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function puni(strength, up) {
  const a = audio(); if (!a) return;
  const t = a.currentTime, o = a.createOscillator(), g = a.createGain(), f = a.createBiquadFilter();
  const base = up ? 400 : 240;
  o.type = 'sine';
  o.frequency.setValueAtTime(base * (1 + 0.2 * Math.random()), t);
  o.frequency.exponentialRampToValueAtTime(up ? base * 1.4 : base * 0.55, t + 0.12);
  f.type = 'lowpass'; f.frequency.value = 1300;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.3 * strength, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.17);
  o.connect(f); f.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + 0.2);
}
function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

/* ---------- ふきだし ---------- */
const LINES = {
  tap:    ['ぷにっ♪', 'やわらかいでしょ〜', 'えへへ、肉球じまん♪', 'ぷにぷに〜', 'そこ、ぷにってするの'],
  tickle: ['あはは！ くすぐったいってば〜！', 'ひゃ〜っ、ゆびが かってに うごく〜', 'もう〜！ くすぐりすぎ〜！'],
  hold:   ['ぎゅ〜って されてる…', 'きみの手、あったかいね', 'じっと されると、てれちゃう…'],
  rub:    ['すりすり…きもちいい〜', 'あしのうら、マッサージ？ えへへ'],
  sole:   ['そこは、肉球じゃないよ〜', 'こっちの ぷにぷにを さわって♪'],
  hundred:['100ぷに！ ぷにぷにマスターだね〜！']
};
const bubble = document.getElementById('bubble');
let lastTalk = 0;
function say(kind, force) {
  const now = performance.now();
  if (!force && now - lastTalk < 1600) return;
  lastTalk = now;
  const list = LINES[kind];
  bubble.textContent = list[Math.floor(Math.random() * list.length)];
  bubble.classList.remove('bump'); void bubble.offsetWidth; bubble.classList.add('bump');
}

/* ---------- さわる ---------- */
let count = 0, holdTalked = false, rubDist = 0;
const taps = [], fingers = new Map();

/* ---------- 「ぷにっ」の文字（1秒以内に続けて押すと、ぷにっ → ぷにゅ → ぷにゅ〜 と変わる） ---------- */
const PUNI = ['ぷにっ', 'ぷにゅ', 'ぷにゅ〜'];
let puniIdx = 0, puniAt = 0;
const fx = document.getElementById('fx');
function popWord(x, y) {
  const t = performance.now();
  puniIdx = t - puniAt < 1000 ? (puniIdx + 1) % PUNI.length : 0;
  puniAt = t;
  const el = document.createElement('span');
  el.className = 'pop-word';
  el.textContent = PUNI[puniIdx];
  el.style.left = x + 'px'; el.style.top = y + 'px';
  fx.appendChild(el);
  // ゆっくり ふわ〜っと出て、上へただよいながら消える（連打で重なってもよい）
  const dx = (Math.random() - 0.5) * 36, rot = (Math.random() - 0.5) * 12;
  el.animate([
    { transform: 'translate(-50%, -40%) scale(.82) rotate(' + rot + 'deg)', opacity: 0 },
    { transform: 'translate(-50%, -85%) scale(1.04) rotate(' + rot * 0.6 + 'deg)', opacity: 1, offset: 0.3 },
    { transform: 'translate(calc(-50% + ' + dx * 0.5 + 'px), -125%) scale(1) rotate(' + rot * 0.3 + 'deg)', opacity: 0.95, offset: 0.6 },
    { transform: 'translate(calc(-50% + ' + dx + 'px), -190%) scale(.98) rotate(0deg)', opacity: 0 }
  ], { duration: 1600, easing: 'cubic-bezier(.25,.6,.35,1)' }).finished.then(() => el.remove(), () => el.remove());
}

/* ---------- ハート（表情に合わせて。顔のまわりから、ぽわぽわ） ---------- */
const hearts = [];
let heartAcc = 0;
const HEART_COLS = ['#FF6F9C', '#FF8FB1', '#FF5C8A', '#FFA3C0'];
function heartPath() {
  ctx.beginPath();
  ctx.moveTo(0, 7);
  ctx.bezierCurveTo(-11, -1, -9, -11, -3.5, -10);
  ctx.bezierCurveTo(-1.5, -9.5, -0.3, -8, 0, -6);
  ctx.bezierCurveTo(0.3, -8, 1.5, -9.5, 3.5, -10);
  ctx.bezierCurveTo(9, -11, 11, -1, 0, 7);
  ctx.closePath();
}
function addHeart(big) {
  // 顔のまわり（顔の中心＝元の絵の (600, 230)）の、左右と上から。顔の上には出さない（表情が見えるように）。外へ広がりながら上へ
  const rr = 175 + Math.random() * 70;
  const a = Math.random() < 0.5 ? Math.PI * (0.95 + Math.random() * 0.45) : Math.PI * (1.6 + Math.random() * 0.45);   // 左上〜左／右上〜右
  const ix = 600 + Math.cos(a) * rr * 1.05, iy = 230 + Math.sin(a) * rr * 0.9;
  const out = Math.cos(a) * (25 + Math.random() * 25);
  hearts.push({
    x: OX + ix * S, y: OY + iy * S, vx: out, vy: -(45 + Math.random() * 55),
    t: 0, life: 1.4 + Math.random() * 0.9, size: (big ? 1.1 : 0.9) + Math.random() * (big ? 0.9 : 0.4),
    rot: (Math.random() - 0.5) * 0.5, wa: 6 + Math.random() * 10, wf: 2 + Math.random() * 2, ph: Math.random() * 6,
    col: HEART_COLS[(Math.random() * HEART_COLS.length) | 0]
  });
  if (hearts.length > 80) hearts.shift();
}
function heartBurst(n) { for (let i = 0; i < n; i++) addHeart(true); }
function hitPad(ix, iy) {
  let best = null, bd = 1.2;
  pads.forEach((p) => { const d = Math.hypot((ix - p.cx) / p.rx, (iy - p.cy) / p.ry); if (d < bd) { bd = d; best = p; } });
  return best;
}
function clampToPad(p, ix, iy) {
  const u = (ix - p.cx) / p.rx, v = (iy - p.cy) / p.ry, d = Math.hypot(u, v), m = d > 0.85 ? 0.85 / d : 1;
  p.qx = p.cx + u * m * p.rx; p.qy = p.cy + v * m * p.ry;
}
cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (!img) return;
  audio();
  const [ix, iy] = toImg(e.clientX, e.clientY);
  const p = hitPad(ix, iy);
  if (!p) { say('sole'); return; }
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  fingers.set(e.pointerId, { pad: p, x: e.clientX, y: e.clientY });
  clampToPad(p, ix, iy);
  p.press = { id: e.pointerId, t0: performance.now() };
  holdTalked = false; rubDist = 0;
  puni(0.8, false); buzz(12);
  count++; document.getElementById('count').textContent = '🐾 ' + count;
  const now = performance.now();
  taps.push(now); while (taps.length && now - taps[0] > 2000) taps.shift();
  if (taps.length < 6) BODY.belly.v += 125;   // 照れ笑い：押すたびに、おなかが「たぷん」（2026-11-04 大きくした 55 → 90 → 125）
  if (taps.length >= 6) { say('tickle', taps.length === 6); laughUntil = now + 1600; }
  if (taps.length === 6) laughPurun();   // 大笑いに入った瞬間：ぽんぽこリズムの「〜」と同じくらいの「ぷるん！」
  else if (count === 100) say('hundred', true);
  else say('tap');
  popWord(e.clientX, e.clientY - 10);
  if (taps.length === 6) heartBurst(10);   // 大笑いになった瞬間に、ハートがぽわっ
});
cv.addEventListener('pointermove', (e) => {
  const f = fingers.get(e.pointerId); if (!f) return;
  rubDist += Math.hypot(e.clientX - f.x, e.clientY - f.y);
  f.x = e.clientX; f.y = e.clientY;
  const [ix, iy] = toImg(e.clientX, e.clientY);
  clampToPad(f.pad, ix, iy);   // くぼみが指についてくる（肉球の外に出たら、ふちで止まる）
  if (rubDist > 200) { rubDist = 0; say('rub'); puni(0.3, false); }
});
function release(e) {
  const f = fingers.get(e.pointerId); if (!f) return;
  fingers.delete(e.pointerId);
  const p = f.pad;
  if (p.press && p.press.id === e.pointerId) {
    const held = performance.now() - p.press.t0;
    p.press = null;
    smileUntil = performance.now() + 1200;
    p.dentV -= (8 + Math.min(8, held / 90)) * FEEL[feel].snap;   // はなすと、控えめに「ぷるん」
    puni(0.5, true); buzz(8);
  }
}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
document.getElementById('feel').addEventListener('click', (e) => {
  feel = (feel + 1) % FEEL.length;
  e.currentTarget.textContent = 'かたさ：' + FEEL[feel].name;
});
document.getElementById('snd').addEventListener('click', (e) => {
  soundOn = !soundOn;
  e.currentTarget.textContent = soundOn ? '音 ON' : '音 OFF';
  e.currentTarget.setAttribute('aria-pressed', String(soundOn));
});

/* ---------- 動き（ばね） ---------- */
function step(dt) {
  const now = performance.now(), F = FEEL[feel];
  // さわっている間と、はなしてから 1.2 秒は笑顔。すっと笑って、ゆっくりもどる
  const wl = now < laughUntil ? 1 : 0;
  const want = !wl && (fingers.size || now < smileUntil) ? 1 : 0;
  smile += (want - smile) * Math.min(1, dt * (want ? 12 : 3));
  laugh += (wl - laugh) * Math.min(1, dt * (wl ? 14 : 3));
  // 大笑い：「あはは」のリズム（0.2 秒ごと）で、胸とおなかをはずませる。胸は少しおくれて
  if (laugh > 0.4) {
    laughBeat -= dt;
    if (laughBeat <= 0) {
      laughBeat = 0.2 + Math.random() * 0.04;
      BODY.belly.v += 215 * laugh;   // 2026-11-04 大きくした（95 → 155 → 215。胸は 175・160 のまま）
      setTimeout(() => { BODY.chestL.v += 175 * laugh; BODY.chestR.v += 160 * laugh; }, 40);
    }
  }
  { const B = BODY.belly; B.vx += (-200 * B.x - 4.5 * B.vx) * dt; B.x += B.vx * dt; if (B.x > 34) { B.x = 34; B.vx *= 0.5; } else if (B.x < -34) { B.x = -34; B.vx *= 0.5; } }
  [BODY.belly, BODY.chestL, BODY.chestR].forEach((b) => {
    b.v += (-240 * b.y - 6.5 * b.v) * dt; b.y += b.v * dt;
    const lim = b === BODY.belly ? 38 : 24;   // 動きすぎないように（ピクセル。おなかは大きめ）
    if (b.y > lim) { b.y = lim; b.v *= 0.5; } else if (b.y < -lim) { b.y = -lim; b.v *= 0.5; }
  });
  pads.forEach((p) => {
    let target = 0;
    if (p.press) {
      const h = (now - p.press.t0) / 1000;
      target = (1 + Math.min(0.3, h * 0.25)) * F.depth;   // 長押しで、もう少し沈む
      if (h > 1.4 && !holdTalked) { holdTalked = true; say('hold', true); }
    }
    p.dentV += (F.k * (target - p.dent) - (p.press ? F.cPress : F.cFree) * p.dentV) * dt;
    p.dent += p.dentV * dt;
  });
  // ハート：照れ笑いのときは、ときどき1つ。大笑いのときは、いっぱい
  heartAcc += dt * (laugh > 0.5 ? 16 * laugh : smile > 0.6 ? 1.6 : 0);
  while (heartAcc >= 1) { heartAcc -= 1; addHeart(laugh > 0.5); }
  for (let i = hearts.length - 1; i >= 0; i--) {
    const q = hearts[i]; q.t += dt; q.y += q.vy * dt; q.x += q.vx * dt; q.vy *= 1 - 0.4 * dt;
    if (q.t > q.life) hearts.splice(i, 1);
  }
}

/* ---------- 肉球のくぼみを描く（1ピクセルずつ） ----------
   ① 押し出し：肉球のまわりを、中心から外へ少し広げる（指に近い側ほど大きい）
   ② くぼみ：指の所の絵を少し縮める（奥にへこんだように見える）
   ③ 影：くぼみの形（高さ）から、左上の光で明るさを決める。くぼみの左上の内側は暗く、右下の内側は明るい。まわりの土手は明るい
   肉球の外（足の裏の毛）には ③ の影をつけない（pads_mask.png） */
const LX = -0.55, LY = -0.83;   // 光の向き（左上から）
function renderPad(p) {
  const F = FEEL[feel], D = Math.max(-0.25, p.dent);
  const m = 1.75;
  const x0 = Math.floor(p.cx - p.rx * m), y0 = Math.floor(p.cy - p.ry * m);
  const w = Math.ceil(p.rx * m * 2), h = Math.ceil(p.ry * m * 2);
  if (!p.patch) {
    p.patch = document.createElement('canvas'); p.patch.width = w; p.patch.height = h;
    p.pctx = p.patch.getContext('2d'); p.data = p.pctx.createImageData(w, h);
    p.x0 = x0; p.y0 = y0; p.w = w; p.h = h;
  }
  const out = p.data.data;
  const R = Math.min(p.rx, p.ry) * (0.62 + 0.22 * Math.min(1.3, Math.abs(D)));
  const R2 = R * R;
  // 押した所の向き（肉球の中心から見て）
  const pu = (p.qx - p.cx) / p.rx, pv = (p.qy - p.cy) / p.ry, plen = Math.hypot(pu, pv);
  const pax = plen ? pu / plen : 0, pay = plen ? pv / plen : 0;
  const bulgeAll = D * F.bulge * (0.035 + 0.04 * (1 - Math.min(1, plen * 1.2)));
  const bulgeSide = D * F.bulge * 0.12 * Math.min(1, plen * 1.4);
  const pinch = D * 0.22;
  const shadeK = 1.15 * Math.max(0, D);
  for (let yy = 0; yy < h; yy++) {
    const y = y0 + yy;
    for (let xx = 0; xx < w; xx++) {
      const x = x0 + xx, o = (yy * w + xx) * 4;
      // ① 押し出し（肉球のまわりで 0 に戻る）
      const u = (x - p.cx) / p.rx, v = (y - p.cy) / p.ry, dn = Math.hypot(u, v);
      let sx = x, sy = y;
      if (dn < 1.7) {
        const fall = dn < 1 ? 1 : 1 - (dn - 1) / 0.7, ff = fall * fall * (3 - 2 * fall);
        const side = dn ? Math.max(0, (u * pax + v * pay) / dn) : 0;
        const e = (bulgeAll + bulgeSide * side * side) * ff;
        sx = p.cx + (x - p.cx) / (1 + e); sy = p.cy + (y - p.cy) / (1 + e);
      }
      // ② くぼみ：指のまわりの絵を縮める
      const qx = sx - p.qx, qy = sy - p.qy, qq = qx * qx + qy * qy;
      if (qq < R2 * 2.6) {
        const r = Math.sqrt(qq) / (R * 1.6), t = r < 1 ? (1 - r) * (1 - r) : 0;
        sx = p.qx + qx * (1 + pinch * t); sy = p.qy + qy * (1 + pinch * t);
      }
      let ix = sx | 0, iy = sy | 0;
      if (ix < 0) ix = 0; else if (ix >= IW) ix = IW - 1;
      if (iy < 0) iy = 0; else if (iy >= IH) iy = IH - 1;
      const si = (iy * IW + ix) * 4;
      let rr = src[si], gg = src[si + 1], bb = src[si + 2];
      // ③ 影（肉球の所だけ）
      const mk = mask[si] / 255;
      if (mk > 0 && shadeK > 0.001) {
        const dx = x - p.qx, dy = y - p.qy, dist = Math.hypot(dx, dy), rn = dist / R;
        if (rn < 2.2) {
          // 高さ：まんなかが沈み（-g）、ふちに土手（+rim）。その傾き × 光の向き で明るさ
          const g = Math.exp(-rn * rn * 1.6);
          const rz = (rn - 1.05) / 0.42, rim = Math.exp(-rz * rz);
          const slope = g * 3.2 * rn - 0.45 * rim * 2 * (rn - 1.05) / (0.42 * 0.42);
          const dl = dist > 0.001 ? (dx * LX + dy * LY) / dist : 0;
          let sh = 1 - 0.46 * shadeK * slope * dl;   // 光と向かい合う面は明るく、背を向けた面は暗く（2026-11-04 濃くした 0.30 → 0.46）
          sh *= 1 - 0.45 * shadeK * g;               // 沈んだ底は、光がとどきにくくて暗い（0.30 → 0.45）
          if (sh < 0.25) sh = 0.25;
          if (sh < 1) { rr *= 1 - (1 - sh) * mk; gg *= 1 - (1 - sh) * mk; bb *= 1 - (1 - sh) * mk; }
          else { const k = (sh - 1) * 0.9 * mk; rr += (255 - rr) * k * 0.55; gg += (255 - gg) * k * 0.5; bb += (255 - bb) * k * 0.5; }
        }
      }
      out[o] = rr; out[o + 1] = gg; out[o + 2] = bb; out[o + 3] = 255;
    }
  }
  p.pctx.putImageData(p.data, 0, 0);
  ctx.drawImage(p.patch, OX + p.x0 * S, OY + p.y0 * S, p.w * S, p.h * S);
}

/* ---------- 体（おなか・胸）を揺らして描く ----------
   ふちほど動かない重み（だ円の中心が 1、ふちで 0）をつけて、上下にずらした絵を描く。表情の絵とも同じように重ねる */
function bodyWeights() {
  bodyW = { b: new Float32Array(BW * BH), bw: new Float32Array(BW * BH), c: new Float32Array(BW * BH), cl: new Uint8Array(BW * BH) };
  const sm = (d) => { const t = Math.max(0, 1 - d); return t * t * (3 - 2 * t); };
  for (let y = 0; y < BH; y++) for (let x = 0; x < BW; x++) {
    const ix = BX0 + x, iy = BY0 + y, k = y * BW + x, B = BODY;
    // おなかも、まんなかから広く動く形（(1 - r²)²。大笑いの広い範囲と同じ形で、少しせまい）
    const rb2 = ((ix - B.belly.cx) / B.belly.rx) ** 2 + ((iy - B.belly.cy) / B.belly.ry) ** 2;
    bodyW.b[k] = rb2 < 1 ? (1 - rb2) * (1 - rb2) : 0;
    // 広い範囲は、まんなかから広く動く形（ぽんぽこリズムの belly.js と同じ (1 - r²)²）
    const r2 = ((ix - B.bellyWide.cx) / B.bellyWide.rx) ** 2 + ((iy - B.bellyWide.cy) / B.bellyWide.ry) ** 2;
    bodyW.bw[k] = r2 < 1 ? (1 - r2) * (1 - r2) : 0;
    const l = sm(Math.hypot((ix - B.chestL.cx) / B.chestL.rx, (iy - B.chestL.cy) / B.chestL.ry));
    const r = sm(Math.hypot((ix - B.chestR.cx) / B.chestR.rx, (iy - B.chestR.cy) / B.chestR.ry));
    bodyW.c[k] = Math.max(l, r); bodyW.cl[k] = l >= r ? 1 : 0;
  }
}
function renderBody() {
  const B = BODY, yb = B.belly.y, xb = B.belly.x, yl = B.chestL.y, yr = B.chestR.y;
  if (Math.abs(yb) < 0.15 && Math.abs(xb) < 0.15 && Math.abs(yl) < 0.15 && Math.abs(yr) < 0.15) return;
  if (!bodyPatch) {
    bodyPatch = document.createElement('canvas'); bodyPatch.width = BW; bodyPatch.height = BH;
    bodyCtx = bodyPatch.getContext('2d'); bodyData = bodyCtx.createImageData(BW, BH); bodyWeights();
  }
  const out = bodyData.data, ws = smileSrc ? smile : 0, wl = laughSrc ? laugh : 0;
  const wide = Math.min(1, laugh * 1.2), cxB = BODY.bellyWide.cx;   // 大笑いのときは、広い範囲に切りかえる
  for (let y = 0; y < BH; y++) {
    for (let x = 0; x < BW; x++) {
      const k = y * BW + x, o = k * 4;
      // 胸とおなかの、上下のずれ（下に揺れたときは、上の絵を持ってくる）
      const wb = bodyW.b[k] + (bodyW.bw[k] - bodyW.b[k]) * wide, wc = bodyW.c[k];
      let si;
      if (wb < 0.004 && wc < 0.004) si = ((BY0 + y) * IW + BX0 + x) * 4;   // ほとんど動かない所は、そのまま（速くするため）
      else {
        const dy = yb * wb + (bodyW.cl[k] ? yl : yr) * wc;
        // 沈むと、おなかが少し横に広がる（上がると、少しすぼむ）
        const sx = BX0 + x - (BX0 + x - cxB) * 0.0028 * yb * wb - xb * wb;   // 横の揺れ（「ぷるん！」）も
        let iy = (BY0 + y - dy + 0.5) | 0; if (iy < 0) iy = 0; else if (iy >= IH) iy = IH - 1;
        let ix = (sx + 0.5) | 0; if (ix < 0) ix = 0; else if (ix >= IW) ix = IW - 1;
        si = (iy * IW + ix) * 4;
      }
      let r = src[si], g = src[si + 1], b = src[si + 2];
      if (ws > 0.01) { r += (smileSrc[si] - r) * ws; g += (smileSrc[si + 1] - g) * ws; b += (smileSrc[si + 2] - b) * ws; }
      if (wl > 0.01) { r += (laughSrc[si] - r) * wl; g += (laughSrc[si + 1] - g) * wl; b += (laughSrc[si + 2] - b) * wl; }
      out[o] = r; out[o + 1] = g; out[o + 2] = b; out[o + 3] = 255;
    }
  }
  bodyCtx.putImageData(bodyData, 0, 0);
  ctx.drawImage(bodyPatch, OX + BX0 * S, OY + BY0 * S, BW * S, BH * S);
}

/* ---------- 描く ---------- */
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.imageSmoothingEnabled = true;
  if (bg) { ctx.drawImage(bg, 0, 0, W, H); ctx.fillStyle = 'rgba(239,215,174,.45)'; ctx.fillRect(0, 0, W, H); }
  ctx.drawImage(img, OX, OY, IW * S, IH * S);
  // 笑顔：顔だけちがう絵を、ふわっと重ねる（足・肉球は同じなので、絵全体を重ねてもずれない）
  if (smileImg && smile > 0.01) { ctx.globalAlpha = smile; ctx.drawImage(smileImg, OX, OY, IW * S, IH * S); ctx.globalAlpha = 1; }
  if (laughImg && laugh > 0.01) { ctx.globalAlpha = laugh; ctx.drawImage(laughImg, OX, OY, IW * S, IH * S); ctx.globalAlpha = 1; }
  renderBody();
  pads.forEach((p) => { if (Math.abs(p.dent) > 0.004 || Math.abs(p.dentV) > 0.02) renderPad(p); });
  // ハート（顔のまわりから、ぽわぽわ上がる）
  hearts.forEach((q) => {
    const k = q.t / q.life, a = k < 0.15 ? k / 0.15 : 1 - (k - 0.15) / 0.85;
    const sc = q.size * (0.6 + 0.4 * Math.min(1, k * 5));
    ctx.save(); ctx.globalAlpha = Math.max(0, a) * 0.95;
    ctx.translate(q.x + Math.sin(q.t * q.wf + q.ph) * q.wa, q.y); ctx.rotate(q.rot + Math.sin(q.t * 3 + q.ph) * 0.15); ctx.scale(sc, sc);
    heartPath(); ctx.fillStyle = q.col; ctx.fill();
    ctx.lineWidth = 1.4 / sc; ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.beginPath(); ctx.ellipse(-4.5, -3, 2.6, 1.6, -0.6, 0, 7); ctx.fill();
    ctx.restore();
  });
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  for (let i = 0; i < 4; i++) step(dt / 4);
  draw();
  requestAnimationFrame(frame);
}
addEventListener('resize', resize);
resize();
Promise.all([load(SRC_IMG), load(SRC_MASK)]).then(([a, b]) => {
  img = a; src = pixels(a); mask = pixels(b); makeBg();
  load(SRC_SMILE).then((c) => { smileImg = c; smileSrc = pixels(c); }).catch(() => {});   // 表情の絵はあとから（なくても遊べる）
  load(SRC_LAUGH).then((c) => { laughImg = c; laughSrc = pixels(c); }).catch(() => {});
  document.getElementById('loading').remove();
  requestAnimationFrame(frame);
}).catch(() => { document.getElementById('loading').textContent = '絵を読みこめませんでした。開き直してください'; });
})();
</script>
