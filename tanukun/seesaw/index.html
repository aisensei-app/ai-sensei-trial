<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<!-- 丸太シーソー（試作）。確認用リンクは python3 tools/build_seesaw_preview.py で作る -->
<title>丸太シーソー</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: one full-screen beach scene; small wooden signs float at the edges, the player's own handle bar sits at the bottom */
:root{
  --wood:#7a4a24;
  --wood-lite:#c58a4f;
  --cream:#fff6e4;
  --ink:#3a2210;
  --sea:#1f86cf;
  --sun:#ffcf4d;
  --font:'Zen Maru Gothic','Hiragino Maru Gothic ProN','BIZ UDPGothic','Yu Gothic',sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:#bfe3f7;color:var(--ink);font-family:var(--font);overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

.hud{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:8px}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.sign{background:var(--cream);border:2px solid var(--wood);border-radius:12px 9px 13px 10px;box-shadow:0 3px 0 var(--wood);padding:5px 11px}
.name{font-weight:900;font-size:16px;line-height:1.2;display:flex;align-items:center;gap:6px}
.chip{font-size:11px;font-weight:700;background:var(--sun);border:1.5px solid var(--wood);border-radius:999px;padding:0 7px;letter-spacing:.05em}
.best{font-size:12px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.btn{pointer-events:auto;font-family:inherit;font-weight:900;color:var(--ink);cursor:pointer}
.btn:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
#snd{font-size:13px;min-width:62px}
.btns{display:flex;gap:8px}
#spd{font-size:13px;min-width:86px}
.speed{color:#b0461b;letter-spacing:-2px}
.special{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:#e9f6ff;opacity:0;transition:opacity .7s ease;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
.special.on{opacity:1}
.card{display:flex;flex-direction:column;align-items:center;gap:8px;max-width:420px;width:100%}
.cardtop{display:flex;justify-content:space-between;width:100%;font-size:12px;font-weight:700}
.count{font-variant-numeric:tabular-nums}
#spImg{width:100%;max-height:62vh;object-fit:contain;border-radius:16px;border:3px solid var(--wood);box-shadow:0 4px 0 var(--wood);background:#fff}
.sptitle{margin:4px 0 0;font-size:22px;font-weight:900}
.spline{margin:0;font-size:15px;font-weight:700}
#spBack{font-size:16px;padding:8px 26px;margin-top:6px}
.hint{align-self:center;max-width:min(92%,360px);font-size:13px;font-weight:700;line-height:1.45;text-align:center;transition:opacity .6s,transform .6s}
.hint b{color:#b0461b}
.swipe{display:block;position:relative;width:16px;height:38px;margin:4px auto 0;border-radius:8px;background:rgba(122,74,36,.15)}
.swipe::after{content:"";position:absolute;left:1px;width:14px;height:14px;border-radius:50%;background:var(--sun);border:2px solid var(--wood);box-sizing:border-box;animation:swipe 1.8s ease-in-out infinite}
@keyframes swipe{0%,100%{top:22px}50%{top:2px}}
.hint.small{opacity:0;transform:translateY(-6px)}

.meter{position:fixed;z-index:4;left:max(16px,env(safe-area-inset-left,0px));top:50%;transform:translateY(-38%);
  height:min(36vh,280px);width:12px;border-radius:8px;background:rgba(255,246,228,.85);border:2px solid var(--wood);pointer-events:none}
.meter .fill{position:absolute;left:1px;right:1px;bottom:1px;border-radius:6px;background:linear-gradient(#7fd3ff,var(--sea))}
.meter .knob{position:absolute;left:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:var(--sun);border:2px solid var(--wood)}
.meter .tick{position:absolute;left:16px;transform:translateY(-50%);font-size:11px;font-weight:900;white-space:nowrap;color:var(--cream);
  -webkit-text-stroke:3px var(--wood);paint-order:stroke fill}
.meter .tick::before{content:"";position:absolute;left:-17px;top:50%;width:12px;height:2px;background:var(--wood)}
.meter .tick.got{color:var(--sun)}
.meter .bestline{position:absolute;left:-4px;right:-4px;height:2px;background:#e2572a}

.bottom{position:fixed;z-index:5;left:0;right:0;bottom:0;display:grid;justify-items:center;align-items:end;pointer-events:none;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 15vh);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#dive{grid-area:1/1;font-size:17px;padding:10px 20px;background:var(--sun);border:2px solid var(--wood);border-radius:14px 11px 15px 12px;box-shadow:0 4px 0 var(--wood);
  animation:wob 1.4s ease-in-out infinite}
#dive:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wood)}
@keyframes wob{50%{transform:rotate(-2deg) scale(1.04)}}

.bubble{position:fixed;z-index:6;transform:translate(-50%,-100%);background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:16px;
  padding:6px 12px;font-size:15px;font-weight:700;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s}
.bubble.on{opacity:1}
.bubble::after{content:"";position:absolute;left:50%;bottom:-9px;width:12px;height:12px;margin-left:-8px;background:#fff;border:2px solid var(--ink);
  border-top:none;border-left:none;border-radius:0 0 10px 0;transform:rotate(30deg)}
.pop{position:fixed;z-index:6;transform:translate(-50%,-50%);font-weight:900;font-size:clamp(22px,6.4vw,32px);color:#fff;white-space:nowrap;
  -webkit-text-stroke:6px var(--wood);paint-order:stroke fill;pointer-events:none;animation:popup .95s ease-out forwards}
.pop.blue{-webkit-text-stroke-color:#145f99}
.pop.big{font-size:clamp(34px,11vw,56px)}
.pop.small{font-size:clamp(16px,4.6vw,22px)}
@keyframes popup{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}18%{opacity:1;transform:translate(-50%,-55%) scale(1.12)}
  70%{opacity:1}100%{opacity:0;transform:translate(-50%,-120%) scale(1)}}
#loading{position:fixed;inset:0;display:grid;place-items:center;font-weight:900;font-size:18px;color:var(--wood)}
@media (prefers-reduced-motion: reduce){#dive{animation:none}.pop{animation-duration:1.4s}}
</style>

<canvas id="stage" aria-label="丸太のシーソーに乗ったタヌくん"></canvas>
<div id="loading">よみこみ中…</div>

<div class="hud">
  <div class="row">
    <div class="sign">
      <div class="name">丸太シーソー <span class="chip">試作</span></div>
    </div>
    <div class="btns">
      <button class="sign btn" id="spd" type="button" aria-label="シーソーのはやさ">はやさ <span class="speed" id="spdIcon">▶</span></button>
      <button class="sign btn" id="snd" type="button" aria-pressed="true">音 ON</button>
    </div>
  </div>
  <div class="sign hint" id="hint"><b>矢印のように、画面を指で上下になぞってね</b><br><span style="font-weight:500">指をはなすと、ゆっくり元にもどるよ</span></div>
</div>

<div class="bottom">
  <button class="btn" id="dive" type="button" hidden>海へ ざぶーん！</button>
</div>
<div class="bubble" id="bubble"></div>
<div class="special" id="special" hidden>
  <div class="card">
    <div class="cardtop"><span class="chip" id="spNew">NEW!</span><span class="count" id="spCount"></span></div>
    <img id="spImg" alt="">
    <p class="sptitle" id="spTitle"></p>
    <p class="spline" id="spLine"></p>
    <button class="sign btn" id="spBack" type="button">もどる</button>
  </div>
</div>
<div id="pops"></div>

<script>
(() => {
'use strict';
// 絵：座った絵の表情（同じポーズ）と、海へ飛びこむときの「ばんざい」
const SRC = {
  normal: 'img/sit_normal.webp',   // 下にいるとき
  happy:  'img/sit_happy.webp',    // まんなか（わくわく）
  wow:    'img/sit_wow.webp',      // いちばん上の方（びっくり「たか〜い！」）
  ehehe:  'img/sit_ehehe.webp',    // 「ぷるん」「たぷん」の直後、海でぷかぷか
  banzai: 'img/jump_banzai.webp',  // 海へ飛びこむとき
  beach:  '../images/bg/beach_day.webp'
};

/* ---------- 画面 ---------- */
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, F = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  F = Math.min(H * 1.55, W * 3.0);   // 焦点距離（画面の縦の大きさに合わせる）
}
addEventListener('resize', resize); resize();

/* ---------- 世界（メートル） ----------
   シーソーのまんなか（支点）が原点の真上。手前（z<0）にプレイヤー、奥（z>0）にタヌくん */
const HP = 0.75, LH = 2.0, LOGR = 0.17;               // 支点の高さ、半分の長さ、丸太の半径
const THMAX = Math.asin((HP - LOGR) / LH);           // 端が地面につく角度
const T_SEAT = 0.8, T_BAR = 0.725, T_CAM = -0.92, EYE = 0.55;
const OMEGA = 2 * Math.PI / 1.7, G = 9.8;
/* シーソーのはやさ（3段階）。k, c は指についていく時、rk, rc は指をはなして戻る時の、ばねの強さと止まりやすさ */
const SPEEDS = [
  { icon: '▶',   name: 'ゆっくり', k: 9,  c: 4.6, rk: 2.2, rc: 2.2 },
  { icon: '▶▶',  name: 'ふつう',   k: 20, c: 6.5, rk: 4.5, rc: 3.2 },
  { icon: '▶▶▶', name: 'はやい',   k: 38, c: 8.5, rk: 8,   rc: 4.3 }
];
const PULL = 1;   // 1：動く向きに引っぱられる／-1：遅れてついてくる
// 端に着いたときの「ぷるん」（dir=1 は床で下へ、-1 はいちばん上で上へ）。ゆっくりでも大きく揺れるように、最低の強さを持たせる
function endKick(dir, v) {
  const k = 0.5 + 0.5 * Math.min(1, v * 3);
  S.jb.v += dir * 430 * k;
  S.st.v += dir * 3.0 * k;
  setTimeout(() => { S.jcL.v += dir * 640 * k; S.jcR.v += dir * 590 * k; }, 60);
}
// 立ち絵（720×900）：1m = 562px、座る所（腰）を画像の (262, 585) に
// 座った絵（808×1009。tools/make_seesaw_art.py）：1m = 620px、丸太に座る所（またの上）を画像の (395, 740) に
const TW = 808, TH = 1009, PXM = 620, AX = 395, AY = 740;
const HEAD_Y = 15, BELLY_UP = 270;                       // 頭のてっぺん、おなかの中心（座る所からの高さ。px）
const BELLY = { cx: 395, cy: 470, rx: 145, ry: 125 };
const CHEST = [{ cx: 300, cy: 320, rx: 92, ry: 64 }, { cx: 490, cy: 320, rx: 92, ry: 64 }];
const BX0 = 205, BX1 = 585, BY0 = 254, BY1 = 596;
const SHORE = 4.4;   // カメラから波打ち際まで（m）。タヌくんのすぐうしろが波打ち際
const BAR_UP = 0.235;                                    // 持ち手の横棒の高さ（丸太の上から m。こぶしの位置）
const TIERS = [
  { h: 2.05, label: '海',       line: 'わぁ〜、海がひろ〜い！' },
  { h: 2.28, label: '島',       line: 'あっ、遠くの島が見えた！' },
  { h: 2.42, label: 'てっぺん', line: 'てっぺんだ〜！ いい景色〜♪' }
];
const EYE_MIN = HP + LOGR + EYE - LH * 0.92 * Math.sin(THMAX), EYE_MAX = HP + LOGR + EYE + LH * 0.92 * Math.sin(THMAX);

const S = {
  th: -THMAX, w: 0, drag: false, dragTh: -THMAX, t: 0, swings: 0, cycles: 0, side: -1, guideA: 1, st: { y: 0, v: 0 },
  body: { y: 0, v: 0, prevV: 0, on: true },
  jb: { y: 0, v: 0 }, jcL: { y: 0, v: 0 }, jcR: { y: 0, v: 0 }, sq: { y: 0, v: 0 }, chestQ: new Array(16).fill(0), qi: 0,
  phi: 0, shake: 0, happyUntil: 0, lastInput: 0, nice: 0, topCount: 0,
  best: 0, tierSeen: [0, 0, 0], dive: null, splash: [], speed: 0
};
try { S.best = parseFloat(localStorage.getItem('tanu-seesaw-best')) || 0; } catch (e) {}
const events = [];

function seat(th) { return { y: HP + LH * T_SEAT * Math.sin(th) + LOGR, z: LH * T_SEAT * Math.cos(th), vy: LH * T_SEAT * Math.cos(th) }; }
function camOf(th) { return { y: HP + LH * T_CAM * Math.sin(th) + LOGR + EYE, z: LH * T_CAM * Math.cos(th) - 0.05 }; }

/* ---------- 物理（1/240 秒ずつ） ---------- */
function step(h) {
  S.t += h;
  // 指でつかんでいる間は指の位置へ、はなすとタヌくん側（重い方）へゆっくり戻る
  const target = S.drag ? S.dragTh : -THMAX;
  const sp = SPEEDS[S.speed];
  const k = S.drag ? sp.k : sp.rk, c = S.drag ? sp.c : sp.rc;
  S.w += (k * (target - S.th) - c * S.w) * h;
  S.th += S.w * h;
  // 床・いちばん上に着いたとき：体が止まっても、おなかと胸は進み続けて大きく「ぷるん」
  if (S.th < -THMAX) { S.th = -THMAX; if (S.w < 0) { const v = -S.w; S.w = v * 0.3; if (v > 0.04) { endKick(1, v); events.push(['tanuDown', v]); } } }
  if (S.th > THMAX)  { S.th = THMAX;  if (S.w > 0) { const v = S.w;  S.w = -v * 0.3; if (v > 0.04) { endKick(-1, v); events.push(['top', v]); } } }

  const st = seat(S.th), svy = st.vy * S.w, b = S.body;
  const present = !S.dive || S.dive.phase === 'return';
  if (present) {
    if (b.on) {
      const sa = (svy - b.v) / h;
      if (sa < -G && b.v > 0.4) { b.on = false; b.v -= G * h; b.y += b.v * h; events.push(['lift', b.v]); }
      else { b.y = st.y; b.v = svy; }
    } else {
      b.v -= G * h; b.y += b.v * h;
      if (b.y <= st.y) { const dv = svy - b.v; b.y = st.y; b.v = svy; b.on = true; events.push(['land', dv]); }
    }
    // ① 動いている向きに、おなか・胸が引っぱられる（PULL を -1 にすると、逆向き＝遅れてついてくる感じ）
    // ② 速さが変わったときは、ばねで揺れる
    const dv = b.v - b.prevV; b.prevV = b.v;
    const vy = b.on ? svy : b.v;
    spring(S.jb, 420 * dv, 110, 2.4, 56, h, -PULL * 16 * vy);
    // 胸はおなかより少し遅れて（約0.06秒）、少し速いばねで。左右でもわずかにずらす
    const q = S.chestQ, dvc = q[S.qi]; q[S.qi] = dv; S.qi = (S.qi + 1) % q.length;
    spring(S.jcL, 380 * dvc, 230, 3.0, 42, h, -PULL * 14 * vy);
    spring(S.jcR, 380 * dvc, 255, 3.3, 42, h, -PULL * 14 * vy);
    // おなかの伸び縮み（上の付け根は止めて、下側が伸びる・つぶれる）。下へ動く＝下へ伸びる、上へ動く＝上へつぶれる
    spring(S.st, 3.2 * dv, 110, 2.6, 0.24, h, -PULL * 0.17 * vy);
    // 体ぜんたいも、動く向きに少し伸びる
    spring(S.sq, 0.05 * dv, 500, 14, 0.07, h, PULL * 0.03 * vy);
  } else {
    spring(S.st, 0, 110, 2.6, 0.24, h);
    spring(S.jb, 0, 110, 2.4, 56, h); spring(S.jcL, 0, 230, 3.0, 42, h); spring(S.jcR, 0, 255, 3.3, 42, h); spring(S.sq, 0, 500, 14, 0.07, h);
  }
  // 海へ飛びこむ
  const d = S.dive;
  if (d) {
    d.t += h;
    if (d.phase === 'fly') {
      d.vy -= G * h; d.y += d.vy * h; d.z += d.vz * h;
      if (d.y <= 0 && d.vy < 0) { d.phase = 'splash'; d.t = 0; events.push(['splash', d.z]); }
    } else if (d.phase === 'splash' && d.t > 0.9) { d.phase = 'card'; d.t = 0; showSpecial(); }
    else if (d.phase === 'back') {
      d.phase = 'return'; d.t = 0;
      b.on = false; b.y = seat(S.th).y + 4.2; b.v = 0; b.prevV = 0;
      events.push(['comeback']);
    } else if (d.phase === 'return' && b.on) { S.dive = null; events.push(['home']); }
  }
  for (const p of S.splash) { p.vy -= G * h; p.x += p.vx * h; p.y += p.vy * h; p.z += p.vz * h; p.life -= h; }
}
function spring(s, kick, k, c, max, h, rest) {
  s.v += kick; s.v += (-k * (s.y - (rest || 0)) - c * s.v) * h; s.y += s.v * h;
  if (s.y > max) { s.y = max; if (s.v > 0) s.v *= -0.3; }
  if (s.y < -max) { s.y = -max; if (s.v < 0) s.v *= -0.3; }
}

/* ---------- 指の操作（上下になぞった分だけ、シーソーが動く） ---------- */
let ptr = null;
const hintEl = document.getElementById('hint');
function hideHint() { hintEl.classList.add('small'); }
cv.addEventListener('pointerdown', (e) => {
  audioInit();
  if (S.dive && S.dive.phase !== 'return') return;
  ptr = { y: e.clientY, th: S.th, cy: e.clientY, upT: S.t, downT: S.t, segY: e.clientY };
  touchDir = S.th > 0 ? 1 : -1; touchT = 0;
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  S.drag = true; S.dragTh = S.th; S.lastInput = S.t;
});
cv.addEventListener('pointermove', (e) => {
  if (!ptr) return;
  // 画面の高さの半分をなぞると、端から端まで（指を上へ＝タヌくんが上へ）
  const d = (ptr.y - e.clientY) / (H * 0.5) * 2 * THMAX;
  S.dragTh = Math.max(-THMAX, Math.min(THMAX, ptr.th + d));
  if (e.clientY < ptr.cy - 1) ptr.upT = S.t; else if (e.clientY > ptr.cy + 1) ptr.downT = S.t;
  ptr.cy = e.clientY;
  S.lastInput = S.t;
  if (Math.abs(ptr.y - e.clientY) > 30) hideHint();
});
function endPtr() { ptr = null; S.drag = false; S.lastInput = S.t; }
cv.addEventListener('pointerup', endPtr);
cv.addEventListener('pointercancel', endPtr);

/* ---------- ことば・吹き出し ---------- */
const LINES = {
  start: ['シーソー、いっしょにやろ〜！'],
  idle: ['指で上下に動かしてね〜', 'シーソー、うごかして〜♪'],
  top: ['たか〜い！', 'いい景色〜♪', 'わぁ〜、海が見える！'],
  down: ['よいしょ〜', 'ぽすん'],
  lift: ['からだが、ういた〜！', 'ふわってした〜！'],
  land: ['おなか、たぷんってなった〜', 'えへへ、ゆれた〜'],
  dive: ['いってきま〜す！'],
  float: ['つめたくて、きもちいい〜！'],
  home: ['ただいま〜！']
};
const bubble = document.getElementById('bubble');
let bubbleUntil = 0, bubbleCool = 0;
function say(key, force) {
  if (!force && S.t < bubbleCool) return;
  const list = LINES[key] || [key];
  bubble.textContent = list[Math.floor(Math.random() * list.length)];
  bubble.classList.add('on');
  bubbleUntil = S.t + 2.0; bubbleCool = S.t + 2.4;
}
const pops = document.getElementById('pops');
function pop(text, x, y, cls) {
  const el = document.createElement('div');
  el.className = 'pop ' + (cls || '');
  el.textContent = text;
  el.style.left = Math.max(60, Math.min(W - 60, x)) + 'px';
  el.style.top = Math.max(90, y) + 'px';
  pops.appendChild(el);
  setTimeout(() => el.remove(), 1500);
}

/* ---------- 音（Web Audio でその場で作る） ---------- */
let AC = null, soundOn = true;
const sndBtn = document.getElementById('snd');
sndBtn.addEventListener('click', () => {
  audioInit(); soundOn = !soundOn;

  else if (lv === 1 && r < -0.15) lv = 0;
  S.faceLv = lv;
  const face = S.t < S.happyUntil ? IMG.ehehe : [IMG.normal, IMG.happy, IMG.wow][lv];
  tanuScreen = null;
  if (!d || d.phase === 'return') {
    warpTanu(face);
    tanuScreen = drawTanu(S.body.y, st.z, TH);
  }
  drawLog(T_CAM + 0.13, T_SEAT - 0.02);           // タヌくんより手前（ひざのあいだを通る）
  drawTanuHandle();
  if (d && d.phase === 'fly') {
    warpTanu(IMG.banzai);
    tanuScreen = drawTanu(d.y, d.z, TH);
  }
  drawPlayerHandle();
  drawGuide(dt);
  ctx.restore();

  // 吹き出し
  if (bubble.classList.contains('on')) {
    if (S.t > bubbleUntil) bubble.classList.remove('on');
    let bx = W / 2, by = H * 0.3;
    if (tanuScreen) { bx = tanuScreen.x + 20; by = tanuScreen.y - (AY - HEAD_Y) * tanuScreen.sc - 6; }
    else if (d) { const p = proj(0, 1.2, d.z); bx = p.x; by = p.y - 30; }
    const half = bubble.offsetWidth / 2 + 8;
    bubble.style.left = Math.max(half, Math.min(W - half, bx)) + 'px';
    const minTop = hintEl.classList.contains('small') ? 70 : 150;
    bubble.style.top = Math.max(bubble.offsetHeight + minTop, by) + 'px';
  }
  updateMeter();
}

/* ---------- 往復を数える（3往復で「海へ ざぶーん！」） ---------- */
let topSaid = 0;
function updateMeter() {
  const r = S.th / THMAX;
  if (S.side < 0 && r > 0.6) {
    S.side = 1;
    if (S.t - topSaid > 6) { topSaid = S.t; say('top'); }
  } else if (S.side > 0 && r < -0.6) {
    S.side = -1; S.swings++; S.cycles++;
    if (S.swings >= 3 && !S.dive) diveBtn.hidden = false;
  }
}

/* ---------- 出来事 ---------- */
function handleEvents() {
  while (events.length) {
    const [type, v] = events.shift();
    const ts = tanuScreen;
    if (type === 'tanuDown') {
      sfx.thud(v); sfx.boing(1.5 + v * 2);
      S.happyUntil = S.t + 1.2;   // 下に着いて「ぷるん」→ えへへ
      if (ts) { pop('ぽすん', ts.x - 110, ts.y + 60 * ts.sc, 'small'); setTimeout(() => pop('ぷるん！', ts.x + 70, ts.y - BELLY_UP * ts.sc), 90); }
    } else if (type === 'top') {
      sfx.creak(); sfx.boing(1.5 + v * 2);
      if (ts) pop('ぷるん！', ts.x + 70, ts.y - (BELLY_UP + 40) * ts.sc);
    } else if (type === 'lift') {
      if (v > 0.9 && ts) { pop('ふわっ', ts.x - 80, ts.y - (AY - 120) * ts.sc, 'small'); sfx.whoosh(); }
      if (v > 1.4) say('lift');
    } else if (type === 'land') {
      if (v > 1.0 && ts) {
        pop('たぷん！', ts.x + 70, ts.y - BELLY_UP * ts.sc); sfx.boing(v); S.happyUntil = S.t + 1.0;
        if (v > 2.2 && !S.dive) say('land');
      }
    } else if (type === 'splash') {
      sfx.splash();
      const p = proj(0, 0, v);
      pop('ざぶーーん！', W / 2, Math.min(H * 0.45, p.y - 40), 'big blue');
      for (let i = 0; i < 70; i++) {
        const a = Math.random() * Math.PI * 2, sp2 = 1 + Math.random() * 3;
        S.splash.push({ x: Math.cos(a) * 0.3, y: 0, z: v + Math.sin(a) * 0.3, vx: Math.cos(a) * sp2, vy: 4 + Math.random() * 6, vz: Math.sin(a) * sp2, r: 0.07 + Math.random() * 0.1, life: 1.3 });
      }
    } else if (type === 'float') { say('float', true); }
    else if (type === 'comeback') { sfx.whoosh(); }
    else if (type === 'home') { say('home', true); }
  }
  // しばらくさわらないと、さそう
  if (!S.dive && !S.drag && S.t - S.lastInput > 9 && Math.abs(S.w) < 0.05) { S.lastInput = S.t; say('idle'); }
  // 速く通り過ぎるときの、ぎしっ
  const sign = Math.sign(S.th);
  if (sign !== lastSign && Math.abs(S.w) > 1.0) sfx.creak();
  lastSign = sign;
}
let lastSign = 1;

/* ---------- 特別イラスト（海に入ったら、フェードで切りかえ） ----------
   src が null の間は、仮の絵（準備中）を出す。絵ができたら 'img/sp_wet.webp' のように書く */
const SPECIALS = [
  { id: 'wet',   weight: 6, src: null, face: 'ehehe', title: 'たのしかったね〜！', line: 'びしょびしょになっちゃった♪' },
  { id: 'crab',  weight: 3, src: null, face: 'wow',   title: 'いたたた〜！',       line: 'カニさんに、しっぽをはさまれた〜！' },
  { id: 'skirt', weight: 1, src: null, face: 'wow',   title: 'たいへん！',         line: 'こしみのが、ながされちゃった〜！' }
];
let seen = {};
try { seen = JSON.parse(localStorage.getItem('tanu-seesaw-special') || '{}') || {}; } catch (e) {}
const spEl = document.getElementById('special');
function placeholder(sp) {
  // 仮の絵：海の色の上に、表情の絵と「準備中」
  const c = document.createElement('canvas'); c.width = 640; c.height = 800;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, 800); g.addColorStop(0, '#7fd0ff'); g.addColorStop(0.55, '#1f86cf'); g.addColorStop(1, '#0d5f99');
  x.fillStyle = g; x.fillRect(0, 0, 640, 800);
  x.drawImage(IMGRAW[sp.face], 40, 80, 560, 700);
  x.fillStyle = 'rgba(255,255,255,.85)'; x.fillRect(0, 700, 640, 100);
  x.fillStyle = '#3a2210'; x.font = '700 30px sans-serif'; x.textAlign = 'center';
  x.fillText('特別イラスト「' + sp.id + '」（準備中）', 320, 762);
  return c.toDataURL('image/png');
}
function showSpecial() {
  let r = Math.random() * SPECIALS.reduce((a, s) => a + s.weight, 0), sp = SPECIALS[0];
  for (const s of SPECIALS) { if ((r -= s.weight) < 0) { sp = s; break; } }
  const isNew = !seen[sp.id];
  seen[sp.id] = (seen[sp.id] || 0) + 1;
  try { localStorage.setItem('tanu-seesaw-special', JSON.stringify(seen)); } catch (e) {}
  document.getElementById('spImg').src = sp.src || placeholder(sp);
  document.getElementById('spImg').alt = sp.title + ' ' + sp.line;
  document.getElementById('spTitle').textContent = sp.title;
  document.getElementById('spLine').textContent = sp.line;
  document.getElementById('spNew').style.visibility = isNew ? 'visible' : 'hidden';
  document.getElementById('spCount').textContent = 'あつめた ' + SPECIALS.filter((s) => seen[s.id]).length + ' / ' + SPECIALS.length;
  bubble.classList.remove('on');
  spEl.hidden = false;
  requestAnimationFrame(() => requestAnimationFrame(() => spEl.classList.add('on')));
  sfx.boing(2);
}
document.getElementById('spBack').addEventListener('click', () => {
  spEl.classList.remove('on');
  setTimeout(() => { spEl.hidden = true; if (S.dive && S.dive.phase === 'card') S.dive.phase = 'back'; }, 700);
});

/* ---------- はやさの切りかえ ---------- */
const spdBtn = document.getElementById('spd');
function showSpeed() {
  document.getElementById('spdIcon').textContent = SPEEDS[S.speed].icon;
  spdBtn.setAttribute('aria-label', 'シーソーのはやさ：' + SPEEDS[S.speed].name);
}
try { S.speed = Math.min(2, Math.max(0, parseInt(localStorage.getItem('tanu-seesaw-speed'), 10) || 0)); } catch (e) {}
showSpeed();
spdBtn.addEventListener('click', () => {
  audioInit();
  S.speed = (S.speed + 1) % SPEEDS.length; showSpeed();
  pop(SPEEDS[S.speed].name, W - 90, 110, 'small');
  try { localStorage.setItem('tanu-seesaw-speed', String(S.speed)); } catch (e) {}
});

const diveBtn = document.getElementById('dive');
diveBtn.addEventListener('click', () => {
  if (S.dive) return;
  audioInit();
  const st = seat(S.th);
  S.dive = { phase: 'fly', t: 0, y: S.body.y, z: st.z, vy: 7.2, vz: 2.6 };
  S.body.on = false; diveBtn.hidden = true; S.swings = 0; S.drag = false; ptr = null;
  S.jb.v += 300; S.jcL.v += 200; S.jcR.v += 180;
  sfx.whoosh(); say('dive', true);
});

/* ---------- はじめる ---------- */
const KEYS = ['normal', 'happy', 'wow', 'ehehe', 'banzai'];
const IMGRAW = {};
Promise.all(KEYS.map((k) => load(SRC[k])).concat(load(SRC.beach))).then((imgs) => {
  IMG = { beach: imgs[KEYS.length] };
  KEYS.forEach((k, i) => { IMG[k] = toData(imgs[i], false); IMGRAW[k] = imgs[i]; });
  document.getElementById('loading').remove();
  S.body.y = seat(S.th).y;
  let last = performance.now(), acc = 0;
  const H_STEP = 1 / 240;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now; acc += dt;
    while (acc >= H_STEP) { step(H_STEP); acc -= H_STEP; }
    handleEvents();
    render(dt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  setTimeout(() => say('start', true), 700);
}).catch(() => { document.getElementById('loading').textContent = '絵を読みこめませんでした。ページを開き直してください'; });
})();
</script>
