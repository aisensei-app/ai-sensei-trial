<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- ページが描かれる前の色も、幕と同じクリーム色に（画面を切りかえる間に、暗い色や白が一瞬見えないように。2026-11-02） -->
<meta name="color-scheme" content="light">
<style>html{background:#EED8B2;color-scheme:light}</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>丸太シーソー｜タヌくん</title>
<meta name="theme-color" content="#8CC8F2">
<link rel="icon" href="../images/icon-192.png">
<link rel="stylesheet" href="seesaw.css">
</head>
<body>
<main id="seesaw">

  <!-- 丸太シーソーの絵（景色・丸太・タヌくん・矢印のチュートリアル）は、ぜんぶこのキャンバスに描く -->
  <canvas id="stage" aria-label="丸太のシーソーに乗ったタヌくん" data-i18n-attr="aria-label"></canvas>
  <div id="loading" data-i18n>よみこみ中…</div>

  <!-- 上：タヌくんのところへ・はやさ・音 -->
  <div class="hud">
    <div class="row">
      <a class="sign back" href="../" data-i18n>‹ もどる</a>
      <div class="btns">
        <button class="sign btn" id="spd" type="button" aria-label="シーソーのはやさ"><span data-i18n>はやさ</span> <span class="speed" id="spdIcon">▶</span></button>
        <button class="sign btn" id="snd" type="button" aria-pressed="true">音 ON</button>
      </div>
    </div>
    <div class="sign hint" id="hint" data-i18n-html><b>矢印のように、画面を指で上下になぞってね</b><br><span class="sub">指をはなすと、ゆっくり元にもどるよ</span></div>
  </div>

  <!-- 3往復で出る「海へ ざぶーん！」 -->
  <div class="bottom">
    <button class="btn" id="dive" type="button" hidden data-i18n>海へ ざぶーん！</button>
  </div>
  <div class="bubble" id="bubble"></div>

  <!-- 海に入ったら：特別イラスト（フェードで切りかえ） -->
  <div class="special" id="special" hidden>
    <div class="card">
      <div class="cardtop"><span class="chip" id="spNew">NEW!</span><span class="count" id="spCount"></span></div>
      <img id="spImg" alt="" draggable="false">
      <p class="sptitle" id="spTitle"></p>
      <p class="spline" id="spLine"></p>
      <button class="sign btn" id="spBack" type="button" data-i18n>もどる</button>
    </div>
  </div>
  <div id="pops" aria-hidden="true"></div>

</main>
<!-- 本編と同じ設定（公開スイッチ）・ことば（i18n.js。シーソーの訳は seesaw.i18n.js）を使う -->
<script src="../config.js"></script>
<script src="seesaw.i18n.js"></script>
<!-- 中国語の画面の文字（本編と共通の文。英語は i18n.js の中にある） -->
<script src="../i18n.zh.js"></script>
<script src="../i18n.js"></script>
<!-- 遊び方の数え方（だれのものかわからない形で、数だけ） -->
<script src="../stats.js"></script>
<script>window.TanuStats && window.TanuStats.ping('p-seesaw');</script>
<script src="../iris.js"></script>
<script src="seesaw.js"></script>
</body>
</html>
