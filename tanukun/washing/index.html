<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- ページが描かれる前の色も、幕と同じクリーム色に（画面を切りかえる間に、暗い色や白が一瞬見えないように。2026-11-02） -->
<meta name="color-scheme" content="light">
<style>html{background:#EED8B2;color-scheme:light}</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>タヌくんを洗おう｜タヌくん</title>
<meta name="theme-color" content="#8CC8F2">
<link rel="icon" href="../images/icon-192.png">
<link rel="stylesheet" href="washing.css">
</head>
<body>
<main id="washing">

  <!-- 南国のシャワールーム・タヌくん・汚れ・泡・シャワー・水しぶきは、ぜんぶこのキャンバスに描く -->
  <canvas id="stage" aria-label="南国のシャワールームのタヌくん" data-i18n-attr="aria-label"></canvas>
  <div id="loading" data-i18n>よみこみ中…</div>

  <!-- 上：タヌくんのところへ・よごれゲージ・音 -->
  <div class="hud">
    <div class="row">
      <a class="sign back" href="../" data-i18n>‹ もどる</a>
      <div class="rbtns">
        <button class="sign btn" id="zkBtn" type="button" aria-label="ずかん" data-i18n-attr="aria-label">📖 <span id="zkCount">0/5</span></button>
        <button class="sign btn" id="snd" type="button" aria-pressed="true">音 ON</button>
      </div>
    </div>
    <div class="sign gauge" id="gauge" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
      <span class="glabel" data-i18n>よごれ</span>
      <span class="gbar"><span class="gfill" id="gfill"></span></span>
      <span class="gnum" id="gnum">100%</span>
    </div>
    <div class="sign hint" id="hint"></div>
  </div>

  <!-- タヌくんの右上：道具（ブラシ・シャワー）。タップで切りかえ。選んでいる方が光る（位置は washing.js の placeTools） -->
  <div class="tools" id="tools" role="group" aria-label="道具" data-i18n-attr="aria-label">
    <button class="tool on" id="tBrush" type="button" aria-pressed="true" aria-label="ブラシ" data-i18n-attr="aria-label"><img src="img/item_brush.webp" alt=""></button>
    <button class="tool" id="tShower" type="button" aria-pressed="false" aria-label="シャワー" data-i18n-attr="aria-label"><span class="temoji">🚿</span></button>
  </div>

  <!-- はじめのガイドの吹き出し（道具のアイコンの左に出る） -->
  <div class="tip" id="tip" hidden></div>

  <!-- 右下：まえ・うしろを入れかえる -->
  <button class="sign btn turn" id="turn" type="button">↻ うしろ</button>

  <div class="bubble" id="bubble"></div>

  <!-- ピカピカになったら -->
  <div class="clear" id="clear" hidden>
    <div class="card">
      <p class="ctitle" data-i18n>ピカピカ！</p>
      <div class="cardtop"><span class="chip" id="rwNew">NEW!</span><span class="count" id="rwCount"></span></div>
      <img id="rwImg" alt="" draggable="false">
      <p class="cline" id="cLine"></p>
      <p class="cnote" id="cNote"></p>
      <p class="cnote zknew" id="cZk" hidden></p>
      <div class="cbtns">
        <button class="sign btn" id="again" type="button" data-i18n>もう一回</button>
        <a class="sign btn" href="../" data-i18n>‹ もどる</a>
      </div>
    </div>
  </div>
  <!-- 洗い終わったときのカットイン（笑顔と「きれいになった！」の帯が、右から入って左へ抜ける。そのあと真上からのシャワー） -->
  <div id="cutin" class="cutin" aria-hidden="true" hidden>
    <div class="cutin-band">
      <img id="cutFace" alt="" draggable="false">
      <div class="cutin-text"><b data-i18n>きれいになった！</b></div>
    </div>
  </div>
  <!-- ずかん（見つけた落としもの）。全部そろうと、とくべつイラスト -->
  <div class="zukan" id="zukan" hidden>
    <div class="zkcard">
      <p class="zktitle">📖 <span data-i18n>ずかん</span> <span id="zkNum"></span></p>
      <div class="zkgrid" id="zkGrid"></div>
      <p class="zknote" id="zkNote"></p>
      <div class="cbtns">
        <button class="sign btn" id="zkArtBtn" type="button" hidden data-i18n>🎁 とくべつイラスト</button>
        <button class="sign btn" id="zkReset" type="button" hidden data-i18n>🔄 もう一度 あつめる</button>
        <button class="sign btn" id="zkClose" type="button" data-i18n>とじる</button>
      </div>
    </div>
  </div>
  <div class="clear" id="zkArt" hidden>
    <div class="card">
      <img class="artimg" id="zkArtImg" alt="" draggable="false">
      <p class="cline" id="zkArtTitle"></p>
      <p class="cnote" id="zkArtLine"></p>
      <div class="cbtns">
        <button class="sign btn" id="zkArtNext" type="button" hidden data-i18n>つぎへ ▶</button>
        <button class="sign btn" id="zkArtBack" type="button" data-i18n>もどる</button>
      </div>
    </div>
  </div>
  <div id="pops" aria-hidden="true"></div>

</main>
<!-- 本編と同じ設定（公開スイッチ）・ことば（i18n.js。洗うゲームの訳は washing.i18n.js）を使う -->
<script src="../config.js"></script>
<script src="washing.i18n.js"></script>
<!-- 中国語の画面の文字（本編と共通の文。英語は i18n.js の中にある） -->
<script src="../i18n.zh.js"></script>
<script src="../i18n.js"></script>
<!-- 遊び方の数え方（だれのものかわからない形で、数だけ） -->
<script src="../stats.js"></script>
<script>window.TanuStats && window.TanuStats.ping('p-wash');</script>
<!-- 画面に入る・出るときに丸く開く・閉じる（ぽんぽこ・ラリー・シーソーと同じ） -->
<script src="../iris.js"></script>
<script src="washing.js"></script>
</body>
</html>
