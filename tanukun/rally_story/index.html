<meta charset="utf-8">
<title>タヌくんとウルくん</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  タヌくん：第3章（ラリーの物語）のお試し版（2026-11-06〜07）
  ・話は3つ（右上の「話」で切りかえ・URL の ?part=0〜2 でも）
      0 序章：ウルくんとの出会い → 背中を押されて、おなかのアップで「ぽよん」
      1 特訓（3日目）：転んで砂まみれ → {name}が指でなぞると砂が落ちる（砂あり・砂なしの2枚を重ねて、なぞった所だけ消す）
      2 前夜（6日目）：ふたりきりの夜。「もたれかかっても、いい…？」→ 二択 → 絵が寄って暗くなる（もたれた＝余白）
  ・絵：img/bg_court.webp・tanu_*（本編の立ち絵を左右反転）・uru_*・intro_*・push_bump・sand_sandy／sand_clean・night_ask／night_relief
  ・おなかの「ぷるん」は第2章（matsuri）と同じ「ばね」と網目の変形（Jig）。点滅はしない（ちかちか対策）
  ・セリフは仮。本編にはまだつないでいない
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&display=swap&text=%E3%81%BD%E3%82%88%E3%82%93%EF%BC%81%E3%81%9A%E3%81%95%E3%83%BC%E3%81%A3%E3%83%9D%E3%83%B3">
<style>
:root{
  --ink:#4A2C1A; --orange:#F08A3C; --orange-d:#C8641E; --uru:#5B7FA6; --uru-d:#3E5F84;
  --display:-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;
  color-scheme:light;
}
/* 場面の絵の色なので、ダークモードでも同じ色のまま */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#4A2C1A}}
:root[data-theme="dark"]{--ink:#4A2C1A}
html,body{height:100%}
body{margin:0;background:#2a1a10;color:var(--ink);font-family:var(--display);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;display:flex;flex-direction:column;cursor:pointer;touch-action:manipulation;
  max-width:520px;margin:0 auto}
#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#87c6ef;contain:paint}
#stage.dark{background:#0b1024}
#stage.quake{animation:quake .35s ease-out}
@keyframes quake{0%,100%{translate:0 0}25%{translate:0 4px}50%{translate:0 -3px}75%{translate:0 2px}}
/* 背景（横長の絵を、ネットが見える所で切り取る） */
#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:62% 50%;transition:opacity .6s}
#stage.dark #bg{opacity:0}
#bg{transition:opacity .6s,filter 1.2s}
/* 大会のあとの夕方：昼の背景の上に、夕方の背景をゆっくり重ねる（時間がたつ感じ） */
#bg2{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:62% 50%;opacity:0;transition:opacity 3s ease-in-out}
#stage.evening #bg2{opacity:1}
/* 立ち絵 */
.chara{position:absolute;bottom:-16%;height:94%;transform:translateX(-50%) translateY(0) scale(.96);transform-origin:50% 100%;
  filter:brightness(.8) saturate(.9);transition:filter .35s,transform .35s,opacity .5s,left .6s cubic-bezier(.3,.1,.25,1);
  opacity:0;pointer-events:none}
.chara img{position:absolute;inset:0;height:100%;width:auto;display:block}
.chara img+img{opacity:0}           /* 表情は2枚を重ねて、ふわっと切りかえる */
#tanu{left:33%;aspect-ratio:627/900;z-index:1}
#tanu img{transform:scaleX(-1)}   /* 左右反転して、ウルくんと向き合う */
#uru{left:73%;aspect-ratio:491/850;height:calc(94% * 850 / 900);z-index:1}
#uru.away{left:160%}
#tanu.solo{left:50%}
#tanu.side{left:16%}             /* ラリー中は、タヌくんは横に（ボールが見えるように） */            /* ウルくんが来る前は、タヌくんがまんなか */
.chara.on{opacity:1}
.chara.talk{filter:none;transform:translateX(-50%) scale(1)}
#tanu.talk,#uru.talk{z-index:3}   /* 話している方を手前に（id の z-index より強く） */
.chara.hop{animation:hop .5s ease-out}
.chara.shake{animation:shake .5s ease-in-out}
@keyframes hop{0%,100%{translate:0 0}35%{translate:0 -6%}60%{translate:0 0}80%{translate:0 -1.5%}}
@keyframes shake{0%,100%{translate:0 0}20%{translate:-2% 0}40%{translate:2% 0}60%{translate:-1.5% 0}80%{translate:1% 0}}
/* 1枚絵（スチル） */
.still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 25%;opacity:0;transition:opacity .5s .7s;z-index:3}
.still.on{opacity:1;transition:opacity .7s}
.still.on[data-k="g-hide"]{transition:opacity 1.8s ease-in-out}   /* モジモジの絵は、ゆっくり出す */
/* 受け取ったときの、きらっ（ゆっくり・点滅しない） */
.twinkle{position:absolute;z-index:6;width:26px;height:26px;opacity:0;pointer-events:none;
  background:radial-gradient(circle,#fff 0 18%,rgba(255,240,200,.9) 30%,rgba(255,240,200,0) 70%);
  clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%)}
.twinkle.go{animation:twinkle 1.6s ease-in-out forwards}
@keyframes twinkle{0%{opacity:0;transform:scale(.3) rotate(0)}40%{opacity:1;transform:scale(1.2) rotate(30deg)}100%{opacity:0;transform:scale(.6) rotate(60deg)}}
/* おなかが揺れる1枚絵（canvas に描き直す）：押されて飛びこむ・砂はらい */
.jig{position:absolute;inset:0;z-index:6;opacity:0;transition:opacity .35s;pointer-events:none}
.jig.on{opacity:1;pointer-events:auto;touch-action:none}
.jig canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#bump.beat{animation:beat 2.7s ease-in-out}
@keyframes beat{0%,100%{transform:scale(1)}8%{transform:scale(1.025)}16%{transform:scale(1)}24%{transform:scale(1.018)}33%{transform:scale(1)}
  41%{transform:scale(1.025)}49%{transform:scale(1)}57%{transform:scale(1.018)}66%{transform:scale(1)}}
#tanu.lunge{left:50%;transform:translateX(-50%) scale(1.9);transform-origin:50% 45%;filter:none;z-index:3;
  transition:left .45s ease-in,transform .45s cubic-bezier(.5,0,.9,.6)}
/* 飛びつく：立ち絵を消して、飛びつきの絵（右向き・反転しない）が跳ねて右下の画面の外へ */
#tanu.dive{opacity:0 !important;transition:none}
#dive{position:absolute;left:30%;bottom:4%;height:64%;aspect-ratio:986/767;transform:translateX(-50%);opacity:0;z-index:4;pointer-events:none}
#dive img{height:100%;width:auto;display:block}
#dive.go{opacity:1;animation:dive3 2s linear both}   /* 左から飛んできて → 一瞬ためて → 右下へずっこける */
@keyframes dive3{0%{transform:translateX(-230%) translateY(-14%) rotate(-4deg);animation-timing-function:cubic-bezier(.2,.7,.4,1)}
  25%{transform:translateX(-50%) translateY(-8%) rotate(-2deg)}
  50%{transform:translateX(-46%) translateY(-6%) rotate(0deg);animation-timing-function:cubic-bezier(.5,0,.9,.6)}
  100%{transform:translateX(75%) translateY(62%) rotate(20deg) scale(1.1)}}
/* ウルくんが投げる：右へ動く。タヌくんの立ち絵は左の画面の外へ */
#uru.throw{left:92%}
#tanu.exit{left:-45%}
/* 投げたボール（ラリーのボールと同じ見た目） */
#toss{position:absolute;left:0;top:0;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;z-index:5;pointer-events:none;opacity:0;
  background:conic-gradient(from 20deg,#F7D34A 0 30%,#fff 0 48%,#3C6FD1 0 68%,#fff 0 82%,#F7D34A 0);box-shadow:inset -8px -10px 16px rgba(0,0,0,.25),0 4px 10px rgba(0,0,0,.25)}
@keyframes dive2{0%{transform:translateX(-50%) translateY(6%) scale(.92)}
  30%{transform:translateX(-40%) translateY(-12%) rotate(-5deg) scale(1)}
  100%{transform:translateX(75%) translateY(62%) rotate(20deg) scale(1.1)}}
/* 砂けむり（画面の下からふわっと広がって消える） */
.puff{position:absolute;z-index:4;left:50%;bottom:-6%;width:120%;height:46%;transform:translateX(-50%) scale(.3);opacity:0;pointer-events:none;
  background:radial-gradient(closest-side,rgba(240,214,170,.95),rgba(236,205,155,.75) 45%,rgba(230,200,150,0) 100%);filter:blur(4px)}
.puff.go{animation:puff 1.1s ease-out forwards}
@keyframes puff{0%{opacity:0;transform:translateX(-50%) scale(.3)}25%{opacity:1}100%{opacity:0;transform:translateX(-50%) scale(1.5) translateY(-12%)}}
#uru.pushed{left:60%;z-index:1;transition:left .3s ease-out}   /* ウルくんはタヌくんのうしろへ回って押す */
#tanu.front{z-index:4;filter:none}
/* その夜の浜（伏線の場面。絵は使わず CSS だけ：月・海の光・砂浜でゆっくり光る貝） */
#shore{position:absolute;inset:0;z-index:5;opacity:0;transition:opacity 1.2s;pointer-events:none;
  background:linear-gradient(#070d22 0%,#13234d 48%,#1d335f 52%,#0d1a36 58%,#2a2a3a 70%,#3b3428 100%)}
#shore.on{opacity:1}
#shore .moon{position:absolute;right:16%;top:12%;width:64px;height:64px;border-radius:50%;background:#fff6d8;box-shadow:0 0 40px 12px rgba(255,246,216,.35)}
#shore .glow{position:absolute;right:calc(16% + 18px);top:52%;width:28px;height:16%;background:linear-gradient(rgba(255,246,216,.55),rgba(255,246,216,0));filter:blur(3px);
  animation:glow 4s ease-in-out infinite}
@keyframes glow{50%{opacity:.6;transform:scaleX(1.3)}}
#shore .sh{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 10px 3px rgba(190,230,255,.8);opacity:.25;animation:tw 3.2s ease-in-out infinite}
@keyframes tw{50%{opacity:.9}}
#shore .find{position:absolute;left:46%;top:78%;width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 18px 8px rgba(255,236,190,.9);
  opacity:0;transform:scale(.3);transition:opacity 1.2s,transform 1.2s}
#shore.found .find{opacity:1;transform:scale(1.4)}
.name.narr{display:none}
/* 大会のラリー（3回つなぐ）：向こうから飛んでくるボールを、近くに来たらタップで打ち返す */
#rally{position:absolute;inset:0;z-index:5;display:none}
#rally.on{display:block}
#rally .ball{position:absolute;left:0;top:0;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;
  background:conic-gradient(from 20deg,#F7D34A 0 30%,#fff 0 48%,#3C6FD1 0 68%,#fff 0 82%,#F7D34A 0);box-shadow:inset -8px -10px 16px rgba(0,0,0,.25),0 4px 10px rgba(0,0,0,.25)}
#rally .shadow{position:absolute;left:0;top:0;width:80px;height:20px;margin:-10px 0 0 -40px;border-radius:50%;background:rgba(80,50,20,.28);filter:blur(3px)}
#rally .rc{position:absolute;left:50%;top:54px;transform:translateX(-50%);background:rgba(255,255,255,.85);color:var(--orange-d);font-weight:800;font-size:14px;padding:6px 14px;border-radius:99px}
/* 夜（前夜）：絵を包む2重の箱。外＝もたれる動き（寄る・傾く・暗く）、内＝ゆっくりした鼓動 */
#night{position:absolute;inset:0;z-index:5;opacity:0;transition:opacity 1s;overflow:hidden;background:#0b1024}
#night.on{opacity:1}
#night .lean{position:absolute;inset:0;transition:transform 1.8s cubic-bezier(.35,.05,.25,1),filter 1.8s ease}
#night.leaning .lean{transform:translateX(20%) translateY(5%) rotate(-7deg) scale(1.45);filter:brightness(.32) blur(2.5px)}
#night .beat{position:absolute;inset:0}
#night.leaning .beat{animation:slowbeat 1.5s ease-in-out infinite}
@keyframes slowbeat{0%,100%{transform:scale(1)}12%{transform:scale(1.012)}24%{transform:scale(1)}36%{transform:scale(1.008)}48%{transform:scale(1)}}
#night img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;transition:opacity .9s}
#night img.off{opacity:0}
.pop{position:absolute;z-index:8;left:50%;top:50%;transform:translate(-50%,-50%);font-family:"Mochiy Pop One",var(--display);
  font-size:clamp(30px,9vw,40px);color:#fff;-webkit-text-stroke:6px var(--orange-d);paint-order:stroke fill;
  text-shadow:0 3px 0 #9E4A12;pointer-events:none;opacity:0;white-space:nowrap}
.pop.go{animation:pop 1s ease-out}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}35%{transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}
/* 操作ガイド（押せない・ふわっと出て消える） */
.hint{position:absolute;z-index:8;left:50%;bottom:64px;transform:translateX(-50%);background:rgba(255,255,255,.9);color:var(--orange-d);
  font-size:14px;font-weight:800;padding:7px 14px;border-radius:99px;box-shadow:0 2px 8px rgba(0,0,0,.25);white-space:nowrap;
  opacity:0;transition:opacity .5s;pointer-events:none}
.hint.on{opacity:1}
/* 砂のはらい具合 */
.meter{position:absolute;z-index:8;left:50%;bottom:50px;transform:translateX(-50%);width:120px;height:8px;border-radius:99px;
  background:rgba(255,255,255,.55);overflow:hidden;opacity:0;transition:opacity .5s;pointer-events:none}
.meter.on{opacity:1}
.meter i{display:block;height:100%;width:0;background:var(--orange);border-radius:99px;transition:width .2s}
#stage::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:44px;z-index:7;
  background:linear-gradient(transparent,#2a1a10 85%);pointer-events:none}
/* セリフの枠 */
#talk{position:relative;z-index:10;flex:none;margin-top:-2px;background:#2a1a10;padding:24px 16px calc(env(safe-area-inset-bottom,0px) + 14px)}   /* 絵のはしが1px でもはみ出さないよう、セリフ欄を上に重ねる */
.box{position:relative;min-height:5.2em;padding:18px 20px 22px;border-radius:22px;background:#fff;
  box-shadow:0 4px 14px rgba(0,0,0,.25);font-size:clamp(17px,4.8vw,22px);font-weight:700;line-height:1.55;white-space:pre-line}
.name{position:absolute;left:18px;top:-14px;background:var(--orange);color:#fff;font-size:14px;font-weight:800;
  padding:4px 14px;border-radius:99px;box-shadow:0 2px 0 var(--orange-d);transition:background .2s,box-shadow .2s}
.name.uru{left:auto;right:18px;background:var(--uru);box-shadow:0 2px 0 var(--uru-d)}   /* ウルくんは右に・青 */
.more{position:absolute;right:16px;bottom:8px;color:var(--orange-d);font-size:14px;opacity:0}
.more.on{opacity:1;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(3px)}}
.btns{position:absolute;left:0;right:0;bottom:100%;z-index:5;display:flex;justify-content:center;gap:12px;margin-bottom:6px}
.btns[hidden]{display:none}
.btn{border:0;border-radius:99px;font:inherit;font-weight:800;font-size:17px;padding:12px 30px;cursor:pointer;
  background:var(--orange);color:#fff;box-shadow:0 4px 0 var(--orange-d)}
/* 二択：白い丸・ぷっくり（第2章と同じ） */
.btn.alt{background:#fff;color:var(--orange-d);padding:13px 24px;border:2px solid #FFD2A6;
  box-shadow:0 5px 0 #E3B98F,0 10px 18px rgba(0,0,0,.30);animation:btnIn .45s ease-out backwards}
.btn.alt:nth-child(2){animation-delay:.15s}
@keyframes btnIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
/* 道具ボタン */
.tool{position:absolute;top:12px;z-index:9;border:0;border-radius:99px;background:rgba(255,255,255,.72);color:var(--ink);
  font:inherit;font-size:13px;font-weight:800;padding:7px 12px;cursor:pointer}
#nm{right:16px}
#part{right:16px;top:48px}   /* 名前の下に（英語で長くなっても重ならないように） */
#step{left:16px;cursor:default}
#lang{left:16px;top:48px}
html[lang="zh-Hans"] body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif}
@media (prefers-reduced-motion:reduce){#bump.beat,#night.leaning .beat,#stage.quake,.chara.hop,.chara.shake{animation:none}
  #tanu.lunge{transition:none}#dive.go{animation-duration:1.2s}.puff.go{animation-duration:.4s}.more.on{animation:none}}
</style>

<div id="game">
  <div id="stage">
    <img id="bg" src="img/bg_court.webp" alt="">
    <img id="bg2" src="img/bg_court_evening.webp" alt="">
    <div class="chara" id="tanu"><img alt=""><img alt=""></div>
    <div class="chara away" id="uru"><img alt=""><img alt=""></div>
    <img class="still" data-k="invite" src="img/intro_invite.webp" alt="">
    <img class="still" data-k="sand" src="img/intro_sand.webp" alt="">
    <div id="rally"><span class="shadow"></span><span class="ball"></span><span class="rc"></span></div>
    <img class="still" data-k="g-hide" src="img/gift_hide.webp" alt="">
    <img class="still" data-k="g-shy" src="img/gift_shy.webp" alt="">
    <img class="still" data-k="g-tear" src="img/gift_tear.webp" alt="">
    <img class="still" data-k="g-smile" src="img/gift_smile.webp" alt="">
    <span class="twinkle" style="left:40%;top:52%"></span><span class="twinkle" style="left:58%;top:57%;animation-delay:.35s"></span><span class="twinkle" style="left:49%;top:63%;animation-delay:.7s"></span>
    <div class="jig" id="bump"><canvas></canvas></div>
    <div class="jig" id="sand"><canvas></canvas></div>
    <div id="shore"><span class="moon"></span><span class="glow"></span>
      <span class="sh" style="left:22%;top:80%"></span><span class="sh" style="left:68%;top:84%;animation-delay:1.1s"></span><span class="sh" style="left:35%;top:91%;animation-delay:2s"></span>
      <span class="find"></span></div>
    <div id="night"><div class="lean"><div class="beat">
      <img data-k="ask" src="img/night_ask.webp" alt="">
      <img data-k="relief" class="off" src="img/night_relief.webp" alt="">
    </div></div></div>
    <span id="toss"></span>
    <div id="dive"><img src="img/tanu_dive.webp" alt=""></div>
    <div class="puff" id="puff"></div>
    <div class="pop" id="pop"></div>
    <div class="hint" id="hint"></div>
    <div class="meter" id="meter"><i></i></div>
    <span class="tool" id="step"></span>
    <button class="tool" id="lang" type="button"></button>
    <button class="tool" id="part" type="button"></button>
    <button class="tool" id="nm" type="button"></button>
  </div>
  <div id="talk">
    <div class="btns" hidden></div>
    <div class="box"><span class="name"></span><span id="text"></span><span class="more">▼</span></div>
  </div>
</div>

<script>
(() => {
  /* ===== セリフ（仮） =====
     who＝話す人（tanu／uru）・t／u＝表情・still＝1枚絵（invite／sand）・uru:'in'＝ウルくん登場・anim＝hop／shake・label＝名前の札
     fx：push（ウルくんが押す）・bump（飛びこむ→おなかアップ）・dive（ボールに飛びつく→砂まみれ）
     jig：'bump'／'sand'＝おなかが揺れる1枚絵を出す・interact:'sand'＝砂をはらい終わるまで進まない
     night：'ask'／'relief'＝夜の絵・lean＝もたれている間（絵が寄って暗く）・choice＝二択（どちらでも先は同じ。alt＝選んだ側で変わる次の行） */
  const PARTS = [
    { title: '序章', start: 'solo', lines: [
      { still: 'invite', who: 'tanu', text: '{name}！ 見て見て！\n浜で、ビーチバレーの大会があるんだって！' },
      { still: 'invite', who: 'tanu', choice: ['うん、いっしょに出よう！'], text: 'ふたり一組で出るんだ。\n…{name}、ぼくといっしょに、出てくれない？' },
      { who: 'tanu', t: 'happy', anim: 'hop', text: 'やったぁ！\nあのね、優勝すると、すっごくきれいな貝のネックレスがもらえるんだよ♪' },
      { who: 'tanu', t: 'shy', text: 'ぼく、どうしても、それがほしくて…\nえへへ、なんでかは、ないしょ！' },
      { who: 'tanu', t: 'normal', text: 'それでね、練習相手を呼んであるんだ！' },
      { who: 'uru', uru: 'in', u: 'laugh', label: '？？？', text: 'おーい、タヌくーん！' },
      { who: 'tanu', t: 'happy', anim: 'hop', text: 'ウルくん！ こっちこっち♪' },

  /* ===== 砂はらい：砂あり（sandy）を、なぞった所だけ消して、砂なし（clean）を見せる =====

  const SW = 768, SH = 1152, AREA = { cx: 375, cy: 790, rx: 310, ry: 260 }, BRUSH = 46, GX = 48, GY = 72;
  const comp = document.createElement('canvas'), sMask = document.createElement('canvas');
  comp.width = sMask.width = SW; comp.height = sMask.height = SH;

  const CHEEKS = [[262, 435], [478, 425]];

    // 2枚の差から、升目ごとの砂の量を出す（はらい具合のものさし）

    x.drawImage(sandy, 0, 0, GX, GY); const a = x.getImageData(0, 0, GX, GY).data;
    x.clearRect(0, 0, GX, GY); x.drawImage(clean, 0, 0, GX, GY); const b = x.getImageData(0, 0, GX, GY).data;

  /* ===== 大会のラリー（3回つなぐ・失敗しても投げなおし。負けはない） =====
     ボールは向こう（ネットの上）から山なりに手前へ。近くに来た所（進み 62〜105%）でタップすると打ち返す。速さは1回ごとに少し上がる */
  const rally = $('#rally'), ballEl = rally.querySelector('.ball'), shEl = rally.querySelector('.shadow');
  const G = { goal: 3, n: 0, phase: '', t0: 0, x0: .5, x1: .5, raf: 0, from: null };
  const DUR = [1.7, 1.5, 1.3];

  /* ===== 投げたボール：弧を描いて飛び、タヌくんの手の少し先に落ちて、はずむ =====

  let tossing = false;
  function tossBall(kind) {
    const el = $('#toss'), r = stage.getBoundingClientRect(), W = r.width, H = r.height;
    // [時刻(ms), x, y, 大きさ]（x・y は画面の割合）。タヌくんの手の先（約1.5秒）をかすめて、その先に落ちる＝届かない

      ? [[0, 1.05, .05, .7], [1400, .66, .4, .9], [2000, .55, .86, 1], [2300, .62, .76, 1], [2700, .68, .86, 1]]

    const dur = P[P.length - 1][0] + 300;

  /* ===== 1行を出す ===== */
  function show(k) {
    const L = LINES[k];
    document.querySelectorAll('.still').forEach((s) => { const on = s.dataset.k === L.still; if (on && !s.classList.contains('on')) { stage.appendChild(s); s.style.transition = k === 0 ? 'none' : ''; void s.offsetWidth; } s.classList.toggle('on', on); });   // 話の最初の1枚絵は、フェードせずにすぐ出す（立ち絵が一瞬見えないように）   // 動かしたあと、一度計算させてから出す（しないとフェードせずに一瞬で出ていた）   // 新しく出す絵を、ほかの1枚絵より上に（前の絵は出きるまで残る）
    if (L.fx === 'twinkle') document.querySelectorAll('.twinkle').forEach((t) => { t.classList.remove('go'); void t.offsetWidth; t.classList.add('go'); });
    // おなかが揺れる1枚絵
    if (L.jig !== 'bump') { bumpEl.classList.remove('on', 'beat'); ch.tanu.classList.remove('lunge'); if (L.fx !== 'push') ch.tanu.classList.remove('front'); ch.uru.classList.remove('pushed'); }
    if (L.jig === 'sand' && !sandEl.classList.contains('on')) { sandEl.classList.add('on'); sand.draw(); sand.kick(2.4); sand.wave({ x: AREA.cx, y: AREA.cy }, 1); }
    if (L.jig !== 'sand') sandEl.classList.remove('on');
    if (L.fx !== 'dive' && L.jig !== 'sand') ch.tanu.classList.remove('dive');
    if (L.fx !== 'dive') $('#dive').classList.remove('go');
    if (L.fx === 'push') { ch.uru.classList.add('pushed'); ch.tanu.classList.add('front'); setTimeout(() => anim('tanu', 'shake'), 300); }
    if (L.fx === 'bump') {   // タヌくんがよろけて、こちらへ大きくなる → 1枚絵に切りかえて「ぽよん！」＋鼓動
      ch.tanu.classList.add('lunge');
      setTimeout(() => { bumpEl.classList.add('on'); bump.draw(); bump.kick(3.8); bump.wave({ x: 510, y: 1090 }, 1.2); popWord('ぽよん！'); setTimeout(() => bump.kick(1.6), 520);
        if (!reduce) { bumpEl.classList.remove('beat'); void bumpEl.offsetWidth; bumpEl.classList.add('beat'); } }, 420);
    }
    if (L.fx === 'toss') { ch.uru.classList.add('throw'); ch.tanu.classList.add('exit'); tossBall('toss'); }
    if (L.fx !== 'toss' && L.fx !== 'dive') { ch.uru.classList.remove('throw'); ch.tanu.classList.remove('exit'); }
    if (L.fx === 'dive') {   // ボールに飛びつく：上へ跳んで、画面の外へ飛びこむ → 砂けむり・地面が少し揺れる（点滅はしない）→ 砂まみれの絵へ
      ch.tanu.classList.add('dive'); const dv = $('#dive'); dv.classList.remove('go'); void dv.offsetWidth; dv.classList.add('go');
      if (!tossing) tossBall('spike');   // 大会：相手のスパイクが右から飛んでくる
      setTimeout(() => {
        const pf = $('#puff'); pf.classList.remove('go'); void pf.offsetWidth; pf.classList.add('go'); popWord('ずさーっ！');
        if (!reduce) { stage.classList.remove('quake'); void stage.offsetWidth; stage.classList.add('quake'); }
      }, 1900);
    }
    clearTimeout(autoT);
    if (L.auto) autoT = setTimeout(() => { if (i === k) { clearInterval(typing); typing = null; show(++i); } }, L.auto);
    if (L.interact === 'sand') { waitSand = true; setTimeout(() => { if (waitSand) { hint(tl('👆 おなかを なでて、砂を おとしてね')); $('#meter').classList.add('on'); } }, 900); }
    // 背景だけ（大会のあと）：立ち絵を消して、夕方の色に
    if (L.empty) { ch.tanu.classList.remove('on'); ch.uru.classList.remove('on'); stage.classList.add('evening'); }
    // 大会のラリー
    if (L.game) setTimeout(() => startGame(L.game), 900);
    // ネックレス（仮カード）：タヌくんがまんなかに来る
    // その夜の浜
    const sh = $('#shore');
    sh.classList.toggle('on', !!L.shore); stage.classList.toggle('dark', !!L.shore || PARTS[part].start === 'night');
    if (!L.shore) sh.classList.remove('found');
    if (L.fx === 'find') setTimeout(() => sh.classList.add('found'), 300);
    if (L.shore) { sandEl.classList.remove('on'); ch.tanu.classList.remove('on'); ch.uru.classList.remove('on'); }
    // 夜
    const nt = $('#night');
    nt.classList.toggle('on', !!L.night);
    nt.classList.toggle('leaning', !!L.lean);
    if (L.night) nt.querySelectorAll('img').forEach((im) => im.classList.toggle('off', im.dataset.k !== L.night));
    // 立ち絵
    if (L.uru === 'in') { ch.uru.classList.remove('away'); ch.uru.classList.add('on'); ch.tanu.classList.remove('solo'); }
    if (L.t) setFace('tanu', L.t);
    if (L.u) setFace('uru', L.u);
    for (const w of ['tanu', 'uru']) ch[w].classList.toggle('talk', L.who === w);
    if (L.anim) anim(L.who, L.anim);
    nameEl.textContent = tl(L.label || NAMES[L.who] || '');
    nameEl.classList.toggle('narr', L.who === 'narr');
    nameEl.classList.toggle('uru', L.who === 'uru');
    more.style.color = L.who === 'uru' ? 'var(--uru-d)' : '';
    $('#step').textContent = (k + 1) + ' / ' + LINES.length;
    // 二択
    btns.innerHTML = ''; btns.hidden = true; waitChoice = false;
    if (L.choice) {
      waitChoice = true;
      L.choice.forEach((c, n) => { const b = document.createElement('button'); b.className = 'btn alt'; b.type = 'button'; b.textContent = tl(c);
        b.addEventListener('click', () => { picked = n; waitChoice = false; btns.hidden = true; show(++i); }); btns.appendChild(b); });
      setTimeout(() => { if (waitChoice) btns.hidden = false; }, 700);
    }
    type(withName(tl(L.alt ? L.alt[picked] : L.text)));
  }
  function next() {
    if (typing) { clearInterval(typing); typing = null; textEl.textContent = full; if (!waitChoice && !waitSand && !waitGame) more.classList.add('on'); return; }
    if (waitChoice || waitSand || waitGame) return;   // 二択・砂はらいの間は進まない
    if (i >= LINES.length - 1) { endButtons(); return; }
    show(++i);
  }
  function endButtons() {
    more.classList.remove('on'); btns.innerHTML = ''; btns.hidden = false;
    const again = document.createElement('button'); again.className = 'btn'; again.type = 'button'; again.textContent = tl('もう一度');
    again.addEventListener('click', () => reset(part)); btns.appendChild(again);
    if (part < PARTS.length - 1) { const nx = document.createElement('button'); nx.className = 'btn alt'; nx.type = 'button'; nx.textContent = tl('次の話 ▶');
      nx.addEventListener('click', () => reset(part + 1)); btns.appendChild(nx); }
  }
  function reset(p) {
    part = p; LINES = PARTS[p].lines; i = -1; picked = 0; waitChoice = waitSand = false; stopGame();
    btns.innerHTML = ''; btns.hidden = true; hideHint(); $('#meter').classList.remove('on');
    const st = PARTS[p].start;
    stage.classList.toggle('dark', st === 'night'); stage.classList.remove('evening');
    ch.tanu.className = 'chara'; ch.uru.className = 'chara away';
    bumpEl.classList.remove('on', 'beat'); sandEl.classList.remove('on'); $('#night').className = '';
    if (st === 'solo') { ch.tanu.classList.add('on', 'solo'); setFace('tanu', 'normal', true); setFace('uru', 'normal', true); }
    if (st === 'duo') { ch.tanu.classList.add('on'); ch.uru.classList.add('on'); ch.uru.classList.remove('away'); setFace('tanu', 'happy', true); setFace('uru', 'laugh', true); }
    if (sandW) resetSand();
    $('#part').textContent = tl('話：') + tl(PARTS[p].title) + ' ▸';
    next();
  }
  function nmLabel() { $('#nm').textContent = tl('名前：') + (useName ? NAME : tl('なし')); }

  $('#game').addEventListener('click', (e) => {
    if (e.target.closest('button')) return;
    if (dragged) { dragged = false; return; }   // スワイプしたあとは、セリフを進めない
    if (waitGame) { hitBall(); return; }
    if (bumpEl.classList.contains('on')) { const q = bump.toImg(e); if (bump.inBelly(q)) { bump.poke(q); bump.kick(1.8); bump.wave(q, 1); } }   // タップでも「ぷるん」＋波紋
    if (sandEl.classList.contains('on') && !waitSand) { const q = sand.toImg(e); if (sand.inBelly(q)) { sand.poke(q); sand.kick(1.4); sand.wave(q, .8); } }
    next();
  });
  $('#part').addEventListener('click', () => reset((part + 1) % PARTS.length));
  $('#nm').addEventListener('click', () => { useName = !useName; nmLabel(); if (i >= 0 && !waitSand) { clearInterval(typing); typing = null; show(i); } });

  // 絵を先に読みこんでおく
  ['tanu_normal', 'tanu_happy', 'tanu_shy', 'tanu_dere', 'tanu_troubled', 'uru_normal', 'uru_laugh', 'uru_surprise'].forEach((n) => { new Image().src = 'img/' + n + '.webp'; });
  // セリフ欄の行数が変わって絵の高さが変わったら、揺れる絵（canvas）を描き直す（前は画面の回転のときだけだった）
  if (window.ResizeObserver) new ResizeObserver(() => { bump.draw(); sand.draw(); }).observe(stage);
  $('#lang').addEventListener('click', () => {
    setLang(LANGS[(LANGS.indexOf(LANG) + 1) % LANGS.length]); nmLabel(); $('#part').textContent = tl('話：') + tl(PARTS[part].title) + ' ▸';
    if (i >= 0 && !waitSand && !waitGame) { clearInterval(typing); typing = null; show(i); }
  });
  setLang(LANG);
  nmLabel(); reset(part);
})();
</script>
