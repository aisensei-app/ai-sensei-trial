<meta charset="utf-8">
<title>タヌくんとウルくん</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  タヌくん：ラリーの序章「ウルくんとの出会い」のお試し版（2026-11-06）
  ・目的：恋愛ゲームの形（背景＋左右の立ち絵＋名前の札つきセリフ枠）で、2人の会話が見やすいかを確かめる
  ・絵：img/bg_court.webp（キャラのいない浜のコート・横長）
        img/tanu_*.webp（本編の立ち絵。正面寄り・仮）／img/uru_*.webp（ウルくん。マゼンタを key_out で抜いた）
        img/intro_invite.webp・intro_sand.webp（1枚絵＝スチル。序章の頭と終わり）
  ・背の高さは 180cm：170cm（img を作るときに 900px：850px にそろえた）
  ・話している方を明るく・少し前へ。話していない方は少し暗く・小さく
  ・セリフは仮（ユーザーと相談中）。本編にはまだつないでいない
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&display=swap&text=%E3%81%BD%E3%82%88%E3%82%93%EF%BC%81">
<style>
:root{
  --ink:#4A2C1A; --orange:#F08A3C; --orange-d:#C8641E; --uru:#5B7FA6; --uru-d:#3E5F84;
  --display:-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;
  color-scheme:light;
}
/* 場面の絵の色なので、ダークモードでも同じ色のまま */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#4A2C1A}}
:root[data-theme="dark"]{--ink:#4A2C1A}
html,body{height:100%}
body{margin:0;background:#2a1a10;color:var(--ink);font-family:var(--display);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;display:flex;flex-direction:column;cursor:pointer;touch-action:manipulation;
  max-width:520px;margin:0 auto}
#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#87c6ef}
/* 背景（横長の絵を、ネットが見える所で切り取る） */
#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:62% 50%;
  transition:object-position 1.6s cubic-bezier(.35,.05,.25,1)}
/* 立ち絵 */
.chara{position:absolute;bottom:-16%;height:94%;transform:translateX(-50%) translateY(0) scale(.96);transform-origin:50% 100%;
  filter:brightness(.8) saturate(.9);transition:filter .35s,transform .35s,opacity .5s,left .6s cubic-bezier(.3,.1,.25,1);
  opacity:0;pointer-events:none}
.chara img{position:absolute;inset:0;height:100%;width:auto;display:block}
.chara img+img{opacity:0}           /* 表情は2枚を重ねて、ふわっと切りかえる */
#tanu{left:33%;aspect-ratio:627/900;z-index:1}
#tanu img{transform:scaleX(-1)}   /* 左右反転して、ウルくんと向き合う（2026-11-06 お試し） */
#uru{left:73%;aspect-ratio:491/850;height:calc(94% * 850 / 900);z-index:1}
#uru.away{left:120%}
#tanu.talk,#uru.talk{z-index:3}   /* 話している方を手前に（id の z-index より強く） */
#tanu.solo{left:50%}            /* ウルくんが来る前は、タヌくんがまんなか */
.chara.on{opacity:1}
.chara.talk{filter:none;transform:translateX(-50%) scale(1);z-index:2}
.chara.hop{animation:hop .5s ease-out}
.chara.shake{animation:shake .5s ease-in-out}
@keyframes hop{0%,100%{translate:0 0}35%{translate:0 -6%}60%{translate:0 0}80%{translate:0 -1.5%}}
@keyframes shake{0%,100%{translate:0 0}20%{translate:-2% 0}40%{translate:2% 0}60%{translate:-1.5% 0}80%{translate:1% 0}}
/* 1枚絵（スチル） */
.still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 25%;opacity:0;transition:opacity .8s;z-index:3}
.still.on{opacity:1}
/* 押されて飛びこんでくる場面（1枚絵＋おなかのぷるん）。canvas に描き直す */
#bump{position:absolute;inset:0;z-index:6;opacity:0;transition:opacity .25s}
#bump.on{opacity:1;touch-action:none}
#bump canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#bump.beat{animation:beat 2.7s ease-in-out}
@keyframes beat{0%,100%{transform:scale(1)}8%{transform:scale(1.025)}16%{transform:scale(1)}24%{transform:scale(1.018)}33%{transform:scale(1)}
  41%{transform:scale(1.025)}49%{transform:scale(1)}57%{transform:scale(1.018)}66%{transform:scale(1)}}
#tanu.lunge{left:50%;transform:translateX(-50%) scale(1.9);transform-origin:50% 45%;filter:none;z-index:3;
  transition:left .45s ease-in,transform .45s cubic-bezier(.5,0,.9,.6)}
#uru.pushed{left:60%;z-index:1;transition:left .3s ease-out}   /* ウルくんはタヌくんのうしろへ回って押す */
#tanu.front{z-index:4;filter:none}
.pop{position:absolute;z-index:8;left:50%;top:50%;transform:translate(-50%,-50%);font-family:"Mochiy Pop One",var(--display);
  font-size:clamp(30px,9vw,40px);color:#fff;-webkit-text-stroke:6px var(--orange-d);paint-order:stroke fill;
  text-shadow:0 3px 0 #9E4A12;pointer-events:none;opacity:0;white-space:nowrap}
.pop.go{animation:pop 1s ease-out}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}35%{transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}
#stage::after{content:"";position:absolute;left:0;right:0;bottom:0;height:40px;z-index:7;
  background:linear-gradient(transparent,#2a1a10);pointer-events:none}
/* セリフの枠 */
#talk{position:relative;flex:none;padding:22px 16px calc(env(safe-area-inset-bottom,0px) + 14px)}
.box{position:relative;min-height:5.2em;padding:18px 20px 22px;border-radius:22px;background:#fff;
  box-shadow:0 4px 14px rgba(0,0,0,.25);font-size:clamp(17px,4.8vw,22px);font-weight:700;line-height:1.55;white-space:pre-line}
.name{position:absolute;left:18px;top:-14px;background:var(--orange);color:#fff;font-size:14px;font-weight:800;
  padding:4px 14px;border-radius:99px;box-shadow:0 2px 0 var(--orange-d);transition:background .2s,box-shadow .2s}
.name.uru{left:auto;right:18px;background:var(--uru);box-shadow:0 2px 0 var(--uru-d)}   /* ウルくんは右に・青 */
.more{position:absolute;right:16px;bottom:8px;color:var(--orange-d);font-size:14px;opacity:0}
.more.on{opacity:1;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(3px)}}
.btns{position:absolute;left:0;right:0;bottom:100%;z-index:5;display:flex;justify-content:center;margin-bottom:6px}
.btns[hidden]{display:none}
.btn{border:0;border-radius:99px;font:inherit;font-weight:800;font-size:17px;padding:12px 30px;cursor:pointer;
  background:var(--orange);color:#fff;box-shadow:0 4px 0 var(--orange-d)}
/* 道具ボタン */
.tool{position:absolute;top:12px;z-index:9;border:0;border-radius:99px;background:rgba(255,255,255,.72);color:var(--ink);
  font:inherit;font-size:13px;font-weight:800;padding:7px 12px;cursor:pointer}
#nm{right:16px}
#step{left:16px;cursor:default}
@media (prefers-reduced-motion:reduce){#bump.beat,.chara.hop,.chara.shake{animation:none}#tanu.lunge{transition:none}.more.on{animation:none}}
</style>

<div id="game">
  <div id="stage">
    <img id="bg" src="img/bg_court.webp" alt="">
    <div class="chara" id="tanu"><img alt=""><img alt=""></div>
    <div class="chara away" id="uru"><img alt=""><img alt=""></div>
    <img class="still" data-k="invite" src="img/intro_invite.webp" alt="">
    <img class="still" data-k="sand" src="img/intro_sand.webp" alt="">
    <div id="bump" data-belly="510,1050,520,390"><canvas></canvas></div>
    <div class="pop" id="pop">ぽよん！</div>
    <span class="tool" id="step"></span>
    <button class="tool" id="nm" type="button"></button>
  </div>
  <div id="talk">
    <div class="btns" hidden><button class="btn" id="again" type="button">もう一度</button></div>
    <div class="box"><span class="name"></span><span id="text"></span><span class="more">▼</span></div>
  </div>
</div>

<script>
(() => {
  // セリフ（仮）。who＝話す人（tanu／uru）・t／u＝その行の表情（書かないと前のまま）
  // still＝1枚絵（invite／sand）・uru＝ウルくんの出入り（'in'）・anim＝動き（hop／shake）・label＝名前の札（初登場の「？？？」）
  const LINES = [
    { still: 'invite', who: 'tanu', text: '{name}！ 浜でね、ボールを見つけたんだ♪' },
    { still: 'invite', who: 'tanu', text: 'いっしょに、ぽよんラリーしよ！' },
    { who: 'tanu', t: 'happy', text: 'あ、そうだ。今日はね、{name}に会ってほしい友だちがいるんだ。' },
    { who: 'uru', uru: 'in', u: 'laugh', label: '？？？', text: 'おーい、タヌくーん！' },
    { who: 'tanu', t: 'happy', anim: 'hop', text: 'ウルくん！ こっちこっち♪' },
    { who: 'uru', u: 'normal', text: 'きみが{name}だね！\nはじめまして、ウルだよ。よろしくね♪' },
    { who: 'tanu', t: 'normal', text: 'ウルくんはね、となりの島に住んでる、ぼくの幼なじみなんだ。' },
    { who: 'uru', u: 'laugh', text: 'タヌくんね、{name}の話をするとき、いっつも すっごくうれしそうなんだ。\nだから、ぼくも会ってみたかったんだ。' },
    { who: 'tanu', t: 'shy', anim: 'shake', text: 'ウ、ウルくん…！ それ、言わないでって…' },
    { who: 'uru', u: 'surprise', anim: 'hop', text: 'あれっ、ないしょだった？ ごめんごめん！' },
    { who: 'uru', u: 'normal', text: 'でもさ、タヌくん。{name}に言いたいこと、あるんでしょ？' },
    { who: 'uru', u: 'laugh', fx: 'push', text: 'ほらっ、いってらっしゃい！' },
    { bump: true, fx: 'bump', who: 'tanu', text: 'わわっ…！' },
    { bump: true, who: 'tanu', text: 'ご、ごめん、{name}…！\nぶつかっちゃった…' },
    { bump: true, who: 'tanu', text: '……でも、{name}、あったかいね。' },
    { bump: true, who: 'tanu', text: '…あのね。\nぼく、{name}とラリーするの、ずっと楽しみにしてたんだ。' },
    { who: 'uru', u: 'laugh', anim: 'hop', text: 'よーし！ じゃあ3人で、ぽよんラリーだ！' },
    { still: 'sand', who: 'tanu', text: 'えへへ…ころんじゃった。' },
    { still: 'sand', who: 'tanu', text: 'でも、{name}とウルくんとだと、すっごく楽しいね♪' },
    { still: 'sand', who: 'uru', text: 'またやろうね、{name}！' }
  ];
  const NAMES = { tanu: 'タヌくん', uru: 'ウルくん' };

  const $ = (s) => document.querySelector(s);
  const ch = { tanu: $('#tanu'), uru: $('#uru') };
  const face = { tanu: 'normal', uru: 'normal' };
  const textEl = $('#text'), nameEl = $('.name'), more = $('.more'), btns = $('.btns');
  let i = -1, typing = null, full = '', useName = true;
  const NAME = 'コンちゃん';

  // 名前：なしの人は、文頭の「{name}、」は消し、文の途中は「きみ」（本編の withName と同じ）
  function withName(s) {
    if (useName) return s.split('{name}').join(NAME);
    return s.replace(/^\{name\}[、！]\s*/, '').split('{name}').join('きみ');
  }
  // 表情：2枚の img を交互に使って、ふわっと切りかえる
  function setFace(who, f, instant) {
    const imgs = ch[who].querySelectorAll('img');
    const src = 'img/' + who + '_' + f + '.webp';
    const cur = imgs[0].style.opacity === '0' ? imgs[1] : imgs[0];
    if (cur.getAttribute('src') === src) return;
    const nxt = cur === imgs[0] ? imgs[1] : imgs[0];
    if (instant) { cur.src = src; cur.style.opacity = 1; nxt.style.opacity = 0; return; }
    nxt.style.transition = cur.style.transition = 'opacity .25s';
    nxt.onload = () => { nxt.style.opacity = 1; cur.style.opacity = 0; };
    nxt.src = src;
    if (nxt.complete) nxt.onload();
  }
  function anim(who, a) {
    const el = ch[who];
    el.classList.remove('hop', 'shake'); void el.offsetWidth; el.classList.add(a);
  }
  function type(s) {
    clearInterval(typing); full = s; textEl.textContent = ''; more.classList.remove('on');
    let n = 0;
    typing = setInterval(() => {
      n++; textEl.textContent = full.slice(0, n);
      if (n >= full.length) { clearInterval(typing); typing = null; more.classList.add('on'); }
    }, 38);
  }
  function show(k) {
    const L = LINES[k];
    document.querySelectorAll('.still').forEach((s) => s.classList.toggle('on', s.dataset.k === L.still));
    if (!L.bump) { bumpEl.classList.remove('on', 'beat'); ch.tanu.classList.remove('lunge'); if (L.fx !== 'push') ch.tanu.classList.remove('front'); ch.uru.classList.remove('pushed'); }
    if (L.fx === 'push') { ch.uru.classList.add('pushed'); ch.tanu.classList.add('front'); setTimeout(() => anim('tanu', 'shake'), 300); }
    if (L.fx === 'bump') {
      // タヌくんがよろけて、こちらへ大きくなる → 1枚絵に切りかえて「ぽよん！」＋鼓動
      ch.tanu.classList.add('lunge');
      setTimeout(() => { bumpEl.classList.add('on'); drawBump(); kick(3.8); wave({ x: E.cx, y: E.cy + 40 }, 1.2); popWord(); setTimeout(() => kick(1.6), 520);
        if (!reduce) { bumpEl.classList.remove('beat'); void bumpEl.offsetWidth; bumpEl.classList.add('beat'); } }, 420);
    }
    if (L.uru === 'in') { ch.uru.classList.remove('away'); ch.uru.classList.add('on'); ch.tanu.classList.remove('solo'); }
    if (L.t) { face.tanu = L.t; setFace('tanu', L.t); }
    if (L.u) { face.uru = L.u; setFace('uru', L.u); }
    for (const w of ['tanu', 'uru']) ch[w].classList.toggle('talk', L.who === w);
    if (L.anim) anim(L.who, L.anim);
    nameEl.textContent = L.label || NAMES[L.who];
    nameEl.classList.toggle('uru', L.who === 'uru');
    more.style.color = L.who === 'uru' ? 'var(--uru-d)' : '';
    $('#step').textContent = (k + 1) + ' / ' + LINES.length;
    type(withName(L.text));
  }
  function next() {
    if (typing) { clearInterval(typing); typing = null; textEl.textContent = full; more.classList.add('on'); return; }
    if (i >= LINES.length - 1) { btns.hidden = false; more.classList.remove('on'); return; }
    show(++i);
  }
  function reset() {
    i = -1; btns.hidden = true;
    ch.uru.classList.add('away'); ch.uru.classList.remove('on'); ch.tanu.classList.add('solo');
    setFace('tanu', 'normal', true); setFace('uru', 'normal', true);
    next();
  }
  function nmLabel() { $('#nm').textContent = '名前：' + (useName ? NAME : 'なし'); }

  $('#game').addEventListener('click', (e) => {
    if (e.target.closest('button')) return;
    if (dragged) { dragged = false; return; }   // スワイプしたあとは、セリフを進めない
    if (bumpEl.classList.contains('on')) { const q = toImg(e); if (inBelly(q)) { poke(q); kick(1.8); wave(q, 1); } }   // おなかをタップすると、そこから「ぷるん」＋波紋
    next();
  });
  $('#again').addEventListener('click', reset);
  $('#nm').addEventListener('click', () => { useName = !useName; nmLabel(); if (i >= 0) { clearInterval(typing); typing = null; i--; show(++i); } });
  /* ===== おなかのぷるん（第2章 matsuri と同じ「ばね」と網目の変形。ここでは強さ _x とくぼみ _pk だけ） ===== */
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const bumpEl = $('#bump'), cv = bumpEl.querySelector('canvas'), bimg = new Image();
  bimg.src = 'img/push_bump.webp'; bimg.onload = () => drawBump();
  const E = (() => { const [cx, cy, rx, ry] = bumpEl.dataset.belly.split(',').map(Number); return { cx, cy, rx, ry }; })();
  const SPRING = 420, DAMP = 4.5, N = 30, POS = [.5, .3];   // POS＝絵のどこを画面に合わせるか（object-position と同じ）
  const B = { x: 0, v: 0, pk: 0, pkv: 0, pcx: E.cx, pcy: E.cy, px: 0, py: 0, pvx: 0, pvy: 0, drag: false, run: false };
  let ripples = [];   // 波紋：{ x, y, t0, a }（絵の中の px・始まった時刻・強さ）
  const PULL = E.rx * .28, WAVE_L = 110, WAVE_V = 520, WAVE_A = 16;   // 引っぱれる長さ・波の長さ・波の速さ（px/秒）・波の高さ
  function fitB() {
    const r = bumpEl.getBoundingClientRect(), W = r.width, H = r.height, iw = bimg.naturalWidth, ih = bimg.naturalHeight;
    const s = Math.max(W / iw, H / ih);
    return { W, H, s, ox: (W - iw * s) * POS[0], oy: (H - ih * s) * POS[1], r };
  }
  function toImg(e) { const f = fitB(); return { x: (e.clientX - f.r.left - f.ox) / f.s, y: (e.clientY - f.r.top - f.oy) / f.s }; }
  const inBelly = (q) => ((q.x - E.cx) / E.rx) ** 2 + ((q.y - E.cy) / E.ry) ** 2 < 1;
  function warp(x, y) {
    const nx = (x - E.cx) / E.rx, ny = (y - E.cy) / E.ry, d = nx * nx + ny * ny;
    let dx = 0, dy = 0;
    if (d < 1) { const w = (1 - d) * (1 - d), sc = Math.max(-.5, Math.min(.5, B.x)); dx += (x - E.cx) * sc * w + B.px * w; dy -= (y - E.cy) * sc * w * .6 - B.py * w;
      // 波紋：さわった所から輪が広がって、だんだん消える（おなかのふちでは 0）
      const now = performance.now() / 1000;
      for (const r of ripples) {
        const t = now - r.t0, ux = x - r.x, uy = y - r.y, dist = Math.hypot(ux, uy) || 1, front = dist - WAVE_V * t;
        const env = Math.exp(-((front / (WAVE_L * 1.2)) ** 2)) * Math.exp(-t * 1.6) * r.a;
        const m = WAVE_A * env * Math.sin(front / WAVE_L * Math.PI * 2) * Math.sqrt(w);
        dx += ux / dist * m; dy += uy / dist * m;
      }
    }   // 横に広がると縦に縮む（ぷるんらしく）
    if (B.pk) { const u = (x - B.pcx) / (E.rx * .5), v = (y - B.pcy) / (E.ry * .5), r2 = u * u + v * v;
      if (r2 < 1) { const f = (1 - r2) * (1 - r2), pk = Math.max(-.5, Math.min(.3, B.pk)); dx += (x - B.pcx) * pk * f; dy += (y - B.pcy) * pk * f; } }
    return [x + dx, y + dy];
  }
  function tri(ctx, s0, s1, s2, d0, d1, d2) {
    ctx.save(); ctx.beginPath();
    const cx = (d0[0] + d1[0] + d2[0]) / 3, cy = (d0[1] + d1[1] + d2[1]) / 3, g = (q) => [q[0] + (q[0] - cx) * .02 + Math.sign(q[0] - cx) * .4, q[1] + (q[1] - cy) * .02 + Math.sign(q[1] - cy) * .4];
    const a = g(d0), b = g(d1), c = g(d2);
    ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c[0], c[1]); ctx.closePath(); ctx.clip();
    const [x0, y0] = s0, [x1, y1] = s1, [x2, y2] = s2, den = x0 * (y1 - y2) + x1 * (y2 - y0) + x2 * (y0 - y1);
    const m11 = (d0[0] * (y1 - y2) + d1[0] * (y2 - y0) + d2[0] * (y0 - y1)) / den, m12 = (d0[1] * (y1 - y2) + d1[1] * (y2 - y0) + d2[1] * (y0 - y1)) / den;
    const m21 = (d0[0] * (x2 - x1) + d1[0] * (x0 - x2) + d2[0] * (x1 - x0)) / den, m22 = (d0[1] * (x2 - x1) + d1[1] * (x0 - x2) + d2[1] * (x1 - x0)) / den;
    const tx = (d0[0] * (x1 * y2 - x2 * y1) + d1[0] * (x2 * y0 - x0 * y2) + d2[0] * (x0 * y1 - x1 * y0)) / den;
    const ty = (d0[1] * (x1 * y2 - x2 * y1) + d1[1] * (x2 * y0 - x0 * y2) + d2[1] * (x0 * y1 - x1 * y0)) / den;
    ctx.transform(m11, m12, m21, m22, tx, ty); ctx.drawImage(bimg, 0, 0); ctx.restore();
  }
  function drawBump() {
    if (!bimg.naturalWidth) return;
    const f = fitB(), dpr = Math.min(devicePixelRatio || 1, 2);
    if (!f.W) return;
    if (cv.width !== Math.round(f.W * dpr) || cv.height !== Math.round(f.H * dpr)) { cv.width = Math.round(f.W * dpr); cv.height = Math.round(f.H * dpr); }
    const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, f.W, f.H);
    ctx.save(); ctx.translate(f.ox, f.oy); ctx.scale(f.s, f.s); ctx.drawImage(bimg, 0, 0);
    if (Math.abs(B.x) > .0015 || Math.abs(B.pk) > .0015 || Math.abs(B.px) > .3 || Math.abs(B.py) > .3 || ripples.length) {
      const x0 = E.cx - E.rx, y0 = E.cy - E.ry, sw = E.rx * 2 / N, sh = E.ry * 2 / N;
      for (let r = 0; r < N; r++) for (let q = 0; q < N; q++) {
        const A = [x0 + q * sw, y0 + r * sh], Bq = [A[0] + sw, A[1]], C = [A[0], A[1] + sh], D = [A[0] + sw, A[1] + sh];
        const a = warp(...A), b = warp(...Bq), c = warp(...C), d = warp(...D);
        tri(ctx, A, Bq, C, a, b, c); tri(ctx, Bq, D, C, b, d, c);
      }
    }
    ctx.restore();
  }
  function kick(k) { if (reduce) k *= .4; B.v -= 2.2 * k; spring(); }
  function wave(q, a) { if (reduce) a *= .4; ripples.push({ x: q.x, y: q.y, t0: performance.now() / 1000, a }); spring(); }          // ぶつかった：へこんでから「ぽよん」と戻る
  function poke(q) { B.pcx = q.x; B.pcy = q.y; B.pkv -= 4; spring(); }        // 指の所だけ、小さくくぼむ
  function spring() {
    if (B.run) return; B.run = true; let last = performance.now();
    (function step(now) {
      let dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now;
      for (; dt > 0; dt -= 1 / 240) { const h = Math.min(dt, 1 / 240);
        B.v += (-SPRING * B.x - DAMP * B.v) * h; B.x += B.v * h;
        B.pkv += (-SPRING * B.pk - DAMP * B.pkv) * h; B.pk += B.pkv * h;
        if (!B.drag) { B.pvx += (-SPRING * B.px - DAMP * B.pvx) * h; B.px += B.pvx * h; B.pvy += (-SPRING * B.py - DAMP * B.pvy) * h; B.py += B.pvy * h; } }
      const nowS = performance.now() / 1000; ripples = ripples.filter((r) => nowS - r.t0 < 2.2);
      drawBump();
      if (!B.drag && !ripples.length && Math.abs(B.px) < .3 && Math.abs(B.py) < .3 && Math.abs(B.pvx) < 8 && Math.abs(B.pvy) < 8 && Math.abs(B.x) < .001 && Math.abs(B.v) < .02 && Math.abs(B.pk) < .001 && Math.abs(B.pkv) < .02) { B.x = B.v = B.pk = B.pkv = B.px = B.py = B.pvx = B.pvy = 0; B.run = false; drawBump(); return; }
      requestAnimationFrame(step);
    })(last);
  }
  /* スワイプ：おなかを指で引っぱる → はなすと「ぼよよん」と戻って、波紋が広がる */
  let dragged = false, d0 = null;
  bumpEl.addEventListener('pointerdown', (e) => {
    dragged = false;
    if (!bumpEl.classList.contains('on')) return;
    const q = toImg(e); if (!inBelly(q)) return;
    d0 = { q, cx: e.clientX, cy: e.clientY, s: fitB().s }; B.pcx = q.x; B.pcy = q.y;
  });
  addEventListener('pointermove', (e) => {
    if (!d0) return;
    const mx = e.clientX - d0.cx, my = e.clientY - d0.cy;
    if (!B.drag && Math.hypot(mx, my) < 10) return;
    B.drag = true; dragged = true;
    const k = (v) => PULL * Math.tanh(v / d0.s / PULL);   // 引っぱるほど重くなる（最大 PULL）
    B.px = k(mx); B.py = k(my); B.pvx = B.pvy = 0; spring();
  });
  addEventListener('pointerup', (e) => {
    if (!d0) return;
    if (B.drag) { B.drag = false; const pull = Math.hypot(B.px, B.py) / PULL; wave({ x: d0.q.x + B.px, y: d0.q.y + B.py }, .6 + pull); kick(.8 + pull * 1.5); spring(); }
    d0 = null;
  });
  addEventListener('pointercancel', () => { if (d0) { B.drag = false; d0 = null; spring(); } });

  function popWord() { const p = $('#pop'); p.classList.remove('go'); void p.offsetWidth; p.classList.add('go'); }
  addEventListener('resize', drawBump);

  // 絵を先に読みこんでおく
  ['tanu_normal', 'tanu_happy', 'tanu_shy', 'tanu_dere', 'uru_normal', 'uru_laugh', 'uru_surprise'].forEach((n) => { new Image().src = 'img/' + n + '.webp'; });
  ch.tanu.classList.add('on');
  nmLabel(); reset();
})();
