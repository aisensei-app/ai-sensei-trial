<meta charset="utf-8">
<title>タヌくんとウルくん</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  タヌくん：第3章（ラリーの物語）のお試し版（2026-11-06〜07）
  ・話は3つ（右上の「話」で切りかえ・URL の ?part=0〜2 でも）
      0 序章：ウルくんとの出会い → 背中を押されて、おなかのアップで「ぽよん」
      1 特訓（3日目）：転んで砂まみれ → {name}が指でなぞると砂が落ちる（砂あり・砂なしの2枚を重ねて、なぞった所だけ消す）
      2 前夜（6日目）：ふたりきりの夜。「もたれかかっても、いい…？」→ 二択 → 絵が寄って暗くなる（もたれた＝余白）
  ・絵：img/bg_court.webp・tanu_*（本編の立ち絵を左右反転）・uru_*・intro_*・push_bump・sand_sandy／sand_clean・night_ask／night_relief
  ・おなかの「ぷるん」は第2章（matsuri）と同じ「ばね」と網目の変形（Jig）。点滅はしない（ちかちか対策）
  ・セリフは仮。本編にはまだつないでいない
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&display=swap&text=%E3%81%BD%E3%82%88%E3%82%93%EF%BC%81%E3%81%9A%E3%81%95%E3%83%BC%E3%81%A3">
<style>
:root{
  --ink:#4A2C1A; --orange:#F08A3C; --orange-d:#C8641E; --uru:#5B7FA6; --uru-d:#3E5F84;
  --display:-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;
  color-scheme:light;
}
/* 場面の絵の色なので、ダークモードでも同じ色のまま */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#4A2C1A}}
:root[data-theme="dark"]{--ink:#4A2C1A}
html,body{height:100%}
body{margin:0;background:#2a1a10;color:var(--ink);font-family:var(--display);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;display:flex;flex-direction:column;cursor:pointer;touch-action:manipulation;
  max-width:520px;margin:0 auto}
#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#87c6ef}
#stage.dark{background:#0b1024}
#stage.quake{animation:quake .35s ease-out}
@keyframes quake{0%,100%{translate:0 0}25%{translate:0 4px}50%{translate:0 -3px}75%{translate:0 2px}}
/* 背景（横長の絵を、ネットが見える所で切り取る） */
#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:62% 50%;transition:opacity .6s}
#stage.dark #bg{opacity:0}
/* 立ち絵 */
.chara{position:absolute;bottom:-16%;height:94%;transform:translateX(-50%) translateY(0) scale(.96);transform-origin:50% 100%;
  filter:brightness(.8) saturate(.9);transition:filter .35s,transform .35s,opacity .5s,left .6s cubic-bezier(.3,.1,.25,1);
  opacity:0;pointer-events:none}
.chara img{position:absolute;inset:0;height:100%;width:auto;display:block}
.chara img+img{opacity:0}           /* 表情は2枚を重ねて、ふわっと切りかえる */
#tanu{left:33%;aspect-ratio:627/900;z-index:1}
#tanu img{transform:scaleX(-1)}   /* 左右反転して、ウルくんと向き合う */
#uru{left:73%;aspect-ratio:491/850;height:calc(94% * 850 / 900);z-index:1}
#uru.away{left:120%}
#tanu.solo{left:50%}            /* ウルくんが来る前は、タヌくんがまんなか */
.chara.on{opacity:1}
.chara.talk{filter:none;transform:translateX(-50%) scale(1)}
#tanu.talk,#uru.talk{z-index:3}   /* 話している方を手前に（id の z-index より強く） */
.chara.hop{animation:hop .5s ease-out}
.chara.shake{animation:shake .5s ease-in-out}
@keyframes hop{0%,100%{translate:0 0}35%{translate:0 -6%}60%{translate:0 0}80%{translate:0 -1.5%}}
@keyframes shake{0%,100%{translate:0 0}20%{translate:-2% 0}40%{translate:2% 0}60%{translate:-1.5% 0}80%{translate:1% 0}}
/* 1枚絵（スチル） */
.still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 25%;opacity:0;transition:opacity .8s;z-index:3}
.still.on{opacity:1}
/* おなかが揺れる1枚絵（canvas に描き直す）：押されて飛びこむ・砂はらい */
.jig{position:absolute;inset:0;z-index:6;opacity:0;transition:opacity .35s;pointer-events:none}
.jig.on{opacity:1;pointer-events:auto;touch-action:none}
.jig canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#bump.beat{animation:beat 2.7s ease-in-out}
@keyframes beat{0%,100%{transform:scale(1)}8%{transform:scale(1.025)}16%{transform:scale(1)}24%{transform:scale(1.018)}33%{transform:scale(1)}
  41%{transform:scale(1.025)}49%{transform:scale(1)}57%{transform:scale(1.018)}66%{transform:scale(1)}}
#tanu.lunge{left:50%;transform:translateX(-50%) scale(1.9);transform-origin:50% 45%;filter:none;z-index:3;
  transition:left .45s ease-in,transform .45s cubic-bezier(.5,0,.9,.6)}
#tanu.dive{filter:none;z-index:3;animation:dive .75s cubic-bezier(.4,0,.8,.6) forwards}
@keyframes dive{0%{transform:translateX(-50%) scale(1)}
  35%{transform:translateX(-35%) translateY(-22%) rotate(-6deg) scale(1)}
  100%{transform:translateX(40%) translateY(75%) rotate(48deg) scale(1.1);opacity:1}}
/* 砂けむり（画面の下からふわっと広がって消える） */
.puff{position:absolute;z-index:4;left:50%;bottom:-6%;width:120%;height:46%;transform:translateX(-50%) scale(.3);opacity:0;pointer-events:none;
  background:radial-gradient(closest-side,rgba(240,214,170,.95),rgba(236,205,155,.75) 45%,rgba(230,200,150,0) 100%);filter:blur(4px)}
.puff.go{animation:puff 1.1s ease-out forwards}
@keyframes puff{0%{opacity:0;transform:translateX(-50%) scale(.3)}25%{opacity:1}100%{opacity:0;transform:translateX(-50%) scale(1.5) translateY(-12%)}}
#uru.pushed{left:60%;z-index:1;transition:left .3s ease-out}   /* ウルくんはタヌくんのうしろへ回って押す */
#tanu.front{z-index:4;filter:none}
/* 夜（前夜）：絵を包む2重の箱。外＝もたれる動き（寄る・傾く・暗く）、内＝ゆっくりした鼓動 */
#night{position:absolute;inset:0;z-index:5;opacity:0;transition:opacity 1s;overflow:hidden;background:#0b1024}
#night.on{opacity:1}
#night .lean{position:absolute;inset:0;transition:transform 1.8s cubic-bezier(.35,.05,.25,1),filter 1.8s ease}
#night.leaning .lean{transform:translateX(20%) translateY(5%) rotate(-7deg) scale(1.2);filter:brightness(.32) blur(2.5px)}
#night .beat{position:absolute;inset:0}
#night.leaning .beat{animation:slowbeat 1.5s ease-in-out infinite}
@keyframes slowbeat{0%,100%{transform:scale(1)}12%{transform:scale(1.012)}24%{transform:scale(1)}36%{transform:scale(1.008)}48%{transform:scale(1)}}
#night img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;transition:opacity .9s}
#night img.off{opacity:0}
.pop{position:absolute;z-index:8;left:50%;top:50%;transform:translate(-50%,-50%);font-family:"Mochiy Pop One",var(--display);
  font-size:clamp(30px,9vw,40px);color:#fff;-webkit-text-stroke:6px var(--orange-d);paint-order:stroke fill;
  text-shadow:0 3px 0 #9E4A12;pointer-events:none;opacity:0;white-space:nowrap}
.pop.go{animation:pop 1s ease-out}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}35%{transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}
/* 操作ガイド（押せない・ふわっと出て消える） */
.hint{position:absolute;z-index:8;left:50%;bottom:64px;transform:translateX(-50%);background:rgba(255,255,255,.9);color:var(--orange-d);
  font-size:14px;font-weight:800;padding:7px 14px;border-radius:99px;box-shadow:0 2px 8px rgba(0,0,0,.25);white-space:nowrap;
  opacity:0;transition:opacity .5s;pointer-events:none}
.hint.on{opacity:1}
/* 砂のはらい具合 */
.meter{position:absolute;z-index:8;left:50%;bottom:50px;transform:translateX(-50%);width:120px;height:8px;border-radius:99px;
  background:rgba(255,255,255,.55);overflow:hidden;opacity:0;transition:opacity .5s;pointer-events:none}
.meter.on{opacity:1}
.meter i{display:block;height:100%;width:0;background:var(--orange);border-radius:99px;transition:width .2s}
#stage::after{content:"";position:absolute;left:0;right:0;bottom:0;height:40px;z-index:7;
  background:linear-gradient(transparent,#2a1a10);pointer-events:none}
/* セリフの枠 */
#talk{position:relative;flex:none;padding:22px 16px calc(env(safe-area-inset-bottom,0px) + 14px)}
.box{position:relative;min-height:5.2em;padding:18px 20px 22px;border-radius:22px;background:#fff;
  box-shadow:0 4px 14px rgba(0,0,0,.25);font-size:clamp(17px,4.8vw,22px);font-weight:700;line-height:1.55;white-space:pre-line}
.name{position:absolute;left:18px;top:-14px;background:var(--orange);color:#fff;font-size:14px;font-weight:800;
  padding:4px 14px;border-radius:99px;box-shadow:0 2px 0 var(--orange-d);transition:background .2s,box-shadow .2s}
.name.uru{left:auto;right:18px;background:var(--uru);box-shadow:0 2px 0 var(--uru-d)}   /* ウルくんは右に・青 */
.more{position:absolute;right:16px;bottom:8px;color:var(--orange-d);font-size:14px;opacity:0}
.more.on{opacity:1;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(3px)}}
.btns{position:absolute;left:0;right:0;bottom:100%;z-index:5;display:flex;justify-content:center;gap:12px;margin-bottom:6px}
.btns[hidden]{display:none}
.btn{border:0;border-radius:99px;font:inherit;font-weight:800;font-size:17px;padding:12px 30px;cursor:pointer;
  background:var(--orange);color:#fff;box-shadow:0 4px 0 var(--orange-d)}
/* 二択：白い丸・ぷっくり（第2章と同じ） */
.btn.alt{background:#fff;color:var(--orange-d);padding:13px 24px;border:2px solid #FFD2A6;
  box-shadow:0 5px 0 #E3B98F,0 10px 18px rgba(0,0,0,.30);animation:btnIn .45s ease-out backwards}
.btn.alt:nth-child(2){animation-delay:.15s}
@keyframes btnIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
/* 道具ボタン */
.tool{position:absolute;top:12px;z-index:9;border:0;border-radius:99px;background:rgba(255,255,255,.72);color:var(--ink);
  font:inherit;font-size:13px;font-weight:800;padding:7px 12px;cursor:pointer}
#nm{right:16px}
#part{right:132px}
#step{left:16px;cursor:default}
@media (prefers-reduced-motion:reduce){#bump.beat,#night.leaning .beat,#stage.quake,.chara.hop,.chara.shake{animation:none}
  #tanu.lunge{transition:none}.puff.go{animation-duration:.4s}.more.on{animation:none}}
</style>

<div id="game">
  <div id="stage">
    <img id="bg" src="img/bg_court.webp" alt="">
    <div class="chara" id="tanu"><img alt=""><img alt=""></div>
    <div class="chara away" id="uru"><img alt=""><img alt=""></div>
    <img class="still" data-k="invite" src="img/intro_invite.webp" alt="">
    <div class="jig" id="bump"><canvas></canvas></div>
    <div class="jig" id="sand"><canvas></canvas></div>
    <div id="night"><div class="lean"><div class="beat">
      <img data-k="ask" src="img/night_ask.webp" alt="">
      <img data-k="relief" class="off" src="img/night_relief.webp" alt="">
    </div></div></div>
    <div class="puff" id="puff"></div>
    <div class="pop" id="pop"></div>
    <div class="hint" id="hint"></div>
    <div class="meter" id="meter"><i></i></div>
    <span class="tool" id="step"></span>
    <button class="tool" id="part" type="button"></button>
    <button class="tool" id="nm" type="button"></button>
  </div>
  <div id="talk">
    <div class="btns" hidden></div>
    <div class="box"><span class="name"></span><span id="text"></span><span class="more">▼</span></div>
  </div>
</div>

<script>
(() => {
  /* ===== セリフ（仮） =====
     who＝話す人（tanu／uru）・t／u＝表情・still＝1枚絵（invite／sand）・uru:'in'＝ウルくん登場・anim＝hop／shake・label＝名前の札
     fx：push（ウルくんが押す）・bump（飛びこむ→おなかアップ）・dive（ボールに飛びつく→砂まみれ）
     jig：'bump'／'sand'＝おなかが揺れる1枚絵を出す・interact:'sand'＝砂をはらい終わるまで進まない
     night：'ask'／'relief'＝夜の絵・lean＝もたれている間（絵が寄って暗く）・choice＝二択（どちらでも先は同じ。alt＝選んだ側で変わる次の行） */
  const PARTS = [
    { title: '序章', start: 'solo', lines: [
      { still: 'invite', who: 'tanu', text: '{name}！ 見て見て！\n浜で、ビーチバレーの大会があるんだって！' },
      { still: 'invite', who: 'tanu', text: 'ふたり一組で出るんだ。\n…{name}、ぼくといっしょに、出てくれない？' },
      { who: 'tanu', t: 'happy', anim: 'hop', text: 'やったぁ！\nあのね、優勝すると、すっごくきれいな貝のネックレスがもらえるんだよ♪' },
      { who: 'tanu', t: 'shy', text: 'ぼく、どうしても、それがほしくて…\nえへへ、なんでかは、ないしょ！' },
      { who: 'tanu', t: 'normal', text: 'それでね、練習相手を呼んであるんだ！' },
      { who: 'uru', uru: 'in', u: 'laugh', label: '？？？', text: 'おーい、タヌくーん！' },
      { who: 'tanu', t: 'happy', anim: 'hop', text: 'ウルくん！ こっちこっち♪' },
      { who: 'uru', u: 'normal', text: 'きみが{name}だね！\nはじめまして、ウルだよ。よろしくね♪' },
      { who: 'tanu', t: 'normal', text: 'ウルくんはね、となりの島に住んでる、ぼくの幼なじみなんだ。\nバレー、すっごく上手なんだよ！' },
      { who: 'uru', u: 'laugh', text: 'タヌくんが大会に出るなんて、びっくりしたよ。\n昔は「ぼくなんて無理だよ〜」って、いつも見てるだけだったのに。' },
      { who: 'tanu', t: 'shy', anim: 'shake', text: 'ウ、ウルくん…！ それ、言わないでって…' },
      { who: 'uru', u: 'surprise', anim: 'hop', text: 'あれっ、ないしょだった？ ごめんごめん！' },
      { who: 'uru', u: 'normal', text: 'でもさ、タヌくん。{name}に言いたいこと、あるんでしょ？' },
      { who: 'uru', u: 'laugh', fx: 'push', text: 'ほらっ、いってらっしゃい！' },
      { jig: 'bump', fx: 'bump', who: 'tanu', text: 'わわっ…！' },
      { jig: 'bump', who: 'tanu', text: 'ご、ごめん、{name}…！\nぶつかっちゃった…' },
      { jig: 'bump', who: 'tanu', text: '……でも、{name}、あったかいね。' },
      { jig: 'bump', who: 'tanu', text: '…あのね。\n{name}がいっしょだから、ぼく、がんばれる気がするんだ。' },
      { who: 'uru', u: 'laugh', anim: 'hop', text: 'よーし！ じゃあ、さっそく特訓だ！' },
      { who: 'tanu', t: 'happy', text: '{name}、大会まで、いっしょにがんばろうね♪' }
    ] },
    { title: '特訓', start: 'duo', lines: [
      { who: 'uru', u: 'laugh', text: 'よーし！ 今日は、大会に向けて特訓だよ！' },
      { who: 'tanu', t: 'happy', anim: 'hop', text: '{name}も見ててね！ ぼく、がんばるから♪' },
      { who: 'uru', u: 'normal', text: 'いくよ、タヌくん！ それっ！' },
      { who: 'tanu', t: 'happy', u: 'surprise', fx: 'dive', auto: 1500, text: 'とりゃ〜っ！' },
      { jig: 'sand', who: 'uru', text: 'あはは！ タヌくん、砂まみれだ〜！' },
      { jig: 'sand', who: 'tanu', text: 'えへへ…ころんじゃった。\nでも今の、ボールにさわれたよ！' },
      { jig: 'sand', who: 'uru', text: 'ぼくはタオル持ってるから、\n{name}は、お腹の砂をはらってあげて！' },
      { jig: 'sand', who: 'tanu', interact: 'sand', text: 'えっ、{name}が…？\n…じゃあ、お願い、しようかな…' },
      { jig: 'sand', who: 'tanu', text: '…えへへ。\n{name}にはらってもらうの、なんだか、うれしいな。' },
      { jig: 'sand', who: 'uru', text: 'ピカピカだね！ はい、タオル♪\n…タヌくん、ほんとに変わったね。' },
      { jig: 'sand', who: 'tanu', text: '大会まで、あと少し。\n…{name}、また練習、見に来てくれる？' }
    ] },
    { title: '前夜', start: 'night', lines: [
      { night: 'ask', who: 'tanu', text: '{name}、来てくれたんだ。\n…えへへ、なんだか、眠れなくて。' },
      { night: 'ask', who: 'tanu', text: '明日、いよいよ大会だね。\n…ぼく、ほんとは、ちょっとこわいんだ。' },
      { night: 'ask', who: 'tanu', text: 'ぼくね、ずっと、何かに挑戦する勇気がなかったんだ。\n失敗したらどうしようって、いつも見てるだけで。' },
      { night: 'ask', who: 'tanu', text: 'でも、{name}と会ってから…\nなんだか、一歩ふみ出してみたくなったんだ。' },
      { night: 'ask', who: 'tanu', choice: ['いいよ', 'もちろん'], text: 'あのね、{name}…\nちょっとだけ、もたれかかっても、いい…？' },
      { night: 'ask', who: 'tanu', alt: ['…ほんと？\nえへへ…じゃあ、ちょっとだけ…', '…もちろん、って。\nえへへ…じゃあ、ちょっとだけ…'] },
      { night: 'ask', lean: true, who: 'tanu', text: '……あったかい。' },
      { night: 'ask', lean: true, who: 'tanu', text: 'ねえ、{name}。\nひとつ、ひみつを言ってもいい？' },
      { night: 'ask', lean: true, who: 'tanu', text: '優勝したら、あの貝のネックレス…\n{name}に、プレゼントしたかったんだ。' },
      { night: 'ask', lean: true, who: 'tanu', text: 'いつも会いに来てくれる、\nお礼に。' },
      { night: 'relief', who: 'tanu', text: 'えへへ…言っちゃった。\nなんだか、すっきりして、元気が出てきた！' },
      { night: 'relief', who: 'tanu', text: '明日、いっしょにがんばろうね、{name}。\nおやすみ♪' }
    ] }
  ];
  const NAMES = { tanu: 'タヌくん', uru: 'ウルくん' };
  const NAME = 'コンちゃん';

  const $ = (s) => document.querySelector(s);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const stage = $('#stage'), ch = { tanu: $('#tanu'), uru: $('#uru') };
  const textEl = $('#text'), nameEl = $('.name'), more = $('.more'), btns = $('.btns');
  let autoT = 0;
  let part = Math.max(0, Math.min(2, +(new URLSearchParams(location.search).get('part') || 0)));
  let LINES = PARTS[part].lines, i = -1, typing = null, full = '', useName = true, picked = 0, waitChoice = false, waitSand = false;

  // 名前：なしの人は、文頭の「{name}、」は消し、文の途中は「きみ」（本編の withName と同じ）
  function withName(s) {
    if (useName) return s.split('{name}').join(NAME);
    return s.replace(/^\{name\}[、！]\s*/, '').split('{name}').join('きみ');
  }
  // 表情：2枚の img を交互に使って、ふわっと切りかえる
  function setFace(who, f, instant) {
    const imgs = ch[who].querySelectorAll('img');
    const src = 'img/' + who + '_' + f + '.webp';
    const cur = imgs[0].style.opacity === '0' ? imgs[1] : imgs[0];
    if (cur.getAttribute('src') === src) return;
    const nxt = cur === imgs[0] ? imgs[1] : imgs[0];
    if (instant) { cur.src = src; cur.style.opacity = 1; nxt.style.opacity = 0; return; }
    nxt.style.transition = cur.style.transition = 'opacity .25s';
    nxt.onload = () => { nxt.style.opacity = 1; cur.style.opacity = 0; };
    nxt.src = src;
    if (nxt.complete) nxt.onload();
  }
  function anim(who, a) { const el = ch[who]; el.classList.remove('hop', 'shake'); void el.offsetWidth; el.classList.add(a); }
  function type(s) {
    clearInterval(typing); full = s; textEl.textContent = ''; more.classList.remove('on');
    let n = 0;
    typing = setInterval(() => {
      n++; textEl.textContent = full.slice(0, n);
      if (n >= full.length) { clearInterval(typing); typing = null; if (!waitChoice && !waitSand) more.classList.add('on'); }
    }, 38);
  }
  function popWord(w) { const p = $('#pop'); p.textContent = w; p.classList.remove('go'); void p.offsetWidth; p.classList.add('go'); }

  function hint(s, ms) { const h = $('#hint'); h.textContent = s; h.classList.add('on'); clearTimeout(hintT); if (ms) hintT = setTimeout(() => h.classList.remove('on'), ms); }

  }
  function next() {
    if (typing) { clearInterval(typing); typing = null; textEl.textContent = full; if (!waitChoice && !waitSand) more.classList.add('on'); return; }
    if (waitChoice || waitSand) return;   // 二択・砂はらいの間は進まない
    if (i >= LINES.length - 1) { endButtons(); return; }
    show(++i);
  }
  function endButtons() {
    more.classList.remove('on'); btns.innerHTML = ''; btns.hidden = false;
    const again = document.createElement('button'); again.className = 'btn'; again.type = 'button'; again.textContent = 'もう一度';
    again.addEventListener('click', () => reset(part)); btns.appendChild(again);
    if (part < PARTS.length - 1) { const nx = document.createElement('button'); nx.className = 'btn alt'; nx.type = 'button'; nx.textContent = '次の話 ▶';
      nx.addEventListener('click', () => reset(part + 1)); btns.appendChild(nx); }
  }
  function reset(p) {
    part = p; LINES = PARTS[p].lines; i = -1; picked = 0; waitChoice = waitSand = false;
    btns.innerHTML = ''; btns.hidden = true; hideHint(); $('#meter').classList.remove('on');
    const st = PARTS[p].start;
    stage.classList.toggle('dark', st === 'night');
    ch.tanu.className = 'chara'; ch.uru.className = 'chara away';
    bumpEl.classList.remove('on', 'beat'); sandEl.classList.remove('on'); $('#night').className = '';
    if (st === 'solo') { ch.tanu.classList.add('on', 'solo'); setFace('tanu', 'normal', true); setFace('uru', 'normal', true); }
    if (st === 'duo') { ch.tanu.classList.add('on'); ch.uru.classList.add('on'); ch.uru.classList.remove('away'); setFace('tanu', 'happy', true); setFace('uru', 'laugh', true); }
    if (sandW) resetSand();
    $('#part').textContent = '話：' + PARTS[p].title + ' ▸';
    next();
  }
  function nmLabel() { $('#nm').textContent = '名前：' + (useName ? NAME : 'なし'); }

  $('#game').addEventListener('click', (e) => {
    if (e.target.closest('button')) return;
    if (dragged) { dragged = false; return; }   // スワイプしたあとは、セリフを進めない
    if (bumpEl.classList.contains('on')) { const q = bump.toImg(e); if (bump.inBelly(q)) { bump.poke(q); bump.kick(1.8); bump.wave(q, 1); } }   // タップでも「ぷるん」＋波紋
    if (sandEl.classList.contains('on') && !waitSand) { const q = sand.toImg(e); if (sand.inBelly(q)) { sand.poke(q); sand.kick(1.4); sand.wave(q, .8); } }
    next();
  });
  $('#part').addEventListener('click', () => reset((part + 1) % PARTS.length));
  $('#nm').addEventListener('click', () => { useName = !useName; nmLabel(); if (i >= 0 && !waitSand) { clearInterval(typing); typing = null; show(i); } });

  // 絵を先に読みこんでおく
  ['tanu_normal', 'tanu_happy', 'tanu_shy', 'tanu_dere', 'uru_normal', 'uru_laugh', 'uru_surprise'].forEach((n) => { new Image().src = 'img/' + n + '.webp'; });
  nmLabel(); reset(part);
})();
</script>
