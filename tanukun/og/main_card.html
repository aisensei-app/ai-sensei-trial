<!doctype html>
<!-- 本編のリンクのカード（1200×630）の元。M PLUS Rounded 1c を ../fonts/ に置いて、ブラウザで 1200×630 にして画像にする（フォントはリポジトリに入れていない） -->
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: R; src: url(../fonts/MPLUSRounded1c-Black.ttf); font-weight: 900; }
@font-face { font-family: R; src: url(../fonts/MPLUSRounded1c-ExtraBold.ttf); font-weight: 800; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body { position: relative; font-family: R, sans-serif; }
.art { position: absolute; inset: 0; width: 1200px; height: 630px; object-fit: cover; }
.shade { position: absolute; left: 0; top: 0; bottom: 0; width: 640px;
  background: linear-gradient(90deg, rgba(60, 40, 20, .30), rgba(60, 40, 20, 0)); }
.box { position: absolute; left: 50px; top: 0; bottom: 0; width: 600px; display: flex; flex-direction: column; justify-content: center; }
.sub { align-self: flex-start; font-weight: 800; font-size: 26px; color: #fff; background: #6FA544;
  padding: 5px 22px 7px; border-radius: 999px; box-shadow: 0 4px 0 #4E7F2D; letter-spacing: 1px; }
h1 { white-space: nowrap; font-weight: 900; font-size: 124px; line-height: 1.05; margin-top: 10px; letter-spacing: 2px;
  color: #FFF8EA; -webkit-text-stroke: 13px #8A4A1C; paint-order: stroke fill;
  text-shadow: 0 9px 0 #5A2F10, 0 14px 24px rgba(0,0,0,.35); }
h1 span { color: #FFB25B; }
.copy { white-space: nowrap; margin-top: 16px; font-weight: 800; font-size: 44px; color: #fff; letter-spacing: 2px;
  -webkit-text-stroke: 9px #8A4A1C; paint-order: stroke fill; text-shadow: 0 4px 10px rgba(0,0,0,.3); }
/* タップの波紋 */
.ripple { position: absolute; border-radius: 50%; border: 6px solid rgba(255,255,255,.95);
  box-shadow: 0 0 0 5px rgba(240,138,60,.55); transform: translate(-50%, -50%); }
.r1 { left: 760px; top: 415px; width: 70px; height: 70px; }
.r2 { left: 760px; top: 415px; width: 130px; height: 130px; border-width: 4px; opacity: .55; box-shadow: none; }
.cursor { position: absolute; left: 732px; top: 405px; width: 150px; filter: drop-shadow(0 6px 6px rgba(0,0,0,.35)); }
.poyon { position: absolute; left: 830px; top: 330px; font-weight: 900; font-size: 46px; color: #fff;
  -webkit-text-stroke: 8px #C8641E; paint-order: stroke fill; transform: rotate(10deg); }
</style></head>
<body>
  <img class="art" src="main_art.webp">
  <div class="shade"></div>
  <div class="box">
    <div class="sub">さわって あそぶ なでなでアプリ</div>
    <h1>タヌ<span>くん</span></h1>
    <div class="copy">さわって、なかよく。</div>
  </div>
  <div class="ripple r2"></div><div class="ripple r1"></div>
  <!-- 指さしの手（オリジナル）：白い手袋、手のひらに小さな肉球 -->
  <svg class="cursor" viewBox="0 0 100 120">
    <g stroke="#5A2F10" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" fill="#FFFFFF">
      <!-- のばした人差し指（指先が左上の波紋の中心へ） -->
      <path d="M22 50 C 22 22, 22 10, 30 8 C 38 6, 40 14, 40 22 L 40 50"/>
      <!-- 手のひら（にぎった指） -->
      <path d="M22 48 C 14 50, 10 58, 12 70 C 14 90, 26 104, 48 106 C 70 108, 84 96, 86 78 L 88 58
               C 88 50, 80 48, 76 52 C 76 44, 68 42, 64 48 C 63 40, 54 39, 52 46 C 50 40, 42 40, 40 46"/>
      <!-- 指のさかいめ -->
      <path d="M52 46 L 52 62 M64 48 L 64 63 M76 52 L 76 65" fill="none"/>
      <!-- そで口 -->
      <path d="M36 104 L 34 116 L 80 116 L 80 100" fill="#FFF3DA"/>
    </g>
    <!-- 肉球 -->
    <g fill="#FFB2C0">
      <ellipse cx="56" cy="84" rx="11" ry="8"/>
      <circle cx="31" cy="15" r="4.5"/>
    </g>
  </svg>
  <div class="poyon">ぽよんっ</div>
</body></html>
