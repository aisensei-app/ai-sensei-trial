<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ぽんぽこリズム｜タヌくん</title>
<meta name="theme-color" content="#FFF4E0">
<link rel="icon" href="../images/icon-192.png">
<link rel="stylesheet" href="pon.css">
</head>
<body>
<main id="pon" class="mode-belly">

  <!-- 上のバー：中断（プレイ中）または本編へ・点数・コンボ。右上はタヌくんの顔のワイプ -->
  <header class="bar">
    <button id="btn-pause" class="pause" type="button" aria-label="中断" hidden>⏸</button>
    <a id="back-home" class="back" href="../" hidden>‹ タヌくん</a>
    <div class="score"><span id="score">0</span><small>てん</small></div>
    <div class="combo" id="combo"></div>
  </header>
  <!-- クリアまでのバー（左から右へのびる。右はしの 🏁 でクリア） -->
  <div class="progress" aria-hidden="true"><div id="progress-fill"></div><span>🏁</span></div>
  <div id="wipe" class="wipe" aria-hidden="true"><div id="wipe-face"></div></div>

  <!-- ◉ が右から左に流れてくる道。左のわくに重なったときにたたく -->
  <div id="lane" class="lane" aria-hidden="true">
    <div class="target"></div>
    <div id="notes"></div>
    <div id="judge" class="judge"></div>
  </div>
  <div id="bpm" class="bpm"></div>

  <!-- おなかのアップ。どこをたたいてもOK -->
  <div id="stage">
    <div id="body">
      <img id="tanu-img" alt="タヌくんのおなか" draggable="false">
      <!-- きせかえパーツ（デベソなど）。揺れている間は canvas の絵に入る -->
      <div id="parts-layer" aria-hidden="true"></div>
      <canvas id="belly-canvas" aria-hidden="true"></canvas>
    </div>
    <div id="moles" aria-hidden="true"></div>
    <div id="pops" aria-hidden="true"></div>
  </div>

  <!-- はじめる前 -->
  <section id="start" class="sheet">
    <h1>🥁 ぽんぽこリズム</h1>
    <p><b>◉</b> は タップで <b>ぽんっ</b>！<br>ピンクの <b class="purun-mark">〜</b> は 指で さっと すべらせて <b>ぷるん</b>！</p>
    <p class="small">リズムは「8ビート」。だんだん速くなるよ（約30秒）<br>🔊 音を出して遊んでね</p>
    <button id="btn-lane" class="btn btn-stage" type="button"><small>ステージ1</small>ながれる</button>
    <p class="mode-note">◉ が右から流れてくるよ。左のわくに来たら たたいてね</p>
    <button id="btn-belly" class="btn btn-stage" type="button"><small>ステージ2</small>おなか</button>
    <p class="mode-note">◉ がおなかの上に出てくるよ。まわりの輪が ◉ に重なったら たたいてね</p>
    <!-- きせかえ（本編と同じ記録。ここで変えると本編にも反映） -->
    <div id="wear" class="wear" hidden></div>
  </section>

  <!-- 中断 -->
  <section id="pause" class="sheet" hidden>
    <h2>ひとやすみ</h2>
    <button id="btn-resume" class="btn" type="button">つづける</button>
    <button id="btn-retry" class="btn btn-sub" type="button">さいしょから</button>
    <button id="btn-quit" class="btn btn-sub" type="button">ステージをえらぶ</button>
    <a id="pause-home" class="btn btn-sub" href="../">タヌくんのところへ もどる</a>
  </section>
  <!-- 再開する前の「3・2・1」 -->
  <div id="count" class="count" hidden></div>

  <!-- 結果 -->
  <section id="result" class="sheet" hidden>
    <h2 id="r-title"></h2>
    <div class="r-score"><b id="r-score">0</b> てん</div>
    <ul class="r-list">
      <li>ぴったり <b id="r-perfect">0</b></li>
      <li>いいね <b id="r-good">0</b></li>
      <li>おしい <b id="r-ok">0</b></li>
      <li>ミス <b id="r-miss">0</b></li>
      <li>さいだいコンボ <b id="r-combo">0</b></li>
    </ul>
    <p id="r-line" class="r-line"></p>
    <a id="btn-post" class="btn btn-x" target="_blank" rel="noopener">𝕏 でポストする</a>
    <button id="btn-next" class="btn" type="button" hidden>ステージ2 へ ▶</button>
    <button id="btn-again" class="btn btn-sub" type="button">もう一回</button>
    <button id="btn-mode" class="btn btn-sub" type="button">ステージをえらぶ</button>
  </section>

</main>
<!-- 本編と同じ設定（おなかの揺れ）と揺れの仕組みを使う -->
<script src="../config.js"></script>
<script src="../belly.js"></script>
<script src="pon.js"></script>
</body>
</html>
