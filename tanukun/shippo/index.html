<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&display=swap&text=%E2%99%AA%E3%81%81%E3%81%95%E3%81%9F%E3%81%A3%E3%81%AB%E3%81%B5%E3%81%B7%E3%81%BD%E3%82%80%E3%82%88%E3%82%8A%E3%82%8B%E3%82%93%E3%83%83%E3%83%9C%E3%83%AF%EF%BC%81">
<!--
  タヌくん：しっぽ ふさふさ（お試し版。2026-11-04）
  ・絵：img/back.webp（うしろ姿でふり返って笑う。しっぽなし）・img/tail.webp（しっぽ）・img/tail_puff.webp（ボワッとしたしっぽ）
        元は art/*_src.png（ユーザーが描いた。マゼンタ背景）→ tools/make_shippo_art.py。背景は本編の images/bg/beach_day.webp
  ・しっぽ：タップで「ふりふり」／指でなでると、しっぽが指についてきて「ふさふさ」（毛がふわっと舞う）／たくさんなでると「ボワッ！」（ふくらんで、ぶるぶる）
  ・揺れる所：おしり「ぷるん」・腰「むにっ」・ふともも「ぽよん」・二の腕「ぷにっ」（押すとくぼむ）（左右それぞれ。押した側が大きく、反対側も少し）
  ・しっぽの位置は「🦝 しっぽの位置」で調整できる（ドラッグ・よこ・たて・向き・大きさ・葉っぱの下から出す）。値はこのスマホに覚える
  ・表情3種類：ふつう／さわっている間は照れ笑い（img/back_shy.webp）／2秒に6回さわる・ボワッのときは大笑い（img/back_laugh.webp。ハートがぽわぽわ）
  ・15歳以上の線引き：しっぽが、おしりのまんなかを隠す位置。宣伝（X）には使わない
  ・本編にはまだつないでいない（build_app.py にも入れていない）
-->
<style>
/* 一枚の画面：浜辺にうしろ姿のタヌくん。上にふきだし、下にボタン */
:root{
  --sand:#EFD7AE; --ink:#4A2C1A; --cream:#FFF6E6; --accent:#D9536A;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  --pop:"Mochiy Pop One","Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--sand);color:var(--ink);font-family:var(--display);overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#fx{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.pop-word{position:absolute;transform:translate(-50%,-50%);font-family:var(--pop);font-size:clamp(28px,8.4vw,38px);font-weight:400;
  color:#fff;-webkit-text-stroke:7px #C8641E;paint-order:stroke fill;text-shadow:0 3px 0 #9E4A12,0 0 10px rgba(255,170,120,.6);
  white-space:nowrap;opacity:0;will-change:transform,opacity}
.pop-word.big{font-size:clamp(40px,12vw,54px);-webkit-text-stroke-color:#B5462A}
.top{position:fixed;top:0;left:0;right:0;z-index:2;pointer-events:none;display:flex;gap:10px;align-items:flex-start;
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bubble{min-width:0;background:var(--cream);border:2.5px solid var(--ink);border-radius:16px;
  padding:8px 12px;font-weight:700;font-size:15px;line-height:1.4;box-shadow:0 3px 0 var(--ink)}
.bubble.bump{animation:bump .45s ease-out}
@keyframes bump{30%{transform:scale(1.06) rotate(-2deg)}60%{transform:scale(.98)}}
.meter{margin-left:auto;flex:none;display:flex;align-items:center;gap:6px;background:var(--cream);border:2.5px solid var(--ink);border-radius:999px;
  padding:4px 10px;font-weight:900;font-size:13px;box-shadow:0 3px 0 var(--ink)}
.meter i{display:block;width:54px;height:8px;border-radius:99px;background:#E9D3B4;overflow:hidden}
.meter b{display:block;height:100%;width:0;background:linear-gradient(90deg,#F0A15A,#D9536A);border-radius:99px}
.tag{position:fixed;z-index:2;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 58px);
  font-size:11px;font-weight:900;letter-spacing:.08em;background:var(--accent);color:var(--cream);border-radius:6px;padding:2px 8px;pointer-events:none}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:2;display:flex;flex-direction:column;align-items:center;gap:10px;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hint{font-size:13px;font-weight:700;text-align:center;background:rgba(255,246,230,.88);border-radius:999px;padding:3px 12px}
button{font:inherit;font-weight:900;font-size:14px;color:var(--ink);background:var(--cream);border:2.5px solid var(--ink);border-radius:999px;
  padding:7px 16px;box-shadow:0 3px 0 var(--ink);cursor:pointer}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#loading{position:fixed;inset:0;display:grid;place-items:center;font-weight:900}

.adj{position:fixed;z-index:3;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));
  bottom:calc(env(safe-area-inset-bottom,0px) + 12px);background:var(--cream);border:2.5px solid var(--ink);border-radius:16px;
  box-shadow:0 3px 0 var(--ink);padding:10px 14px;display:flex;flex-direction:column;gap:6px;max-width:460px;margin:0 auto}
.adj[hidden]{display:none}
.adjt{margin:0;font-weight:900}.adjt small{font-weight:700;opacity:.7}
.adj label{display:grid;grid-template-columns:4em 1fr 3.2em;align-items:center;gap:8px;font-weight:700;font-size:13px}
.adj label.chk{display:flex;gap:6px}
.adj input[type=range]{width:100%;accent-color:#D9536A}
.adj output{font-variant-numeric:tabular-nums;text-align:right}
.adjv{margin:0;font-size:12px;font-family:ui-monospace,Menlo,monospace;background:#F3E6D0;border-radius:8px;padding:4px 8px;overflow-wrap:anywhere}
</style>

<canvas id="stage" aria-label="浜辺で、うしろ姿のタヌくんがふり返っている。しっぽとおしりをさわれる"></canvas>
<div id="loading">よみこみ中…</div>
<div id="fx" aria-hidden="true"></div>
<div class="top">
  <div class="bubble" id="bubble">しっぽ、さわってみる？</div>
  <div class="meter" aria-label="ふさふさゲージ"><span>ふさふさ</span><i><b id="meter"></b></i></div>
</div>

<div class="bottom">
  <div class="hint">しっぽをタップ・なでてね。おしりも…？</div>
  <div class="btns">
    <button id="adj" type="button">🦝 しっぽの位置</button>
    <button id="snd" type="button" aria-pressed="true">音 ON</button>
  </div>
</div>
<!-- しっぽの位置の調整（2026-11-04）：画面をドラッグで付け根が動く。決めた値は、このスマホに覚える -->
<div class="adj" id="adjPanel" hidden>
  <p class="adjt">しっぽの位置 <small>（画面をドラッグでも動きます）</small></p>
  <label>よこ <input id="aX" type="range" min="200" max="600" step="1"><output id="oX"></output></label>
  <label>たて <input id="aY" type="range" min="380" max="760" step="1"><output id="oY"></output></label>
  <label>向き <input id="aD" type="range" min="-30" max="120" step="1"><output id="oD"></output></label>
  <label>大きさ <input id="aS" type="range" min="0.35" max="0.9" step="0.01"><output id="oS"></output></label>
  <label class="chk"><input id="aB" type="checkbox"> 腰みのの葉っぱの下から出す</label>
  <p class="adjv" id="adjVal"></p>
  <div class="btns"><button id="aReset" type="button">はじめの位置</button><button id="aCopy" type="button">数字をコピー</button><button id="aOk" type="button">決定</button></div>
</div>

<script>
(() => {
'use strict';
const SRC = { bg: '../images/bg/beach_day.webp', body: 'img/back.webp', tail: 'img/tail.webp', puff: 'img/tail_puff.webp',
  shy: 'img/back_shy.webp', laugh: 'img/back_laugh.webp' };   // shy・laugh：同じ構図で顔だけちがう（照れ笑い・大笑い。2026-11-04 ユーザーが描いた）
const FACE_H = 270, FACE_FADE = 70;   // 表情の絵を重ねる高さ（顔の所だけ。うしろ姿の絵の座標）。下の 70px は、だんだん消す（境目が見えないように）
// 顔の所だけを切りとって、下のふちをぼかした絵にする
function faceLayer(im) {
  const c = document.createElement('canvas'); c.width = BW0; c.height = FACE_H;
  const x = c.getContext('2d'); x.drawImage(im, 0, 0, BW0, FACE_H, 0, 0, BW0, FACE_H);
  const g = x.createLinearGradient(0, FACE_H - FACE_FADE, 0, FACE_H); g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  x.globalCompositeOperation = 'destination-in'; x.fillStyle = g; x.fillRect(0, 0, BW0, FACE_H);
  return c;
}
const BW0 = 768, BH0 = 1152;        // うしろ姿の絵の大きさ
const TW0 = 768, TH0 = 512;         // しっぽの絵の大きさ（2枚とも）
const TROOT = { x: 200, y: 90 };    // しっぽの絵の中の付け根（毛のうずの所）
/* しっぽの付け方（2026-11-04：画面の「🦝 しっぽの位置」で動かして決められる。決めた値は、このスマホに覚える）
   x, y … 付け根（うしろ姿の絵の座標）、deg … 向き（0 で絵のまま。プラスで時計まわり）、scale … 大きさ、back … true なら腰みのの葉っぱの下から出す */
// 2026-11-04 ユーザーのリファレンス（設定画のうしろ姿）に合わせた：まんなかより右、腰みのの葉っぱの下から出て、右下へたれる。大きめ
// 2026-11-04 ユーザーの印（うしろ姿の絵に黄色いバツ）に合わせた：おしりの割れ目より右、ひものすぐ下の葉っぱに隠れる所から出る
const TP_DEFAULT = { x: 470, y: 600, deg: 18, scale: 0.82, back: true };
const TP_KEY = 'tanu-shippo-tail-v3';   // 前の位置を覚えていても、新しいはじめの位置から始まるように、名前を変えた
const TP = Object.assign({}, TP_DEFAULT);
try { Object.assign(TP, JSON.parse(localStorage.getItem(TP_KEY) || '{}')); } catch (e) {}
/* 揺れる所（2026-11-04：おなかと同じしくみ。うしろ姿の絵の座標のだ円。まんなかほど大きく動く）
   kick … タップしたときの勢い、pair … 同じ場所の反対側（少しだけいっしょに揺れる）、word・talk … 飛び出す文字とセリフ
   2026-11-04 ユーザーの印（黄色い丸）に合わせて置き直した：二の腕＝肩のすぐ下の腕の裏／腰＝ひものすぐ上のおしりの上のふくらみ（横長1つ。左右半分ずつ）
   ／おしり＝葉っぱのすぐ下の丸み／ふともも＝おしりのすぐ下の付け根 */
const REGIONS = [
  { id: 'buttL', kind: 'butt',  cx: 335, cy: 705, rx: 70, ry: 57, kick: 210, pair: 'buttR', word: 'ぷるん' },
  { id: 'buttR', kind: 'butt',  cx: 540, cy: 700, rx: 62, ry: 60, kick: 210, pair: 'buttL', word: 'ぷるん' },
  { id: 'waistL', kind: 'waist', cx: 368, cy: 536, rx: 95, ry: 40, kick: 170, pair: 'waistR', word: 'むにっ' },
  { id: 'waistR', kind: 'waist', cx: 528, cy: 536, rx: 95, ry: 40, kick: 170, pair: 'waistL', word: 'むにっ' },
  { id: 'thighL', kind: 'thigh', cx: 275, cy: 805, rx: 66, ry: 50, kick: 170, pair: 'thighR', word: 'ぽよん' },
  { id: 'thighR', kind: 'thigh', cx: 525, cy: 816, rx: 86, ry: 48, kick: 170, pair: 'thighL', word: 'ぽよん' },
  // 二の腕は「ぷにぷに」（poke）：押している間は指の所がくぼみ、なでるとくぼみがついてくる。はなすと「ぷるん」（肉球ぷにぷにと同じ考え）
  { id: 'armL', kind: 'arm',   cx: 238, cy: 381, rx: 72, ry: 62, kick: 190, word: 'ぷにっ', poke: true },
  { id: 'armR', kind: 'arm',   cx: 600, cy: 416, rx: 40, ry: 64, kick: 190, word: 'ぷにっ', poke: true }
].map((r) => Object.assign(r, { y: 0, v: 0, dent: 0, dentV: 0, px: r.cx, py: r.cy, press: null, t0: 0 }));
const REG = Object.fromEntries(REGIONS.map((r) => [r.id, r]));

const cv = document.getElementById('stage'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, S = 1, OX = 0, OY = 0;
let I = {}, bodyPx = null, tailPx = null;

function load(u) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = u; }); }
function pixels(im, w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.drawImage(im, 0, 0, w, h);
  return x.getImageData(0, 0, w, h).data;
}
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  S = Math.min(W / 690, (H - 150) / 1120);
  OX = W / 2 - 376 * S;
  OY = Math.max(60, H - 1140 * S - 78);
}
const toBody = (x, y) => [(x - OX) / S, (y - OY) / S];

/* ---------- 音（Web Audio でつくる）・ふるえ ---------- */
let ac = null, soundOn = true, noiseBuf = null;
function audio() {
  if (!soundOn) return null;
  if (!ac) {
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
// 毛の音（ふぁさっ）：やわらかいノイズ
function fasa(vol, dur) {
  const a = audio(); if (!a) return;
  const t = a.currentTime, n = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  n.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.setValueAtTime(2600, t); f.frequency.exponentialRampToValueAtTime(900, t + dur); f.Q.value = 0.8;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25 * vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  n.connect(f); f.connect(g); g.connect(a.destination); n.start(t); n.stop(t + dur + 0.05);
}
// ぷるん・ボワッ：丸い音
function boing(base, up, vol) {
  const a = audio(); if (!a) return;
  const t = a.currentTime, o = a.createOscillator(), g = a.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(base, t); o.frequency.exponentialRampToValueAtTime(base * up, t + 0.16);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.3 * vol, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.25);
}
function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

/* ---------- ふきだし ---------- */
const LINES = {
  tail:  ['ふりふり♪', 'しっぽ、ふわふわでしょ？', 'えへへ、しっぽ じまん♪'],
  rub:   ['ふさふさ…きもちいい〜', 'ブラッシングみたい♪', 'もっと なでて〜'],
  puff:  ['ひゃっ！？ しっぽが ボワッて なった！', 'び、びっくりした〜…！', 'もう〜！ 毛が さかだっちゃったよ'],
  butt:  ['ひゃっ、おしり〜！？', 'もう〜、どこ さわってるの〜', 'ぷるんって した…はずかしい…'],
  waist: ['こ、腰は くすぐったい〜', 'むにむに しないで〜', 'ちょっと つまめちゃう…？'],
  thigh: ['ふともも、むちむちでしょ？', 'ひゃっ、くすぐったい〜', 'いっぱい歩いて、きたえてるんだ〜'],
  arm:   ['二の腕、ぷにぷに…', 'ちからこぶ…ないけど〜', 'ぎゅってしたら、やわらかいよ〜', 'そんなに ぷにぷに しないで〜'],
  body:  ['せなか、ひろいでしょ？', 'しっぽは こっちだよ〜']
};
const bubble = document.getElementById('bubble');
let lastTalk = 0;
function say(kind, force) {
  const now = performance.now();
  if (!force && now - lastTalk < 1500) return;
  lastTalk = now;
  const list = LINES[kind];
  bubble.textContent = list[Math.floor(Math.random() * list.length)];
  bubble.classList.remove('bump'); void bubble.offsetWidth; bubble.classList.add('bump');
}

/* ---------- 飛び出す文字（ゆっくり ふわ〜っと出て消える） ---------- */
const fx = document.getElementById('fx');
function popWord(text, x, y, big) {
  const el = document.createElement('span');
  el.className = 'pop-word' + (big ? ' big' : '');
  el.textContent = text;
  el.style.left = x + 'px'; el.style.top = y + 'px';
  fx.appendChild(el);
  const dx = (Math.random() - 0.5) * 36, rot = (Math.random() - 0.5) * 12;
  el.animate([
    { transform: 'translate(-50%, -40%) scale(.82) rotate(' + rot + 'deg)', opacity: 0 },
    { transform: 'translate(-50%, -85%) scale(1.04) rotate(' + rot * 0.6 + 'deg)', opacity: 1, offset: 0.3 },
    { transform: 'translate(calc(-50% + ' + dx * 0.5 + 'px), -125%) scale(1) rotate(' + rot * 0.3 + 'deg)', opacity: 0.95, offset: 0.6 },
    { transform: 'translate(calc(-50% + ' + dx + 'px), -190%) scale(.98) rotate(0deg)', opacity: 0 }
  ], { duration: big ? 1900 : 1600, easing: 'cubic-bezier(.25,.6,.35,1)' }).finished.then(() => el.remove(), () => el.remove());
}

/* ---------- しっぽ ---------- */
const tail = { a: 0, va: 0, follow: null, puff: 0, pv: 0, puffUntil: 0, sq: 0, sqv: 0 };
let meter = 0;   // ふさふさゲージ（たまると ボワッ）
const meterEl = document.getElementById('meter');
function tailAngle() { return TP.deg * Math.PI / 180 + tail.a + (tail.puff > 0.05 ? Math.sin(performance.now() / 1000 * 42) * 0.035 * tail.puff : 0); }
function tailScale() { return TP.scale * (1 + 0.16 * tail.puff); }
function rootScreen() { return [OX + TP.x * S, OY + TP.y * S]; }
// 画面の点が、しっぽの絵の上か（絵の透明でない所）
function onTail(x, y) {
  if (!tailPx) return false;
  const [rx, ry] = rootScreen(), a = -tailAngle(), sc = tailScale() * S * (1 + 0.06 * tail.sq);
  const dx = x - rx, dy = y - ry;
  const lx = (dx * Math.cos(a) - dy * Math.sin(a)) / sc + TROOT.x, ly = (dx * Math.sin(a) + dy * Math.cos(a)) / sc + TROOT.y;
  if (lx < 0 || ly < 0 || lx >= TW0 || ly >= TH0) return false;
  return tailPx[((ly | 0) * TW0 + (lx | 0)) * 4 + 3] > 60;
}
function addMeter(n) {
  if (performance.now() < tail.puffUntil) return;
  meter = Math.min(1, meter + n);
  if (meter >= 1) puffUp();
}
function puffUp() {
  meter = 0; tail.puffUntil = performance.now() + 2600; laughUntil = Math.max(laughUntil, tail.puffUntil);   // ボワッの間は大笑い tail.pv += 9; tail.va += (Math.random() < 0.5 ? -1 : 1) * 3;
  const [rx, ry] = rootScreen();
  popWord('ボワッ！', rx + 60 * S * 2, ry + 40, true);
  say('puff', true); boing(260, 2.4, 1); fasa(1.2, 0.5); buzz([20, 40, 20]);
  heartBurst(8);
}

/* ---------- 毛のかけら（なでると、ふわっと舞う）・ハート ---------- */
const fluffs = [], hearts = [];
function addFluff(x, y) {
  fluffs.push({ x, y, vx: (Math.random() - 0.5) * 70, vy: -20 - Math.random() * 50, t: 0, life: 0.9 + Math.random() * 0.6,
    rot: Math.random() * 6, vr: (Math.random() - 0.5) * 6, len: 6 + Math.random() * 8, col: Math.random() < 0.5 ? '#F6E7D2' : '#C98A55' });
  if (fluffs.length > 90) fluffs.shift();
}
const HEART_COLS = ['#FF6F9C', '#FF8FB1', '#FF5C8A', '#FFA3C0'];
function addHeart() {
  // 顔のまわり（うしろ姿の絵の (190, 140) あたり）の、左と上から
  const a = Math.PI * (0.9 + Math.random() * 0.75), r = 120 + Math.random() * 60;
  hearts.push({ x: OX + (190 + Math.cos(a) * r) * S, y: OY + (150 + Math.sin(a) * r * 0.8) * S, vx: Math.cos(a) * 25, vy: -(45 + Math.random() * 50),
    t: 0, life: 1.4 + Math.random() * 0.8, size: 0.9 + Math.random() * 0.6, rot: (Math.random() - 0.5) * 0.5,
    wa: 6 + Math.random() * 8, wf: 2 + Math.random() * 2, ph: Math.random() * 6, col: HEART_COLS[(Math.random() * 4) | 0] });
  if (hearts.length > 60) hearts.shift();
}
let heartAcc = 0;
function heartBurst(n) { for (let i = 0; i < n; i++) addHeart(); }
function heartPath() {
  ctx.beginPath(); ctx.moveTo(0, 7);
  ctx.bezierCurveTo(-11, -1, -9, -11, -3.5, -10); ctx.bezierCurveTo(-1.5, -9.5, -0.3, -8, 0, -6);
  ctx.bezierCurveTo(0.3, -8, 1.5, -9.5, 3.5, -10); ctx.bezierCurveTo(9, -11, 11, -1, 0, 7); ctx.closePath();
}

/* ---------- さわる ---------- */
const fingers = new Map();
let rubAcc = 0, wordAcc = 0;
/* 表情：ふつう／照れ笑い（しっぽ・おしりをさわっている間と、そのあと 1.5 秒）／大笑い（2秒に6回さわる・ボワッのとき） */
let shy = 0, shyUntil = 0, laugh = 0, laughUntil = 0;
const taps = [];
function touched() {
  const now = performance.now();
  shyUntil = now + 1500;
  taps.push(now); while (taps.length && now - taps[0] > 2000) taps.shift();
  if (taps.length >= 6) { if (now >= laughUntil) heartBurst(8); laughUntil = Math.max(laughUntil, now + 1600); }
}
cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (!I.body) return;
  audio();
  const x = e.clientX, y = e.clientY;
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  if (adjOpen) { fingers.set(e.pointerId, { kind: 'adj', x, y, tx: TP.x, ty: TP.y }); return; }
  if (onTail(x, y)) {
    const [rx, ry] = rootScreen();
    fingers.set(e.pointerId, { kind: 'tail', x, y, x0: x, y0: y, moved: 0, a0: tail.a, ang0: Math.atan2(y - ry, x - rx) });
    tail.follow = e.pointerId;
    return;
  }
  const [bx, by] = toBody(x, y);
  const onBody = bodyPx && bx >= 0 && by >= 0 && bx < BW0 && by < BH0 && bodyPx[((by | 0) * BW0 + (bx | 0)) * 4 + 3] > 60;
  // いちばん中心に近い「揺れる所」（だ円の中）
  let c = null, cd = 1;
  REGIONS.forEach((r) => { const d = Math.hypot((bx - r.cx) / r.rx, (by - r.cy) / r.ry); if (d < cd) { cd = d; c = r; } });
  if (c && onBody) {
    if (c.poke) {
      // 二の腕：押さえている間くぼむ（はなすと「ぷるん」）
      c.press = e.pointerId; c.t0 = performance.now(); c.px = bx; c.py = by; c.v += c.kick * 0.35;
      fingers.set(e.pointerId, { kind: 'poke', r: c, x, y });
      touched(); popWord(c.word, x, y - 10); say(c.kind); boing(250, 0.5, 0.75); buzz(12);
      return;
    }
    // 押した所が大きく、反対側も少し揺れる
    c.v += c.kick; if (c.pair) REG[c.pair].v += c.kick * 0.4;
    touched();
    popWord(c.word, x, y - 10); say(c.kind);
    boing(c.kind === 'arm' ? 230 : c.kind === 'butt' ? 170 : 200, 0.55, 0.85); buzz(14);
    return;
  }
  if (onBody) say('body');
});
cv.addEventListener('pointermove', (e) => {
  const f0 = fingers.get(e.pointerId);
  if (f0 && f0.kind === 'adj') {
    TP.x = Math.round(Math.max(200, Math.min(600, f0.tx + (e.clientX - f0.x) / S)));
    TP.y = Math.round(Math.max(380, Math.min(760, f0.ty + (e.clientY - f0.y) / S)));
    adjSave(); return;
  }
  if (f0 && f0.kind === 'poke') {
    // くぼみが指についてくる（腕の外に出たら、ふちで止まる）
    const r = f0.r, [bx, by] = toBody(e.clientX, e.clientY), u = (bx - r.cx) / r.rx, v = (by - r.cy) / r.ry, d = Math.hypot(u, v), m = d > 0.8 ? 0.8 / d : 1;
    r.px = r.cx + u * m * r.rx; r.py = r.cy + v * m * r.ry; shyUntil = performance.now() + 1500;
    return;
  }
  const f = fingers.get(e.pointerId); if (!f || f.kind !== 'tail') return;
  const x = e.clientX, y = e.clientY, d = Math.hypot(x - f.x, y - f.y);
  f.moved += d; f.x = x; f.y = y;
  if (f.moved < 8) return;
  // しっぽが指についてくる（付け根を中心に、指の向きへ。曲がりすぎないように）
  const [rx, ry] = rootScreen();
  let da = Math.atan2(y - ry, x - rx) - f.ang0;
  while (da > Math.PI) da -= Math.PI * 2; while (da < -Math.PI) da += Math.PI * 2;
  tail.target = Math.max(-0.75, Math.min(0.75, f.a0 + da * 0.85));
  // ふさふさ：なでた長さで、ゲージ・毛のかけら・文字・音
  addMeter(d * 0.0016);
  shyUntil = performance.now() + 1500;   // なでている間は照れ笑い
  rubAcc += d; wordAcc += d;
  if (rubAcc > 14) { rubAcc = 0; addFluff(x, y); }
  // ボワッの間は、ボワッのセリフのまま（なでるセリフで上書きしない）
  if (wordAcc > 150) { wordAcc = 0; popWord('ふさふさ', x, y - 12); fasa(0.7, 0.28); if (performance.now() > tail.puffUntil) say('rub'); if (Math.random() < 0.6) addHeart(); }
});
function release(e) {
  const f = fingers.get(e.pointerId); if (!f) return;
  fingers.delete(e.pointerId);
  if (f.kind === 'poke') {
    const r = f.r; if (r.press === e.pointerId) { r.press = null; r.dentV -= 7; r.v += r.kick * 0.6; boing(300, 1.5, 0.5); buzz(8); }
    return;
  }
  if (f.kind !== 'tail') return;
  tail.follow = null; tail.target = null;
  if (f.moved < 8) {
    // タップ：ふりふり
    tail.va += (Math.random() < 0.5 ? -1 : 1) * 5.5; tail.sqv += 6;
    touched();
    popWord(Math.random() < 0.5 ? 'ふぁさっ' : 'ふりふり♪', f.x0, f.y0 - 10);
    say('tail'); fasa(0.8, 0.22); buzz(10); addMeter(0.17);
    for (let i = 0; i < 5; i++) addFluff(f.x0, f.y0);
  } else {
    tail.va += (tail.a > 0 ? -1 : 1) * 2;   // はなすと、ぶるるんと戻る

}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
/* ---------- しっぽの位置の調整 ---------- */
let adjOpen = false;
const $ = (id) => document.getElementById(id);

  $('aB').checked = !!TP.back;

}
function adjText() { return 'しっぽ x=' + Math.round(TP.x) + ' y=' + Math.round(TP.y) + ' 向き=' + Math.round(TP.deg) + ' 大きさ=' + Number(TP.scale).toFixed(2) + ' 葉っぱの下=' + (TP.back ? 'はい' : 'いいえ'); }

Object.entries(adjInputs).forEach(([id, k]) => $(id).addEventListener('input', (e) => { TP[k] = Number(e.target.value); adjSave(); }));

/* ---------- 動き ---------- */
let T = 0;
function step(dt) {
  T += dt;
  const now = performance.now();
  // しっぽ：指についてくる間は目標の角度へ、はなすと、ばねで「ぶるるん」。ふだんは、ゆっくり ゆらゆら
  const idle = Math.sin(T * 1.6) * 0.05;
  const target = tail.target != null ? tail.target : idle;
  tail.va += ((tail.target != null ? 160 : 70) * (target - tail.a) - (tail.target != null ? 16 : 3.2) * tail.va) * dt;
  tail.a += tail.va * dt;
  tail.sqv += (-180 * tail.sq - 8 * tail.sqv) * dt; tail.sq += tail.sqv * dt;
  const pt = now < tail.puffUntil ? 1 : 0;
  tail.pv += (120 * (pt - tail.puff) - (pt ? 9 : 6) * tail.pv) * dt; tail.puff += tail.pv * dt;
  meter = Math.max(0, meter - dt * 0.08);
  const wl = now < laughUntil ? 1 : 0, ws = !wl && now < shyUntil ? 1 : 0;
  shy += (ws - shy) * Math.min(1, dt * (ws ? 12 : 3));
  laugh += (wl - laugh) * Math.min(1, dt * (wl ? 14 : 3));
  // 大笑いのときは、ハートがぽわぽわ
  heartAcc += dt * (laugh > 0.5 ? 10 * laugh : 0);
  while (heartAcc >= 1) { heartAcc -= 1; addHeart(); }
  meterEl.style.width = (now < tail.puffUntil ? 100 : meter * 100) + '%';
  // 揺れる所（ばね）
  REGIONS.forEach((k) => {
    k.v += (-260 * k.y - 6 * k.v) * dt; k.y += k.v * dt; if (k.y > 26) { k.y = 26; k.v *= 0.5; } else if (k.y < -26) { k.y = -26; k.v *= 0.5; }
    if (k.poke) {   // くぼみ：押さえている間は 1、長押しで 1.3 まで。はなすと、ばねで戻る
      const tg = k.press != null ? 1 + Math.min(0.3, (now - k.t0) / 1000 * 0.25) : 0;
      k.dentV += (300 * (tg - k.dent) - (k.press != null ? 18 : 11) * k.dentV) * dt; k.dent += k.dentV * dt;
    }
  });
  for (let i = fluffs.length - 1; i >= 0; i--) { const q = fluffs[i]; q.t += dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 30 * dt; q.vx *= 1 - dt; q.rot += q.vr * dt; if (q.t > q.life) fluffs.splice(i, 1); }
  for (let i = hearts.length - 1; i >= 0; i--) { const q = hearts[i]; q.t += dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vy *= 1 - 0.4 * dt; if (q.t > q.life) hearts.splice(i, 1); }
}

/* ---------- 揺れている所を描く ----------
   揺れている所（だ円）をぜんぶかこむ四角を、毎回つくり直して、その中だけ1ピクセルずつ描く。
   重み (1 - r²)²（ぽんぽこリズムと同じ形）で上下にずらし、沈むと少し横に広がる */
let mv = null;   // いま揺れている四角 { x0, y0, w, h }
function movingBox() {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, any = false;
  REGIONS.forEach((r) => { if (Math.abs(r.y) > 0.15 || Math.abs(r.dent) > 0.01) { any = true; x0 = Math.min(x0, r.cx - r.rx); x1 = Math.max(x1, r.cx + r.rx); y0 = Math.min(y0, r.cy - r.ry - 30); y1 = Math.max(y1, r.cy + r.ry + 30); } });
  if (!any) return null;
  x0 = Math.max(0, Math.floor(x0)); y0 = Math.max(0, Math.floor(y0)); x1 = Math.min(BW0, Math.ceil(x1)); y1 = Math.min(BH0, Math.ceil(y1));
  return { x0, y0, w: x1 - x0, h: y1 - y0 };
}
let wPatch = null, wCtx = null;
function drawMoving(b) {
  if (!wPatch) { wPatch = document.createElement('canvas'); wCtx = wPatch.getContext('2d'); }
  if (wPatch.width !== b.w || wPatch.height !== b.h) { wPatch.width = b.w; wPatch.height = b.h; }
  const data = wCtx.createImageData(b.w, b.h), out = data.data;
  const act = REGIONS.filter((r) => Math.abs(r.y) > 0.15 || Math.abs(r.dent) > 0.01);
  for (let y = 0; y < b.h; y++) {
    const iy0 = b.y0 + y;
    for (let x = 0; x < b.w; x++) {
      const ix0 = b.x0 + x, o = (y * b.w + x) * 4;
      let dy = 0, dx = 0, sh = 1;
      for (let n = 0; n < act.length; n++) {
        const r = act[n], u = (ix0 - r.cx) / r.rx, v = (iy0 - r.cy) / r.ry, r2 = u * u + v * v;
        if (r2 >= 1) continue;
        const w = (1 - r2) * (1 - r2);
        dy += r.y * w; dx += (ix0 - r.cx) * 0.003 * r.y * w;
        // 二の腕のくぼみ：指のまわりの絵を縮めて（奥にへこむ）、左上からの光で影をつける
        if (r.poke && r.dent > 0.01) {
          const qx = ix0 - r.px, qy = iy0 - r.py, R = (r.rx + r.ry) / 2 * 0.75, dist = Math.hypot(qx, qy), rn = dist / R;
          if (rn < 1.6) {
            const t = (1 - rn / 1.6) * (1 - rn / 1.6), D = r.dent * w;
            dx -= qx * 0.28 * D * t; dy -= qy * 0.28 * D * t;
            const g = Math.exp(-rn * rn * 1.6), dl = dist > 0.01 ? (qx * -0.55 + qy * -0.83) / dist : 0;
            sh *= (1 - 0.32 * D * g * 3.2 * rn * dl) * (1 - 0.3 * D * g);
          }
        }
      }
      let iy = (iy0 - dy + 0.5) | 0, ix = (ix0 - dx + 0.5) | 0;
      if (iy < 0) iy = 0; else if (iy >= BH0) iy = BH0 - 1; if (ix < 0) ix = 0; else if (ix >= BW0) ix = BW0 - 1;
      const si = (iy * BW0 + ix) * 4;
      if (sh !== 1) {
        if (sh < 0.35) sh = 0.35;
        if (sh < 1) { out[o] = bodyPx[si] * sh; out[o + 1] = bodyPx[si + 1] * sh; out[o + 2] = bodyPx[si + 2] * sh; }
        else { const k = Math.min(1, sh - 1) * 0.5; out[o] = bodyPx[si] + (255 - bodyPx[si]) * k; out[o + 1] = bodyPx[si + 1] + (255 - bodyPx[si + 1]) * k; out[o + 2] = bodyPx[si + 2] + (255 - bodyPx[si + 2]) * k; }
        out[o + 3] = bodyPx[si + 3];
      } else { out[o] = bodyPx[si]; out[o + 1] = bodyPx[si + 1]; out[o + 2] = bodyPx[si + 2]; out[o + 3] = bodyPx[si + 3]; }
    }
  }
  wCtx.putImageData(data, 0, 0);
  ctx.drawImage(wPatch, OX + b.x0 * S, OY + b.y0 * S, b.w * S, b.h * S);
}

/* ---------- 腰みのの葉っぱ（しっぽを「葉っぱの下から出す」ときに、しっぽの上に重ねる） ---------- */
let leaves = null;
function makeLeaves() {
  const c = document.createElement('canvas'); c.width = BW0; c.height = BH0;
  const x = c.getContext('2d'), d = x.createImageData(BW0, BH0), o = d.data;
  for (let y = 520; y < 800; y++) for (let xx = 0; xx < BW0; xx++) {
    const i = (y * BW0 + xx) * 4, r = bodyPx[i], g = bodyPx[i + 1], b = bodyPx[i + 2], a = bodyPx[i + 3];
    // 葉っぱ（緑）と、ひも（黄土色で、茶色の毛より緑が強い）
    const leaf = g > r * 0.92 && g > b * 1.25, rope = y < 610 && g > r * 0.78 && r > 150 && b < 120 && g > b * 1.4;
    if (a > 60 && (leaf || rope)) { o[i] = r; o[i + 1] = g; o[i + 2] = b; o[i + 3] = a; }
  }
  x.putImageData(d, 0, 0); leaves = c;
}

/* ---------- 描く ---------- */
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // 背景（浜辺。画面いっぱいに）
  const b = I.bg, bs = Math.max(W / b.width, H / b.height);
  ctx.drawImage(b, (W - b.width * bs) / 2, (H - b.height * bs) / 2, b.width * bs, b.height * bs);
  // 足もとの かげ
  ctx.fillStyle = 'rgba(90,60,30,.18)'; ctx.beginPath(); ctx.ellipse(OX + 380 * S, OY + 1118 * S, 260 * S, 30 * S, 0, 0, 7); ctx.fill();
  // からだ（揺れている間は、その四角だけ、揺らした絵にさしかえる）
  mv = movingBox();
  if (mv) {
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.rect(OX + mv.x0 * S, OY + mv.y0 * S, mv.w * S, mv.h * S); ctx.clip('evenodd');
    ctx.drawImage(I.body, OX, OY, BW0 * S, BH0 * S); ctx.restore();
    drawMoving(mv);
  } else ctx.drawImage(I.body, OX, OY, BW0 * S, BH0 * S);
  // 表情：顔の所だけ、照れ笑い・大笑いの絵をふわっと重ねる
  [[I.shy, shy], [I.laugh, laugh]].forEach(([im, a]) => {
    if (!im || a < 0.01) return;
    ctx.globalAlpha = a; ctx.drawImage(im, OX, OY, BW0 * S, FACE_H * S); ctx.globalAlpha = 1;
  });
  // しっぽ（付け根を中心に回す。ボワッのときは、ふくらんだ絵に切りかえて大きく）
  const [rx, ry] = rootScreen(), sc = tailScale() * S;
  ctx.save(); ctx.translate(rx, ry); ctx.rotate(tailAngle()); ctx.scale(sc * (1 - 0.04 * tail.sq), sc * (1 + 0.06 * tail.sq));
  const pf = Math.max(0, Math.min(1, tail.puff));
  if (pf < 0.99) ctx.drawImage(I.tail, -TROOT.x, -TROOT.y, TW0, TH0);
  if (pf > 0.01) { ctx.globalAlpha = pf; ctx.drawImage(I.puff, -TROOT.x, -TROOT.y, TW0, TH0); ctx.globalAlpha = 1; }
  ctx.restore();
  // 「葉っぱの下から出す」とき：しっぽの上に、葉っぱとひもを重ねる
  if (TP.back && leaves) ctx.drawImage(leaves, OX, OY, BW0 * S, BH0 * S);
  // 位置を調整している間は、付け根に印
  // 位置を調整している間は、揺れる所（だ円）も うすく見せる
  if (adjOpen) { ctx.save(); ctx.fillStyle = 'rgba(80,200,120,.22)'; ctx.strokeStyle = 'rgba(30,140,70,.9)'; ctx.lineWidth = 1.5;
    REGIONS.forEach((r) => { ctx.beginPath(); ctx.ellipse(OX + r.cx * S, OY + r.cy * S, r.rx * S, r.ry * S, 0, 0, 7); ctx.fill(); ctx.stroke(); }); ctx.restore(); }
  if (adjOpen) { ctx.strokeStyle = '#D9536A'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(rx, ry, 9, 0, 7); ctx.moveTo(rx - 14, ry); ctx.lineTo(rx + 14, ry); ctx.moveTo(rx, ry - 14); ctx.lineTo(rx, ry + 14); ctx.stroke(); }
  // 毛のかけら
  fluffs.forEach((q) => {
    const a = 1 - q.t / q.life;
    ctx.save(); ctx.globalAlpha = a; ctx.translate(q.x, q.y); ctx.rotate(q.rot);
    ctx.strokeStyle = q.col; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-q.len / 2, 0); ctx.quadraticCurveTo(0, -3, q.len / 2, 0); ctx.stroke();
    ctx.restore();
  });

    const k = q.t / q.life, a = k < 0.15 ? k / 0.15 : 1 - (k - 0.15) / 0.85, sc2 = q.size * (0.6 + 0.4 * Math.min(1, k * 5));
    ctx.save(); ctx.globalAlpha = Math.max(0, a) * 0.95;
    ctx.translate(q.x + Math.sin(q.t * q.wf + q.ph) * q.wa, q.y); ctx.rotate(q.rot); ctx.scale(sc2, sc2);
    heartPath(); ctx.fillStyle = q.col; ctx.fill(); ctx.lineWidth = 1.4 / sc2; ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.beginPath(); ctx.ellipse(-4.5, -3, 2.6, 1.6, -0.6, 0, 7); ctx.fill();
    ctx.restore();
  });
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  for (let i = 0; i < 4; i++) step(dt / 4);
  draw();
