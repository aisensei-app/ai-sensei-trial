<!--
  タヌくん：第2章「島の夜祭り」序章のお試し版（2026-11-05）
  ・目的：ユーザーが描いた横長の絵（1536×1024）が、スマホの縦画面でも使えるかを確かめる
  ・絵：img/cafe_invite.webp（カフェでメニューを見せてお誘い）・img/cafe_happy.webp（同じ背景で、目を閉じてにっこり）
        img/gate_day.webp（縦長 1024×1536。昼の会場の入り口で手を差し出す）
  ・見せ方：恋愛ゲームの形（2026-11-05 ユーザーの希望）。上に絵、下にセリフの枠（名前の札つき・1文字ずつ出る）。
            絵は枠の上のあいた所いっぱいに出し、セリフごとに見る所（x：0＝左はし〜100＝右はし）へゆっくり動く。
            位置は CSS の object-position だけで決める（JS で大きさを計算しない。前の版はスマホでずれた）
            右上の「全体」で、絵をそのまま縮めた見え方（あいた所はぼかし）と切りかえて比べられる
  ・本編にはまだつないでいない（build_app.py にも入れていない）
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&display=swap&text=%E3%81%B7%E3%82%8B%E3%82%93%E2%99%AA%E3%83%89%E3%83%B3%EF%BC%81">
<style>
:root{
  --ink:#4A2C1A; --orange:#F08A3C; --orange-d:#C8641E;
  --display:-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:#2a1a10;color:var(--ink);font-family:var(--display);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
/* 画面＝上の絵（のこり全部）＋下のセリフの枠 */
#game{position:fixed;inset:0;display:flex;flex-direction:column;cursor:pointer;touch-action:none}
#stage{position:relative;flex:1;min-height:0;overflow:hidden}
.layer{position:absolute;inset:0;opacity:0;transition:opacity .8s ease}
.layer.on{opacity:1}
.layer img{position:absolute;inset:0;width:100%;height:100%;display:block}
.layer .blur{object-fit:cover;filter:blur(20px) brightness(.65);transform:scale(1.15);opacity:0;transition:opacity .5s}
.layer .pic{object-fit:cover;object-position:var(--x,50%) var(--y,30%);
  transition:object-position 1.8s cubic-bezier(.35,.05,.25,1)}
body.whole .layer .blur{opacity:1}
body.whole .layer .pic{object-fit:contain;object-position:50% 50%}
/* おなかが揺れる絵：同じ位置に canvas を重ねて、網目のように変形して描く */
.layer .wobble{position:absolute;inset:0;width:100%;height:100%;display:block}
.pop{position:absolute;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);font-family:"Mochiy Pop One",var(--display);
  font-size:clamp(26px,8vw,36px);color:#fff;-webkit-text-stroke:6px var(--orange-d);paint-order:stroke fill;
  text-shadow:0 3px 0 #9E4A12;pointer-events:none;opacity:0;white-space:nowrap}
.pop.go{animation:pop .9s ease-out}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}25%{opacity:1;transform:translate(-50%,-60%) scale(1.1)}
  70%{opacity:1}100%{opacity:0;transform:translate(-50%,-110%) scale(1)}}
/* 太鼓：たたいた瞬間だけ、たたく絵にぱっと切りかえ、画面をゆらす */
.layer.hitpic.flash{opacity:1;transition:none}
#stage.shake .layer{animation:shake .28s ease-out}
@keyframes shake{20%{transform:translate(-5px,3px)}45%{transform:translate(4px,-3px)}70%{transform:translate(-2px,1px)}}
/* ちゅ〜の場面（2026-11-05 ユーザーと決めた：日本古来の「余白」。直前と分かる言葉・表現は入れず、そのあとどうなったかは遊ぶ人にまかせる）
   不器用さは動きで見せる：ぷるぷる震えながら近づく → 一度ためらって少し引く → もう一度、ぎゅっと近づく。まわりは胸の鼓動のように、ふちがほんのり赤く脈打つ */
.layer.kiss.on .pic{animation:lean 6.5s ease-in-out forwards}
@keyframes lean{
  0%{transform:none}
  14%{transform:scale(1.035) rotate(-.5deg)} 17%{transform:scale(1.037) rotate(.5deg)} 20%{transform:scale(1.04) rotate(-.4deg)}
  23%{transform:scale(1.042) rotate(.3deg)} 26%{transform:scale(1.043)}
  40%{transform:scale(1.01) translateY(4px)}
  52%{transform:scale(1.012) translateX(-2px)} 54%{transform:scale(1.014) translateX(2px)} 56%{transform:scale(1.016) translateX(-2px)} 58%{transform:scale(1.018) translateX(1px)}
  100%{transform:scale(1.13)}}
.layer.kiss::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse at 50% 40%,transparent 45%,rgba(255,90,130,.38) 100%)}
.layer.kiss.on::after{animation:beat .9s ease-in-out infinite}
@keyframes beat{0%,100%{opacity:.25}15%{opacity:.85}30%{opacity:.35}45%{opacity:.7}}
/* カメラが夜空へ上がる：キスの絵は下へ出ていき、夜空が上から入ってくる */
.layer.kiss.away{opacity:1;transform:translateY(100%);transition:transform 2.6s cubic-bezier(.6,0,.3,1),opacity .1s}
.layer.sky{transition:opacity .1s}
.layer.sky.rise{transform:translateY(-100%)}
.layer.sky.rise.go{transform:none;transition:transform 2.6s cubic-bezier(.6,0,.3,1)}
.layer .fw{position:absolute;inset:0;width:100%;height:100%;display:block}
.hint{position:absolute;z-index:2;left:0;right:0;margin:0 auto;width:max-content;max-width:calc(100% - 32px);bottom:52px;background:rgba(255,255,255,.85);color:var(--orange-d);
  font-size:13px;font-weight:800;padding:6px 14px;border-radius:99px;white-space:nowrap;animation:bob 1.2s ease-in-out infinite}
.hint[hidden]{display:none}
/* 操作ガイド（2026-11-05）：触る場所の上に、指のアイコンと「タップしてね」を、ゆっくり2回だけ点滅させて消す。
   指を置く場所のうえに出すので、ガイド自体は押せない（pointer-events:none）＝ガイドを押してセリフが進んでしまうことがない */
.guide{position:absolute;z-index:2;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:4px;opacity:0;transform:translate(-45%,-14px)}
.guide[hidden]{display:none}
.guide.go{animation:guideBlink 2.8s ease-in-out 2 forwards}
@keyframes guideBlink{0%{opacity:0}22%{opacity:1}62%{opacity:1}88%,100%{opacity:0}}
.guide .finger{filter:drop-shadow(0 3px 4px rgba(0,0,0,.35));animation:fingerTap 1.4s ease-in-out infinite}
@keyframes fingerTap{0%,100%{transform:translateY(0)}38%{transform:translateY(-7px)}60%{transform:translateY(3px) scale(.95)}}
.guide .ring{position:absolute;left:calc(50% - 4px);top:-4px;width:26px;height:26px;margin-left:-13px;border-radius:50%;border:3px solid rgba(255,255,255,.9);opacity:0;animation:ringTap 1.4s ease-out infinite}
@keyframes ringTap{0%,52%{opacity:0;transform:scale(.4)}60%{opacity:.9}100%{opacity:0;transform:scale(1.6)}}
.guide .gtext{background:rgba(255,255,255,.88);color:var(--orange-d);font-size:13px;font-weight:800;padding:5px 12px;border-radius:99px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:reduce){.guide .finger,.guide .ring{animation:none}}
/* 絵の下のはしを、セリフの枠へなじませる */
#stage::after{content:"";position:absolute;left:0;right:0;bottom:0;height:40px;
  background:linear-gradient(transparent,#2a1a10);pointer-events:none}
/* セリフの枠 */
#talk{position:relative;flex:none;padding:22px 16px calc(env(safe-area-inset-bottom,0px) + 14px)}
.box{position:relative;min-height:5.2em;padding:18px 20px 22px;border-radius:22px;background:#fff;
  box-shadow:0 4px 14px rgba(0,0,0,.25);font-size:clamp(17px,4.8vw,22px);font-weight:700;line-height:1.55;white-space:pre-line}
.name{position:absolute;left:18px;top:-14px;background:var(--orange);color:#fff;font-size:14px;font-weight:800;
  padding:4px 14px;border-radius:99px;box-shadow:0 2px 0 var(--orange-d)}
.more{position:absolute;right:16px;bottom:8px;color:var(--orange-d);font-size:14px;opacity:0}
.more.on{opacity:1;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(3px)}}
/* 二択・「もう一度」のボタンは、セリフの枠の上に重ねて出す（場所を取ると、絵の枠が縮んで、絵の大きさが変わって見えるため） */
.btns{position:absolute;left:0;right:0;bottom:100%;z-index:3;display:flex;justify-content:center;margin-bottom:6px}
.btns[hidden]{display:none}
.btn{border:0;border-radius:99px;font:inherit;font-weight:800;font-size:17px;padding:12px 30px;cursor:pointer;
  background:var(--orange);color:#fff;box-shadow:0 4px 0 var(--orange-d)}
/* 道具ボタン：白く半分すけた小さな丸・ふちなし・こげ茶の字 */
.tool{position:absolute;top:12px;z-index:2;border:0;border-radius:99px;background:rgba(255,255,255,.72);color:var(--ink);
  font:inherit;font-size:13px;font-weight:800;padding:7px 12px}
#mode{right:16px;cursor:pointer}
#nm{right:76px;cursor:pointer}
/* 選択肢（2026-11-05）：どちらを選んでも先は同じ。ボタンの3段階の「② 脇役＝白い丸」で2つ並べる */
.btns.choice{gap:12px;flex-wrap:wrap}
.btn.alt{background:#fff;color:var(--orange-d);padding:13px 24px;border:2px solid #FFD2A6;
  box-shadow:0 5px 0 #E3B98F,0 10px 18px rgba(0,0,0,.30);   /* 下にくっきりした影＝ぷっくり浮いたボタン */
  animation:btnIn .45s ease-out backwards,btnBob 2.8s ease-in-out .5s infinite;   /* 出てくるときにふわっ → そのあとほのかに上下 */
  transition:box-shadow .1s}
.btn.alt:nth-child(2){animation-delay:.15s,1.1s}   /* 2つ目は少しずらす（そろって動くと機械的に見える） */
.btn.alt:active{animation:none;transform:translateY(4px);box-shadow:0 1px 0 #E3B98F,0 3px 8px rgba(0,0,0,.25)}   /* 押すと沈む */
.btn.alt:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
@keyframes btnIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
@keyframes btnBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.btn.alt{animation:none}}
#step{left:16px}
</style>

<script>
/* セリフと、そのときの絵（pic）・見る所（x：横 0〜100、y：たて 0〜100） */
const LINES = [
  /* 序章（0日目）：カフェ → 入り口。{name} は呼び名（なければ文頭は消えて、文の途中は「きみ」） */
  { pic: 0, x: 50, y: 25, t: '{name}、あっ、来てくれたんだ♪\nちょうど会いたかったんだ！' },

    sweatDrop(ctx, p[0], p[1], d.z, a);
  };
  // おなかのつや（うっすら・ゆっくり明るさが変わる）
  const sh = ctx.createRadialGradient(650, 960, 10, 650, 980, 270), pulse = .07 + .03 * Math.sin(t * 1.3);
  sh.addColorStop(0, 'rgba(255,240,220,' + pulse + ')'); sh.addColorStop(1, 'rgba(255,240,220,0)');

function sweatLoop(){   // 汗のある絵が出ている間だけ、ゆっくり描き直す（1秒に20回くらい）
  const l = layers[LINES[i].pic];
  if (!l || !l.hasAttribute('data-sweat')) { sweatOn = false; return; }
  if (!l._run) draw(l);
  setTimeout(() => requestAnimationFrame(sweatLoop), 50);
}
function drawAll(){ layers.forEach(l => l.hasAttribute('data-jiggle') && draw(l)); }
/* おなかをタップ＝指を置く（へこむ・指の位置がくぼむ）→ 少しして、はなす（「ぷるん」と戻る）。belly.js の press / release と同じ */
function purun(l, ix, iy){
  const E = ell(l.dataset.belly);
  l._hold = -PRESS_DENT; l._pkHold = -POKE_DEPTH;
  const u = (ix - E.cx) / E.rx, v = (iy - E.cy) / E.ry, d = Math.hypot(u, v), m = d > .5 ? .5 / d : 1;   // 指の位置を、楕円の内側におさめる
  l._pcx = E.cx + u * m * E.rx; l._pcy = E.cy + v * m * E.ry;
  runSpring(l);
  clearTimeout(l._rel);
  l._rel = setTimeout(() => {
    l._hold = 0; l._pkHold = 0;
    if ((l._x || 0) < -PRESS_DENT * .5) l._v = (l._v || 0) + TAP_V * REBOUND;   // しっかり押していた：へこみから「ぷるん」と強めに戻す
    else l._v = (l._v || 0) - TAP_V;                                              // ちょんと触っただけ：まずへこんでから戻る
    runSpring(l);
  }, 90);
}
function runSpring(l){
  if (l._run) return; l._run = true;
  let last = performance.now();
  (function step(now){
    let dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now;
    for (; dt > 0; dt -= 1 / 240) {   // 細かく区切って計算（スマホの画面の更新の速さに関係なく、同じ動きになる）
      const h = Math.min(dt, 1 / 240);
      l._v = (l._v || 0) + (-SPRING * ((l._x || 0) - (l._hold || 0)) - DAMP * (l._v || 0)) * h; l._x = (l._x || 0) + l._v * h;
      l._pkv = (l._pkv || 0) + (-SPRING * ((l._pk || 0) - (l._pkHold || 0)) - DAMP * (l._pkv || 0)) * h; l._pk = (l._pk || 0) + l._pkv * h;
      if (!l._drag) {   // 引っぱった指をはなしたら、ばねで「ぼよよん」と戻る
        l._pvx = (l._pvx || 0) + (-SPRING * (l._px || 0) - DAMP * (l._pvx || 0)) * h; l._px = (l._px || 0) + l._pvx * h;
        l._pvy = (l._pvy || 0) + (-SPRING * (l._py || 0) - DAMP * (l._pvy || 0)) * h; l._py = (l._py || 0) + l._pvy * h;
      }
    }
    draw(l);
    const still = !l._drag && !l._hold && !l._pkHold && Math.abs(l._x) < .001 && Math.abs(l._v) < .02 && Math.abs(l._pk) < .001 && Math.abs(l._pkv) < .02
      && Math.abs(l._px || 0) < .3 && Math.abs(l._py || 0) < .3 && Math.abs(l._pvx || 0) < 8 && Math.abs(l._pvy || 0) < 8;
    if (still) { l._x = l._v = l._pk = l._pkv = l._px = l._py = l._pvx = l._pvy = 0; l._run = false; draw(l); return; }
    requestAnimationFrame(step);
  })(last);
}
layers.forEach(l => l.hasAttribute('data-jiggle') && l.querySelector('.pic').addEventListener('load', () => draw(l)));
show();

/* ===== 花火 =====
   下から玉が上がって（ヒュ〜）、ぱっと開く。粒は重さで少しずつ落ちながら、尾を引いて消える。
   夜空の絵の上の canvas に描く。タップした所で開く／何もしなくても、ときどき上がる */
const FW_COLORS = ['#FFD36E', '#FF8FB1', '#8FE3FF', '#FFB066', '#FFFFFF', '#C9A6FF', '#9CFFB5'];
let rockets = [], sparks = [], fwRun = false, fwAuto = 0;
function fwCanvas(){
  const c = $('.layer.sky .fw'), r = c.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
  if (c.width !== Math.round(r.width * dpr)) { c.width = Math.round(r.width * dpr); c.height = Math.round(r.height * dpr); }
  return { c, ctx: c.getContext('2d'), W: r.width, H: r.height, dpr };
}
function launch(x, y){
  const { W, H } = fwCanvas();
  const tx = x == null ? W * (.2 + Math.random() * .6) : x, ty = y == null ? H * (.15 + Math.random() * .3) : Math.min(y, H * .7);
  rockets.push({ x: tx + (Math.random() - .5) * 30, y: H, tx, ty, t: 0, dur: 650 + Math.random() * 250,
    color: FW_COLORS[Math.random() * FW_COLORS.length | 0], big: Math.random() < .3 });
  fwStart();
}
function burst(r){
  const n = r.big ? 110 : 70, sp = r.big ? 3.6 : 2.8, second = FW_COLORS[Math.random() * FW_COLORS.length | 0];
  for (let k = 0; k < n; k++) {
    const a = Math.PI * 2 * k / n + Math.random() * .1, v = sp * (.75 + Math.random() * .35);
    sparks.push({ x: r.tx, y: r.ty, px: r.tx, py: r.ty, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1,
      decay: .010 + Math.random() * .008, color: k % 3 ? r.color : second });
  }
}
function fwStart(){
  if (fwRun) return; fwRun = true;
  let last = performance.now();
  (function frame(now){
    const dt = Math.max(0, Math.min(50, now - last)); last = now;
    const { ctx, W, H, dpr } = fwCanvas();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    rockets = rockets.filter(r => {
      r.t += dt; const k = Math.min(1, r.t / r.dur), e = 1 - (1 - k) * (1 - k);
      const x = r.x + (r.tx - r.x) * e, y = r.y + (r.ty - r.y) * e;
      ctx.fillStyle = 'rgba(255,230,180,.9)'; ctx.beginPath(); ctx.arc(x, y, 2, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,200,140,.35)'; ctx.beginPath(); ctx.arc(x, y + 8, 1.5, 0, 7); ctx.fill();
      if (k >= 1) { burst(r); return false; } return true;
    });
    const f = dt / 16.7;
    sparks = sparks.filter(p => {
      p.px = p.x; p.py = p.y; p.vx *= Math.pow(.985, f); p.vy = p.vy * Math.pow(.985, f) + .035 * f;
      p.x += p.vx * f; p.y += p.vy * f; p.life -= p.decay * f;
      if (p.life <= 0) return false;
      ctx.globalAlpha = Math.min(1, p.life * 1.4); ctx.strokeStyle = p.color; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(p.px - p.vx * 3, p.py - p.vy * 3); ctx.lineTo(p.x, p.y); ctx.stroke();
      return true;
    });
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    if (LINES[i].pic === 11 && (fwAuto += dt) > 1600) { fwAuto = 0; launch(); }   // ときどき自動で上がる
    if (!rockets.length && !sparks.length && LINES[i].pic !== 11) { fwRun = false; ctx.clearRect(0, 0, W, H); return; }
    requestAnimationFrame(frame);
  })(last);
}
