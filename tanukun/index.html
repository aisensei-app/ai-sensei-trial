<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>タヌくん</title>
<meta name="theme-color" content="#FFF4E0">
<!-- ホーム画面に追加したときの設定（PWA の準備） -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="images/icon-192.png">
<link rel="apple-touch-icon" href="images/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="タヌくん">
<link rel="stylesheet" href="style.css">
</head>
<body class="mode-home">
<main id="app">

  <!-- 上のバー：メニュー画面では「何日目」、遊ぶ画面では「もどる」とハート -->
  <header id="topbar">
    <button id="back" class="back" type="button">‹ もどる</button>
    <div id="days" class="days">
      <div class="days-main">なかよし <b id="days-total">1</b> 日目</div>
      <div class="days-sub" id="days-streak"></div>
    </div>
    <div id="play-hearts" class="hearts" aria-label="なかよし度"></div>
    <!-- お試し版だけ表示 -->
    <div class="demo-bar">
      <span class="demo-badge">お試し版</span>
      <button id="btn-result" class="btn btn-result" type="button">🔮 診断する</button>
    </div>
  </header>

  <div id="stage">
    <div id="bubble" class="bubble" aria-live="polite"></div>
    <div id="tanu-area">
      <div class="ground"></div>
      <!-- 動きごとに入れ物を分けて、動きが重なっても崩れないようにしています -->
      <div id="tanu-move">
        <div id="tanu-melt">
          <div id="tanu-body">
            <div id="tanu-breath">
              <img id="tanu-img" alt="タヌくん" draggable="false">
              <!-- おなかだけ揺らすための重ね絵（同じ絵のおなか部分だけを、ふちをぼかして重ねる） -->
              <div id="belly-layer" aria-hidden="true"><img id="belly-img" alt="" draggable="false"></div>
              <!-- きせかえパーツ（デベソなど）を重ねるところ。揺れている間は canvas の絵に入る -->
              <div id="parts-layer" aria-hidden="true"></div>
              <!-- おなかを変形させた絵を描くところ（揺れている間だけ表示） -->
              <canvas id="belly-canvas" aria-hidden="true"></canvas>
            </div>
          </div>
        </div>
      </div>
      <div id="zones"></div>
    </div>
    <!-- なでなでゲージ（本編だけ）：さわるごとに葉っぱが1枚ずつ緑になり、たまるとレポート -->
    <div id="gauge" class="gauge" aria-hidden="true"></div>
  </div>

  <!-- メニュー画面のボタン -->
  <nav id="menu">
    <button id="btn-play" class="btn btn-main" type="button">
      <span>遊ぶ</span>
      <span id="menu-hearts" class="hearts" aria-label="なかよし度"></span>
    </button>
    <div class="btn-row">
      <button id="btn-record" class="btn" type="button">実績</button>
      <button id="btn-wear" class="btn" type="button">きせかえ</button>
      <button id="btn-settings" class="btn" type="button">設定</button>
    </div>
  </nav>

  <!-- はじめての人に呼び名を聞く -->
  <form id="name-form" class="name-form" autocomplete="off">
    <input id="name-input" class="name-input" type="text" maxlength="10"
           placeholder="呼んでほしい名前" aria-label="呼んでほしい名前" enterkeyhint="done">
    <button class="btn btn-main" type="submit">これでOK</button>
    <button id="name-skip" class="link" type="button">あとできめる</button>
    <p class="note small">名前はこのスマホの中だけに保存されます（ニックネームでOK）</p>
  </form>

  <p class="hint">頭・むね・おなか・しっぽをさわってね</p>
</main>

<!-- 実績・設定のパネル -->
<div id="sheet" class="sheet" hidden>
  <div class="sheet-box" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <h2 id="sheet-title"></h2>
    <div id="sheet-body"></div>
    <button id="sheet-close" class="btn" type="button">とじる</button>
  </div>
</div>

<!-- お知らせ（なかよし度アップ など） -->
<div id="toast" class="toast" aria-live="polite"></div>

<!-- 読み込む順番が大事です：設定 → セリフ → 記録 → おなか → 本体 -->
<script src="config.js"></script>
<script src="lines.js"></script>
<script src="save.js"></script>
<script src="belly.js"></script>
<script src="app.js"></script>
</body>
</html>
