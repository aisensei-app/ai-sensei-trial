<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>タヌくん</title>
<meta name="theme-color" content="#FFF4E0">
<!-- ホーム画面に追加したときの設定（PWA の準備） -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="images/icon-192.png">
<link rel="apple-touch-icon" href="images/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="タヌくん">
<link rel="stylesheet" href="style.css">
</head>
<body class="mode-home">
<!-- 時間帯の背景の飾り（星・ホタル・太陽など。style.css の body[data-time=…]） -->
<div id="sky" aria-hidden="true"><i class="sun"></i><i class="moon"></i><i class="stars"></i><i class="fly f1"></i><i class="fly f2"></i><i class="fly f3"></i></div>
<main id="app">

  <!-- 上のバー：メニュー画面では「何日目」、遊ぶ画面では「もどる」とハート -->
  <header id="topbar">
    <button id="back" class="back" type="button" data-i18n>‹ もどる</button>
    <div id="days" class="days">
      <div class="days-main"><span data-i18n>なかよし</span> <b id="days-total">1</b> <span data-i18n>日目</span></div>
      <div class="days-sub" id="days-streak"></div>
    </div>
    <div id="play-hearts" class="hearts" aria-label="なかよし度" data-i18n-attr="aria-label"></div>
    <!-- 今日のハートが上限になったら「🌙 あと○時間○分」 -->
    <div id="cap-note" class="cap-note" hidden></div>
    <!-- お試し版だけ表示 -->
    <div class="demo-bar">
      <span class="demo-badge">お試し版</span>
      <button id="btn-result" class="btn btn-result" type="button">🔮 診断する</button>
    </div>
  </header>

  <div id="stage">
    <div id="bubble" class="bubble" aria-live="polite"></div>
    <div id="tanu-area">
      <div class="ground"></div>
      <!-- 動きごとに入れ物を分けて、動きが重なっても崩れないようにしています -->
      <div id="tanu-move">
        <div id="tanu-melt">
          <div id="tanu-body">
            <div id="tanu-breath">
              <img id="tanu-img" alt="タヌくん" data-i18n-attr="alt" draggable="false">
              <!-- おなかだけ揺らすための重ね絵（同じ絵のおなか部分だけを、ふちをぼかして重ねる） -->
              <div id="belly-layer" aria-hidden="true"><img id="belly-img" alt="" draggable="false"></div>
              <!-- きせかえパーツ（デベソなど）を重ねるところ。揺れている間は canvas の絵に入る -->
              <div id="parts-layer" aria-hidden="true"></div>
              <!-- おなかを変形させた絵を描くところ（揺れている間だけ表示） -->
              <canvas id="belly-canvas" aria-hidden="true"></canvas>
              <!-- 寝ているとき（時間帯）：鼻ちょうちんと 💤（位置は config.js の timeOfDay.nose） -->
              <div id="sleep-fx" aria-hidden="true"><i class="snot"></i><b class="zz">z</b><b class="zz z2">Z</b></div>
            </div>
          </div>
        </div>
      </div>
      <div id="zones"></div>
    </div>
    <!-- なでなでゲージ（本編だけ）：さわるごとに葉っぱが1枚ずつ緑になり、たまるとレポート -->
    <div id="gauge" class="gauge" aria-hidden="true"></div>
  </div>

  <!-- メニュー画面のボタン -->
  <nav id="menu">
    <button id="btn-play" class="btn btn-main" type="button">
      <span data-i18n>遊ぶ</span>
      <span id="menu-hearts" class="hearts" aria-label="なかよし度" data-i18n-attr="aria-label"></span>
    </button>
    <!-- ぽんぽこリズム（pon/ の別ページ）。はじめて開くまで NEW -->
    <div class="game-row">
      <a id="btn-pon" class="btn btn-pon" href="pon/"><span data-i18n>🥁 ぽんぽこリズム</span><span id="pon-new" class="new-badge" hidden>NEW</span></a>
      <!-- ぽよんラリー（rally/ の別ページ）。公開スイッチ features.rally -->
      <a id="btn-rally" class="btn btn-pon" href="rally/" hidden><span data-i18n>🏐 ぽよんラリー</span></a>
    </div>
    <div class="btn-row">
      <button id="btn-record" class="btn" type="button" data-i18n>実績</button>
      <button id="btn-wear" class="btn" type="button" data-i18n>きせかえ</button>
      <button id="btn-settings" class="btn" type="button" data-i18n>設定</button>
    </div>
  </nav>

  <!-- はじめての人に呼び名を聞く -->
  <form id="name-form" class="name-form" autocomplete="off">
    <input id="name-input" class="name-input" type="text" maxlength="10"
           placeholder="呼んでほしい名前" aria-label="呼んでほしい名前" data-i18n-attr="placeholder aria-label" enterkeyhint="done">
    <button class="btn btn-main" type="submit" data-i18n>これでOK</button>
    <button id="name-skip" class="link" type="button" data-i18n>あとできめる</button>
    <p class="note small" data-i18n>名前はこのスマホの中だけに保存されます（ニックネームでOK）</p>
  </form>

  <p class="hint">頭・むね・おなか・しっぽをさわってね</p>
</main>

<!-- 実績・設定のパネル -->
<div id="sheet" class="sheet" hidden>
  <div class="sheet-box" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <h2 id="sheet-title"></h2>
    <div id="sheet-body"></div>
    <button id="sheet-close" class="btn" type="button" data-i18n>とじる</button>
  </div>
</div>

<!-- 思い出（ハートをゲットしたときの特別イラスト）：全画面で絵と台詞 -->
<div id="event" class="event" hidden>
  <div class="ev-pic"><img class="ev-bg" alt=""><img class="ev-img" alt=""></div>
  <div class="ev-title"></div>
  <button class="ev-skip" type="button" aria-label="とじる" data-i18n-attr="aria-label">×</button>
  <!-- 思い出が始まる前の合図（ハートがたまった → 思い出がひらく） -->
  <div class="ev-intro" hidden>
    <div class="ev-bigheart">💖</div>
    <p class="ev-i1"></p>
    <p class="ev-i2"></p>
    <p class="ev-i3" data-i18n>タップしてつづける</p>
  </div>
  <div class="ev-box">
    <div class="ev-name" data-i18n>タヌくん</div>
    <p class="ev-text"></p>
    <span class="ev-next">▼</span>
  </div>
</div>

<!-- お知らせ（なかよし度アップ など） -->
<div id="toast" class="toast" aria-live="polite"></div>

<!-- 読み込む順番が大事です：設定 → セリフ → 記録 → おなか → 本体 -->
<script src="config.js"></script>
<script src="config.en.js"></script>
<script src="lines.js"></script>
<script src="lines.en.js"></script>
<script src="i18n.js"></script>
<script src="save.js"></script>
<script src="belly.js"></script>
<script src="app.js"></script>
</body>
</html>
