<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ぽよんラリー｜タヌくん</title>
<meta name="theme-color" content="#BFE6FF">
<link rel="icon" href="../images/icon-192.png">
<link rel="stylesheet" href="rally.css">
</head>
<body>
<main id="rally">

  <!-- 上のバー：本編へ・いまのラリー回数・さいこう記録 -->
  <header class="bar">
    <a class="back" href="../" data-i18n>‹ タヌくん</a>
    <div id="lives" class="lives" aria-label="のこりのボール" data-i18n-attr="aria-label"></div>
    <div class="count"><b id="count">0</b><small data-i18n>ラリー</small></div>
    <div class="best"><span data-i18n>さいこう</span> <b id="best">0</b></div>
  </header>
  <!-- ひっさつのゲージ（ナイスでたまる）と、満タンで出るボタン -->
  <div id="gauge" class="gauge" aria-hidden="true"><span data-i18n>ひっさつ</span><i id="gauge-pips"></i></div>
  <button id="btn-special" class="special-btn" type="button" hidden>💥 ひっさつ</button>

  <!-- タヌくんの足もとの影 -->
  <div id="ground" class="ground" aria-hidden="true"></div>
  <!-- タヌくん（本編と同じ絵と、おなかの「ぷるん」） -->
  <div id="body">
    <img id="tanu-img" alt="タヌくん" data-i18n-attr="alt" draggable="false">
    <div id="parts-layer" aria-hidden="true"></div>
    <canvas id="belly-canvas" aria-hidden="true"></canvas>
  </div>
  <div id="say" class="say" hidden></div>

  <!-- ボールと、地面の影 -->
  <div id="shadow" class="shadow" aria-hidden="true"></div>
  <!-- もどってくるボールのまわりの輪（縮んで、ボールに重なったらナイス）。打てる間は光る -->
  <div id="target" class="target" aria-hidden="true" hidden><span data-i18n>いまだ！</span></div>
  <div id="ball" class="ball" aria-hidden="true"><i></i></div>
  <div id="pops" aria-hidden="true"></div>
  <!-- ひっさつのカットイン（タヌくんの顔と、ひとこと） -->
  <div id="cutin" class="cutin" aria-hidden="true" hidden>
    <div class="cutin-band">
      <img id="cutin-face" alt="" draggable="false">
      <div class="cutin-text"><span id="cutin-sub">ひっさつ！</span><b id="cutin-text">おもいっきり おいで！</b></div>
    </div>
  </div>
  <p id="hint" class="hint" hidden></p>
  <!-- はじめての人への指のガイド（👆 が上へすべる見本） -->
  <div id="guide" class="guide" aria-hidden="true" hidden><i>👆</i><b></b><span></span></div>

  <!-- はじめる前 -->
  <section id="start" class="sheet">
    <button id="btn-lang" class="lang-btn" type="button" hidden></button>
    <h1 data-i18n>🏐 ぽよんラリー</h1>
    <p data-i18n-html><b>上へ スワイプ</b>で ボールを 打とう！<br>輪が ボールに 重なったら 打ちかえしてね</p>
    <p id="start-art" class="small"></p>
    <button id="btn-start" class="btn" type="button" data-i18n>はじめる</button>
    <p class="small" data-i18n>🔊 音を出して遊んでね</p>
  </section>

  <!-- 結果：上にランク別イラスト、下に回数とボタン（ぽんぽこリズムと同じ形） -->
  <section id="result" class="result" hidden>
    <div class="r-art">
      <img id="r-img" alt="" draggable="false">
      <h2 id="r-title"></h2>
    </div>
    <div class="r-card">
    <p class="r-count" data-i18n-html>合計 <b id="r-count">0</b> ラリー</p>
    <p id="r-longest" class="r-longest"></p>
    <p id="r-best" class="r-best"></p>
    <p id="r-next" class="r-next" hidden></p>
    <p id="r-bonus" class="r-bonus" hidden></p>
    <p id="r-line" class="r-line"></p>
    <a id="btn-post" class="btn btn-x" target="_blank" rel="noopener" data-i18n>𝕏 でポストする</a>
    <button id="btn-again" class="btn" type="button" data-i18n>もう一回</button>
    <a class="btn btn-sub" href="../" data-i18n>タヌくんのところへ もどる</a>
    </div>
  </section>

</main>
<!-- 本編と同じ設定（おなかの揺れ）・ことば（i18n.js。ラリーの訳は rally.i18n.js）と揺れの仕組みを使う -->
<script src="../config.js"></script>
<script src="rally.i18n.js"></script>
<!-- 中国語の画面の文字（本編と共通の文。英語は i18n.js の中にある） -->
<script src="../i18n.zh.js"></script>
<script src="../i18n.js"></script>
<script src="../belly.js"></script>
<script src="rally.js"></script>
</body>
</html>
